// HTML de uma mídia dentro do slide (sem o wrapper .d-slide)
function midiaHTML(m, i, imediato){
  const p = PROJECTS[current];
  const alt = esc(tr(p.title));
  if (m.type === "video") {
    const id = YT(m.src);
    if (!id) return `<div class="ph">${esc(UI[lang].media_error)}</div>`;
    const { src, fb } = capaMidia(m);
    const attrSrc = imediato ? `src="${esc(src)}"${i === mid ? ' fetchpriority="high"' : ""}` : `data-src="${esc(src)}"`;
    return `<button class="d-play" type="button" data-play="${i}" aria-label="${esc(UI[lang].play)}">
      <img ${attrSrc} alt="${alt}" decoding="async" data-h="${p.h || 0}"${fb ? ` data-fb="${esc(fb)}"` : ""}></button>`;
  }
  if (m.type === "sketchfab") {
    const id = SK(m.src);
    if (!id) return `<div class="ph">${esc(UI[lang].media_error)}</div>`;
    let capaEl = `<span class="d-rotulo">SKETCHFAB</span>`;
    if (m.poster) {
      const attrSrc = imediato ? `src="${esc(m.poster)}"${i === mid ? ' fetchpriority="high"' : ""}` : `data-src="${esc(m.poster)}"`;
      capaEl = `<img ${attrSrc} alt="${alt}" decoding="async" data-h="${p.h || 0}">`;
    }
    return `<button class="d-play sk" type="button" data-play="${i}" aria-label="${esc(UI[lang].model3d)}">${capaEl}</button>`;
  }
  const attrSrc = imediato ? `src="${esc(m.src)}"${i === mid ? ' fetchpriority="high"' : ""}` : `data-src="${esc(m.src)}"`;
  return `<img ${attrSrc} alt="${alt}" decoding="async" data-h="${p.h || 0}">`;
}

// HTML de uma miniatura da tira de baixo.
function thumbHTML(m, i){
  const classe = m.type === "video" ? " vid" : m.type === "sketchfab" ? " sk" : "";
  const { src, fb } = capaMidia(m);
  const img = src ? `<img data-tsrc="${esc(src)}"${fb ? ` data-fb="${esc(fb)}"` : ""} alt="" decoding="async" fetchpriority="low">` : "";
  return `<button class="d-thumb${classe}" type="button" data-thumb="${i}" aria-current="${i === mid}"
    aria-label="${esc(UI[lang].media)} ${i + 1}">${img}</button>`;
}

function hidratarSlides(track, lista, modo){
  const total = lista.length;
  if (!total) return;
  const ativos = new Set([mid, (mid - 1 + total) % total, (mid + 1) % total]);
  if (modo === "carrossel") ativos.add(0);

  for (const idx of ativos) {
    const slide = track.children[idx];
    const img = slide && slide.querySelector("img");
    if (!img) continue;
    if (img.dataset.src) {
      img.src = img.dataset.src;
      delete img.dataset.src;
    }
    if (idx === mid) img.setAttribute("fetchpriority", "high");
    else img.removeAttribute("fetchpriority");
    if (!img.dataset.janelaOk) {
      img.dataset.janelaOk = "1";
      img.addEventListener("load", () => {
        const t = $("#d-track");
        if (!t || !$("#dlg")?.open) return;
        ajustarJanela(t, lista);
        ajustarLarguras(t);
        posicionarTrack(t);
      });
    }
  }
}

function hidratarThumbs(){
  const box = $("#d-thumbs");
  if (!box || box.hidden) return;
  const run = ++thumbRun;
  const fila = () => [...box.querySelectorAll("img[data-tsrc]")].sort((a, b) => {
    const ia = +a.parentElement.dataset.thumb, ib = +b.parentElement.dataset.thumb;
    return Math.abs(ia - mid) - Math.abs(ib - mid);
  });
  if (!fila().length) return;

  const proximo = () => {
    if (run !== thumbRun || !$("#dlg")?.open) return;
    const img = fila()[0];
    if (!img) return;
    const src = img.dataset.tsrc;
    delete img.dataset.tsrc;
    let foi = false;
    const seguir = () => {
      if (foi) return;
      foi = true;
      if (run === thumbRun && $("#dlg")?.open) proximo();
    };
    img.addEventListener("load", seguir, { once: true });
    img.addEventListener("error", seguir, { once: true });
    img.src = src;
    if (img.complete) seguir();
  };

  for (let w = 0; w < 2; w++) proximo();
}

// Deslocamento em pixels até o começo do slide i (base do modo carrossel).
function deslocamento(track, i){
  const slide = track.children[i];
  return slide ? slide.offsetLeft : 0;
}

// Janela do carrossel: tem a mesma proporção da imagem original (como no
// Instagram), então cada arte aparece inteira e as vizinhas ficam fora.
function ajustarJanela(track, lista){
  const palco = track.closest(".d-stage");
  if (!palco) return;
  if (!track.classList.contains("carrossel")) {
    palco.style.setProperty("--janela", "100%");
    palco.style.height = "";
    delete track.dataset.janela;
    return;
  }
  const midias = lista || (PROJECTS[current] && PROJECTS[current].media) || [];
  const primeira = midias[0];
  const img = track.children[0] && track.children[0].querySelector("img");
  let ratio = 0.8; // 4:5, proporção padrão do Instagram
  if (!primeira || primeira.type === "image") {
    if (img && img.naturalWidth && img.naturalHeight) ratio = img.naturalWidth / img.naturalHeight;
  } else {
    ratio = 16 / 9;
  }
  // Mede a altura disponível sem o height inline (senão a 2ª passagem mediria
  // a janela já encolhida e ela iria diminuindo a cada chamada).
  const anterior = palco.style.height;
  palco.style.height = "";
  const alturaMax = palco.clientHeight;
  const larguraMax = palco.clientWidth;
  palco.style.height = anterior;
  if (!alturaMax || !larguraMax) {
    requestAnimationFrame(() => {
      const t = $("#d-track");
      if (t) { ajustarJanela(t, lista); ajustarLarguras(t); posicionarTrack(t); }
    });
    return;
  }
  // Janela = maior retângulo com a proporção da arte que cabe no palco, sem
  // sobrar faixa preta em cima/embaixo (no celular o palco costuma ser mais
  // alto que a arte, então ele também encolhe).
  const largura = Math.round(Math.min(larguraMax, alturaMax * ratio));
  const altura = Math.round(Math.min(alturaMax, largura / ratio));
  palco.style.setProperty("--janela", largura + "px");
  palco.style.height = altura + "px";
  track.dataset.janela = String(largura);
}

function larguraDaJanela(track){
  const palco = track.closest(".d-stage");
  return Math.round(Number(track.dataset.janela) || (palco && palco.clientWidth) || 0);
}

// No carrossel cada slide tem a largura da janela; vídeo e 3D acompanham a mesma largura.
function ajustarLarguras(track){
  if (!track.classList.contains("carrossel")) return;
  const largura = larguraDaJanela(track);
  // diálogo ainda fechado (largura 0): refaz no próximo quadro, quando ele abrir
  if (!largura) {
    requestAnimationFrame(() => {
      const t = $("#d-track");
      if (t) { ajustarJanela(t); ajustarLarguras(t); posicionarTrack(t); }
    });
    return;
  }
  for (const slide of track.children) {
    // cada arte ocupa exatamente a janela; a proporção é preservada pelo object-fit
    slide.style.flex  = "0 0 " + largura + "px";
    slide.style.width = largura + "px";
  }
}

// Posiciona a mídia atual: porcentagem no modo slide, pixels no carrossel.
function posicionarTrack(track){
  track.style.transform = track.classList.contains("carrossel")
    ? "translateX(-" + deslocamento(track, mid) + "px)"
    : "translateX(-" + (mid * 100) + "%)";
}

// SVG do ícone de tela cheia (reutilizado em vários lugares)
const FS_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';

// Cria e retorna um botão .d-fs para o slide de índice i
function criarBtnFs(i) {
  const b = document.createElement("button");
  b.className = "d-fs";
  b.type = "button";
  b.dataset.fs = String(i);
  b.setAttribute("aria-label", "tela cheia");
  b.title = "tela cheia";
  b.innerHTML = FS_SVG;
  return b;
}

// Garante que cada slide com fullscreen:true tem um .d-fs e os sem não têm
function sincronizarBtnFs(track, lista) {
  [...track.children].forEach((slide, i) => {
    const m = lista[i];
    const btn = slide.querySelector(".d-fs");
    if (m && m.type === "image" && m.fullscreen) {
      if (!btn) slide.appendChild(criarBtnFs(i));
    } else {
      if (btn) btn.remove();
    }
  });
}

// Renderiza o track inteiro ou atualiza a posição
function pintarMidia(){
  const p = PROJECTS[current];
  const lista = p.media || [];

  if (!lista.length) {
    thumbRun++;
    $("#d-view").innerHTML = `<div class="ph" style="--h:${p.h || 0}">${UI[lang].img}</div>`;
    $("#d-prev").hidden = true;
    $("#d-next").hidden = true;
    $("#d-count").hidden = true;
    $("#d-thumbs").hidden = true;
    $("#d-thumbs-wrap").hidden = true;
    $("#d-thumbs").innerHTML = "";
    $("#d-dots").hidden = true;
    $("#d-dots").innerHTML = "";
    return;
  }

  const modo = p.galeria === "carrossel" ? "carrossel" : "slide";
  const total = lista.length;
  const iniciais = new Set([mid, (mid - 1 + total) % total, (mid + 1) % total]);
  if (modo === "carrossel") iniciais.add(0);

  let track = $("#d-track");
  // Recria quando muda o projeto/modo de galeria ou o número de itens
  if (!track || !track.classList.contains(modo) || track.children.length !== total) {
    $("#d-view").innerHTML = `<div class="d-track ${modo}" id="d-track">
      ${lista.map((m, i) => `<div class="d-slide${m.type === "image" ? "" : " is-video"}" data-index="${i}">${midiaHTML(m, i, iniciais.has(i))}${m.type === "image" && m.fullscreen ? `<button class="d-fs" type="button" data-fs="${i}" aria-label="tela cheia" title="tela cheia">${FS_SVG}</button>` : ""}</div>`).join('')}
    </div>`;
    track = $("#d-track");

    hidratarSlides(track, lista, modo);
    ajustarJanela(track, lista);
    ajustarLarguras(track);
    // Posiciona instantaneamente sem animação no primeiro carregamento
    track.style.transition = 'none';
    posicionarTrack(track);
    void track.offsetWidth; // Força o navegador a recalcular
    track.style.transition = ''; // Restaura a animação
  } else {
    // Se só mudou de posição, anima suavemente e hidrata vizinhos sob demanda
    hidratarSlides(track, lista, modo);
    ajustarJanela(track, lista);
    ajustarLarguras(track);
    posicionarTrack(track);
  }

  // Garante botões de tela cheia em todos os slides marcados
  sincronizarBtnFs(track, lista);

  // Limpa iframes de vídeos que não estão ativos para não ficarem rodando
  [...track.children].forEach((slide, i) => {
    if (i !== mid && slide.querySelector('iframe')) {
      slide.innerHTML = midiaHTML(lista[i], i, iniciais.has(i));
      // re-adiciona botão se necessário (innerHTML limpou) — imagem não vira iframe,
      // mas mantemos a guarda por segurança
      const m = lista[i];
      if (m && m.type === "image" && m.fullscreen) slide.appendChild(criarBtnFs(i));
    }
  });

  // Atualiza setas, contador, miniaturas e bolinhas
  const varias = total > 1;
  $("#d-prev").hidden = !varias;
  $("#d-next").hidden = !varias;
  $("#d-count").hidden = !varias;
  $("#d-count").textContent = varias ? (mid + 1) + " / " + total : "";

  const ehCarrossel = modo === "carrossel";
  const thumbs = $("#d-thumbs");
  const mostraThumbs = varias && !ehCarrossel;
  thumbs.hidden = !mostraThumbs;
  $("#d-thumbs-wrap").hidden = !mostraThumbs;
  if (mostraThumbs) {
    const chave = current + ":" + total + ":" + lang;
    if (thumbs.dataset.chave !== chave) {
      thumbs.dataset.chave = chave;
      thumbs.innerHTML = lista.map(thumbHTML).join("");
    } else {
      thumbs.querySelectorAll("[data-thumb]").forEach(b =>
        b.setAttribute("aria-current", String(+b.dataset.thumb === mid))
      );
    }
    hidratarThumbs();
    const thumbAtivo = thumbs.querySelector(`[data-thumb="${mid}"]`);
    if (thumbAtivo) thumbs.scrollTo({ left: thumbAtivo.offsetLeft - thumbs.clientWidth / 2 + thumbAtivo.offsetWidth / 2, behavior: "smooth" });
  }

  const dots = $("#d-dots");
  const mostraDots = varias && ehCarrossel;
  dots.hidden = !mostraDots;
  if (mostraDots) {
    if (dots.children.length !== total) {
      dots.innerHTML = lista.map((_, i) => `<button type="button" data-dot="${i}" aria-current="${i === mid}" aria-label="${i + 1} / ${total}"></button>`).join("");
    } else {
      dots.querySelectorAll("[data-dot]").forEach(b =>
        b.setAttribute("aria-current", String(+b.dataset.dot === mid))
      );
    }
  } else {
    dots.innerHTML = "";
  }
}

// Troca a mídia (n = +1 ou -1)
function irMedia(n){
  const total = (PROJECTS[current].media || []).length;
  if (total < 2) return;
  mid = (mid + n + total) % total;
  pintarMidia();
}

// ---------- overlay de tela cheia ----------
// Aplica pan + zoom na imagem (sem rotação: no celular, basta virar a tela).
function fsAplicarTransform(){
  const img = $("#fs .fs-img"), peer = $("#fs .fs-img-peer");
  if (!img) return;
  img.style.transform = `translate(${(fsPanX + fsSwipeDx).toFixed(1)}px, ${fsPanY.toFixed(1)}px) scale(${fsZoom.toFixed(3)})`;
  img.style.cursor = fsZoom > 1.01 ? "grab" : "default";
  if (peer) {
    const off = fsPeerDir * (fsPeerLargura + fsEspacamento); // +1 => direita; -1 => esquerda
    peer.style.transform = `translate(${(off + fsSwipeDx).toFixed(1)}px, 0px) scale(1)`;
  }
}

function fsResetZoom(){
  fsZoom = 1; fsPanX = 0; fsPanY = 0; fsSwipeDx = 0;
  fsPeerDir = 0; fsPeerLargura = 0; fsEspacamento = 0;
  const peer = $("#fs .fs-img-peer");
  if (peer) peer.style.opacity = "0";
  fsPontos.clear(); fsGesto = null;
  fsAplicarTransform();
}

// Mostra a imagem apontada por fsPos dentro de fsIndices.
function fsMostrar(){
  const img = $("#fs .fs-img");
  const i = fsIndices[fsPos];
  const m = (PROJECTS[current]?.media || [])[i];
  if (!img || !m || m.type !== "image" || !m.src) return;

  img.src = m.src;
  fsResetZoom(); // cada imagem começa sem zoom

  // setas só fazem sentido com mais de uma imagem
  const many = fsIndices.length > 1;
  $("#fs .fs-prev").hidden = !many;
  $("#fs .fs-next").hidden = !many;
}

// Abre o overlay na mídia i. A navegação interna percorre SOMENTE as imagens
// marcadas com fullscreen no painel — as demais nunca aparecem em tela cheia.
function abrirFullscreen(i){
  const p = PROJECTS[current];
  const m = (p.media || [])[i];
  if (!m || m.type !== "image" || !m.src || !m.fullscreen) return;

  fsIndices = (p.media || [])
    .map((x, idx) => (x && x.type === "image" && x.src && x.fullscreen) ? idx : -1)
    .filter(idx => idx >= 0);
  fsPos = Math.max(0, fsIndices.indexOf(i));

  const fsEl = $("#fs"), dlg = $("#dlg");
  // Um <dialog> aberto com showModal() fica numa top layer acima de qualquer z-index.
  // Por isso o overlay precisa viver DENTRO do dialog enquanto está aberto:
  // se ficar no <body>, os cliques atravessam e caem no modal (fechando tudo).
  if (dlg && fsEl.parentNode !== dlg) dlg.appendChild(fsEl);
  fsEl.hidden = false;                 // mostra antes de pedir fullscreen
  fsMostrar();
  document.documentElement.style.overflow = "hidden";
  document.body.style.overflow = "hidden";
  try {
    const req = fsEl.requestFullscreen && fsEl.requestFullscreen();
    if (req && req.catch) req.catch(() => {});
  } catch(e){}
}

// Troca imediata, sem animação (usada no fim do deslize).
function fsTrocar(n){
  if (fsIndices.length < 2) return;
  const fsEl = $("#fs"), img = $("#fs .fs-img");
  fsEl.classList.remove("fs-deslizando");
  void img.offsetWidth; // garante que o reset NÃO herde a transição
  fsPos = (fsPos + n + fsIndices.length) % fsIndices.length;
  fsMostrar();
}

// Conclui uma troca pendente: evita travar quando o usuário navega rápido.
function fsFinalizarAnim(){
  if (!fsAnimTimer) return;
  clearTimeout(fsAnimTimer);
  fsAnimTimer = null;
  const dir = fsAnimDir; fsAnimDir = 0;
  if (dir) fsTrocar(dir);
}

// Anda entre as imagens com deslizamento suave (botões, teclado e arraste).
function fsMover(n){
  if (fsIndices.length < 2) return;
  fsFinalizarAnim(); // navegação rápida: comita a anterior e começa outra limpa

  const dir = n > 0 ? 1 : -1;
  const viz = (PROJECTS[current]?.media || [])[fsIndices[fsPos + dir]];
  if (!viz || !viz.src) { fsTrocar(n); return; }

  const fsEl = $("#fs"), img = $("#fs .fs-img"), peer = $("#fs .fs-img-peer");
  fsEl.classList.remove("fs-deslizando");
  fsPeerDir = dir;
  fsPeerLargura = img.getBoundingClientRect().width || window.innerWidth * 0.9;
  fsEspacamento = Math.min(160, window.innerWidth * 0.12);
  const fim = fsPeerLargura + fsEspacamento;
  fsSwipeDx = 0;
  peer.src = viz.src;
  peer.style.opacity = "1";
  fsAplicarTransform(); // atual no centro, vizinha separada pelo espaçamento
  void img.offsetWidth;

  fsEl.classList.add("fs-deslizando");
  fsSwipeDx = -dir * fim;
  fsAplicarTransform();

  fsAnimDir = dir;
  fsAnimTimer = setTimeout(() => {
    fsAnimTimer = null;
    const d = fsAnimDir; fsAnimDir = 0;
    if (d) fsTrocar(d);
  }, 360);
}

function fecharFullscreen(){
  const fsEl = $("#fs");
  clearTimeout(fsAnimTimer);
  fsAnimTimer = null; fsAnimDir = 0;
  fsEl.classList.remove("fs-deslizando");
  // Sai do fullscreen do navegador ANTES de esconder o elemento (evitaEstado sujo).
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e){}
  if (fsEl) fsEl.hidden = true;
  // NÃO limpar img.src: src vazio dispara o handler global de erro e troca o <img> por .ph.
  // Só libera o scroll da página se o modal não estiver aberto.
  if (!$("#dlg").open) {
    document.documentElement.style.overflow = "";
    document.body.style.overflow = "";
  }
}

$("#fs .fs-close").addEventListener("click", fecharFullscreen);
$("#fs .fs-prev").addEventListener("click", () => fsMover(-1));
$("#fs .fs-next").addEventListener("click", () => fsMover(1));
// Clique na área preta NÃO fecha (evita sair sem querer ao errar as setas).
// Saída só pelo × ou Esc.

// Roda do mouse: zoom centrado (1x a 6x).
$("#fs").addEventListener("wheel", e => {
  if ($("#fs").hidden) return;
  e.preventDefault();
  fsZoom = Math.min(6, Math.max(1, fsZoom * Math.exp(-e.deltaY * 0.0015)));
  if (fsZoom <= 1.001) { fsZoom = 1; fsPanX = fsPanY = 0; }
  fsAplicarTransform();
}, { passive: false });

// Drag / swipe: troca de imagem em 1x; com zoom, arrasta a imagem.
// Duas pontas (pinça): zoom proporcional à distância entre os dedos.
$("#fs").addEventListener("pointerdown", e => {
  if ($("#fs").hidden || e.target.closest(".fs-nav, .fs-close")) return;
  // começo do gesto: comita troca pendente e deixa o dedo comandar direto
  fsFinalizarAnim();
  $("#fs").classList.remove("fs-deslizando");
  fsEspacamento = Math.min(160, window.innerWidth * 0.12);
  fsPontos.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (fsPontos.size === 1) {
    fsGesto = {
      modo: fsZoom > 1.01 ? "pan" : "arraste",
      x0: e.clientX, y0: e.clientY,
      panX0: fsPanX, panY0: fsPanY, moved: false
    };
    const r = $("#fs .fs-img").getBoundingClientRect();
    fsPeerLargura = r.width || window.innerWidth * 0.9;
  } else if (fsPontos.size === 2) {
    const [a, b] = [...fsPontos.values()];
    fsGesto = {
      modo: "pinca",
      dist0: Math.hypot(a.x - b.x, a.y - b.y) || 1,
      zoom0: fsZoom, moved: true
    };
  }
  try { $("#fs").setPointerCapture(e.pointerId); } catch(err){}
});

window.addEventListener("pointermove", e => {
  if ($("#fs").hidden || !fsPontos.has(e.pointerId) || !fsGesto) return;
  fsPontos.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (fsGesto.modo === "pinca" && fsPontos.size >= 2) {
    const [a, b] = [...fsPontos.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    fsZoom = Math.min(6, Math.max(1, fsGesto.zoom0 * d / fsGesto.dist0));
    if (fsZoom <= 1.001) { fsZoom = 1; fsPanX = fsPanY = 0; }
    fsAplicarTransform();
  } else if (fsGesto.modo === "pan" && fsPontos.size === 1) {
    fsPanX = fsGesto.panX0 + (e.clientX - fsGesto.x0);
    fsPanY = fsGesto.panY0 + (e.clientY - fsGesto.y0);
    fsAplicarTransform();
  } else if (fsGesto.modo === "arraste" && fsPontos.size === 1) {
    const dx = e.clientX - fsGesto.x0, dy = e.clientY - fsGesto.y0;
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
      fsGesto.moved = true;
      const dir = dx < 0 ? 1 : -1; // 1 = próxima (vem da direita), -1 = anterior
      if (dir !== fsPeerDir) {
        fsPeerDir = dir;
        const peer = $("#fs .fs-img-peer");
        const viz = (PROJECTS[current]?.media || [])[fsIndices[fsPos + dir]];
        if (peer && viz && viz.src) {
          peer.src = viz.src;
          peer.style.opacity = "1";
        } else {
          fsPeerDir = 0; // não há vizinha marcada
        }
      }
      // acompanha o dedo 1:1, limitado à largura de uma imagem
      const livre = fsPeerLargura + fsEspacamento;
      fsSwipeDx = Math.max(-livre, Math.min(livre, dx));
      fsAplicarTransform();
    }
  }
});

const fsFimGesto = e => {
  if (!fsPontos.has(e.pointerId)) return;
  fsPontos.delete(e.pointerId);

  const eraArraste = fsGesto && fsGesto.modo === "arraste" && fsPontos.size === 0;
  let pulou = 0;
  if (eraArraste && fsGesto.moved) {
    const dx = e.clientX - fsGesto.x0;
    const limiar = Math.max(60, window.innerWidth * 0.12);
    if (dx < -limiar) pulou = 1;
    else if (dx > limiar) pulou = -1;
  }

  if (eraArraste) {
    const fsEl = $("#fs"), peerFim = $("#fs .fs-img-peer");
    clearTimeout(fsAnimTimer);
    fsAnimDir = 0;
    if (pulou && fsPeerDir) {
      // conclui o deslize mantendo a distância entre as imagens
      const dir = fsPeerDir, fim = fsPeerLargura + fsEspacamento;
      fsEl.classList.add("fs-deslizando");
      fsSwipeDx = -dir * fim;
      fsAplicarTransform();
      fsAnimDir = dir;
      fsAnimTimer = setTimeout(() => {
        fsAnimTimer = null;
        const d = fsAnimDir; fsAnimDir = 0;
        if (d) fsTrocar(d);
      }, 360);
    } else {
      // não passou do limiar: volta suavemente ao centro
      fsEl.classList.add("fs-deslizando");
      fsSwipeDx = 0;
      fsAplicarTransform();
      fsAnimTimer = setTimeout(() => {
        if (peerFim) peerFim.style.opacity = "0";
        fsPeerDir = 0; fsPeerLargura = 0; fsEspacamento = 0;
        fsEl.classList.remove("fs-deslizando");
        fsAnimTimer = null;
      }, 360);
    }
  }

  if (fsGesto && fsGesto.modo === "pinca" && fsPontos.size === 1) {
    const p = [...fsPontos.values()][0];
    fsGesto = { modo: "pan", x0: p.x, y0: p.y, panX0: fsPanX, panY0: fsPanY, moved: true };
  } else if (fsPontos.size === 0) {
    fsGesto = null;
  }
};
window.addEventListener("pointerup", fsFimGesto);
window.addEventListener("pointercancel", fsFimGesto);

// Esc dentro do fullscreen: fecha só o overlay, nunca o modal.
document.addEventListener("keydown", e => {
  if ($("#fs").hidden) return;
  if (e.key === "ArrowRight") { e.preventDefault(); e.stopPropagation(); fsMover(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); e.stopPropagation(); fsMover(-1); }
  else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); fecharFullscreen(); }
}, true);

// O navegador consome o Esc para sair do fullscreen; espelha isso no nosso overlay.
document.addEventListener("fullscreenchange", () => {
  if (!$("#fs").hidden && !document.fullscreenElement) fecharFullscreen();
});

function tocar(i, autoplay = true){
  const p = PROJECTS[current];
  const m = (p.media || [])[i];
  if (!m) return;

  const slide = document.querySelector(`.d-slide[data-index="${i}"]`);
  if (!slide) return;

  const titulo = esc(tr(p.title));
  if (m.type === "video") {
    const id = YT(m.src);
    if (!id) return;
    const origem = /^https?:$/.test(location.protocol) ? `&origin=${encodeURIComponent(location.origin)}` : "";
    slide.innerHTML = `<iframe
      src="https://www.youtube.com/embed/${id}?autoplay=${autoplay ? 1 : 0}&rel=0&playsinline=1${origem}"
      title="${titulo}"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>`;
  } else if (m.type === "sketchfab") {
    const id = SK(m.src);
    if (!id) return;
    slide.innerHTML = `<iframe src="https://sketchfab.com/models/${id}/embed?autospin=0.2&autostart=${autoplay ? 1 : 0}&ui_theme=dark"
      title="${titulo}" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe>`;
  }
}

// Teclado (← →), Swipe (arrastar) e clique
function ligarGaleria(){
  const dlg = $("#dlg"), palco = dlg.querySelector(".d-stage");

  // Esc nativo do <dialog> com o fullscreen aberto deve fechar só o overlay.
  dlg.addEventListener("cancel", e => {
    if (!$("#fs").hidden) { e.preventDefault(); fecharFullscreen(); }
  });

  // Teclado
  dlg.addEventListener("keydown", e => {
    if (!$("#fs").hidden) return; // setas pertencem ao overlay de tela cheia
    if (e.key === "ArrowRight") { e.preventDefault(); irMedia(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); irMedia(-1); }
  });

  // Garante parada de vídeo/3D e limpeza do hash ao fechar (botão, clique fora ou Esc)
  dlg.addEventListener("close", () => {
    thumbRun++;
    $("#d-view").innerHTML = "";
    $("#d-thumbs").innerHTML = "";
    delete $("#d-thumbs").dataset.chave;
    document.documentElement.style.overflow = "";
    document.body.style.overflow = "";
    if (location.hash.includes("/")) {
      try { history.replaceState(null, "", "#" + (area || AREAS[0]?.id || "")); } catch(err){}
    }
  });

  // Arrastar (Swipe)
  let x0 = null, y0 = null, dragging = false;
  let track = null, largura = 0, startTranslate = 0;

  palco.addEventListener("pointerdown", e => {
    if (e.button > 0 || e.target.closest(".d-nav, .d-thumbs, .d-dots, iframe")) return;

    track = $("#d-track");
    if (!track) return;
    largura = larguraDaJanela(track) || palco.offsetWidth;
    if (!largura) return;

    x0 = e.clientX;
    y0 = e.clientY;
    dragging = false;
    startTranslate = -deslocamento(track, mid);

    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';
  });

  palco.addEventListener("pointermove", e => {
    if (x0 === null || !track) return;
    const dx = e.clientX - x0;
    const dy = e.clientY - y0;

    if (!dragging) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
        dragging = true;
        track.style.transition = 'none';
        palco.setPointerCapture(e.pointerId);
      } else {
        return;
      }
    }

    track.style.transform = `translateX(${startTranslate + dx}px)`;
  });

  const finalizarArraste = (e) => {
    if (!track) return;
    document.body.style.userSelect = '';
    document.body.style.webkitUserSelect = '';

    if (!dragging) { x0 = null; return; }

    const dx = e.clientX - x0;
    x0 = null;
    dragging = false;

    track.style.transition = '';

    const limiar = largura * 0.15;

    if (dx > limiar && mid > 0) {
      irMedia(-1);
    } else if (dx < -limiar && mid < track.children.length - 1) {
      irMedia(1);
    } else {
      posicionarTrack(track);
    }
  };

  palco.addEventListener("pointerup", finalizarArraste);
  palco.addEventListener("pointercancel", () => {
    if (track) {
      track.style.transition = '';
      posicionarTrack(track);
    }
    x0 = null; dragging = false;
    document.body.style.userSelect = '';
    document.body.style.webkitUserSelect = '';
  });

  // janela mudou de tamanho: larguras e posição precisam ser recalculadas
  addEventListener("resize", () => {
    if (!dlg.open) return;
    const t = $("#d-track");
    if (!t) return;
    ajustarJanela(t);
    ajustarLarguras(t);
    posicionarTrack(t);
  });
}

// Um único "ouvinte" de cliques para: abas, filtros, cards, fechar modal e idioma.
document.addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (t) { pick(t.dataset.id, true); return; }
  const f = e.target.closest(".chip");
  if (f) { filter = f.dataset.c; renderPainel(true); return; }
  const b = e.target.closest(".item");
  if (b) {
    current = +b.dataset.i;
    const p = PROJECTS[current];
    fill(current);
    $("#dlg").showModal();
    $("#d-scroll").scrollTop = 0;
    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";
    const s = slugProj(p);
    if (p) { try { history.replaceState(null, "", "#" + p.area + (s ? "/" + s : "")); } catch(err){} }
    return;
  }
  const th = e.target.closest("[data-thumb]");
  if (th) { mid = +th.dataset.thumb; pintarMidia(); return; }
  const dt = e.target.closest("[data-dot]");
  if (dt) { mid = +dt.dataset.dot; pintarMidia(); return; }
  const nv = e.target.closest("[data-step]");
  if (nv) { irMedia(+nv.dataset.step); return; }
  const pl = e.target.closest("[data-play]");
  if (pl) { tocar(+pl.dataset.play); return; }
  const fsb = e.target.closest("[data-fs]");
  if (fsb) { abrirFullscreen(+fsb.dataset.fs); return; }
  if (e.target.closest("#d-thumbs-prev")) { $("#d-thumbs").scrollBy({ left: -220, behavior: "smooth" }); return; }
  if (e.target.closest("#d-thumbs-next")) { $("#d-thumbs").scrollBy({ left: 220, behavior: "smooth" }); return; }
  if (e.target.closest("#close") || e.target.id === "dlg") {
    if (!$("#fs").hidden) { fecharFullscreen(); return; }
    fecharFullscreen();
    $("#dlg").close();
    return;
  }
  if (e.target.closest("#lang")) {
    lang = lang === "pt" ? "en" : "pt";
    try { localStorage.setItem("lang", lang); } catch(err){}
    render();
    return;
  }
  const trk = e.target.closest(".trk");
  if (trk) {
    const hud = trk.closest(".player-hud");
    hud.querySelectorAll(".trk").forEach(x => x.classList.toggle("on", x === trk));
    hud.style.setProperty("--prog", (trk.dataset.pct || 41) + "%");
    return;
  }
  const pb = e.target.closest("[data-pl]");
  if (pb) {
    const hud = pb.closest(".player-hud"), op = pb.dataset.pl;
    if (op === "play") hud.classList.toggle("paused");
    else if (op === "repeat" || op === "shuffle") pb.classList.toggle("lit");
    else {
      const list = [...hud.querySelectorAll(".trk")];
      const idx = list.findIndex(x => x.classList.contains("on"));
      const prox = list[(idx + (op === "next" ? 1 : -1) + list.length) % list.length];
      if (prox) {
        list.forEach(x => x.classList.toggle("on", x === prox));
        hud.style.setProperty("--prog", (prox.dataset.pct || 41) + "%");
      }
    }
    return;
  }
  const pbar = e.target.closest(".pl-bar");
  if (pbar) {
    const r = pbar.getBoundingClientRect();
    if (r.width > 0) {
      const pct = Math.max(4, Math.min(98, Math.round(((e.clientX - r.left) / r.width) * 100)));
      pbar.closest(".player-hud").style.setProperty("--prog", pct + "%");
    }
  }
});
/* imagem que o navegador não consegue mostrar (formato errado ou arquivo faltando)
   tenta o fallback (ex.: hqdefault no YouTube) ou vira placeholder */
document.addEventListener("error", e => {
  const img = e.target;
  if (!img || img.tagName !== "IMG" || img.closest(".fundo") || img.closest("#fs")) return;
  if (img.dataset.fb) {
    const fb = img.dataset.fb;
    delete img.dataset.fb;
    img.src = fb;
    return;
  }
  if (img.closest(".d-thumb")) {
    img.dataset.falhou = "1";
    img.remove();
    return;
  }
  if (img.dataset.falhou) return;
  img.dataset.falhou = "1";
  const ph = document.createElement("div");
  ph.className = "ph";
  ph.style.setProperty("--h", img.dataset.h || "0");
  ph.textContent = UI[lang].img;
  img.replaceWith(ph);
}, true);

function rotearHash(){
  let raw = location.hash.slice(1);
  try { raw = decodeURIComponent(raw); } catch(e) {}
  raw = raw.trim();
  if (!raw) {
    pick(AREAS[0]?.id, false);
    if ($("#dlg")?.open) $("#dlg").close();
    return;
  }
  if (raw === "top" || raw === "sobre" || raw === "contato") {
    if (!area && AREAS.length) pick(AREAS[0].id, false);
    return;
  }
  const barra = raw.indexOf("/");
  const areaId = barra >= 0 ? raw.slice(0, barra) : raw;
  const projSlug = barra >= 0 ? raw.slice(barra + 1) : "";
  pick(areaId, false);
  if (projSlug) {
    const idx = PROJECTS.findIndex(p => p.area === area && slugProj(p) === projSlug);
    if (idx >= 0) {
      current = idx;
      fill(current);
      if (!$("#dlg").open) $("#dlg").showModal();
      $("#d-scroll").scrollTop = 0;
      document.documentElement.style.overflow = "hidden";
      document.body.style.overflow = "hidden";
      return;
    }
  }
  if ($("#dlg")?.open) $("#dlg").close();
}

window.addEventListener("hashchange", rotearHash);
$("#tabs").addEventListener("keydown", e => {
  const k = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
  if (!k) return;
  e.preventDefault();
  const i = (AREAS.findIndex(a => a.id === area) + k + AREAS.length) % AREAS.length;
  pick(AREAS[i].id, true);
  $("#tab-" + AREAS[i].id).focus();
});

rotearHash();


/* aplica a cor de destaque do fundo sorteado (tabela PALETA, gerada por tools/paleta.js) */
function aplicarDestaque(url){
  let nome = String(url).split("/").pop() || "";
  try { nome = decodeURIComponent(nome); } catch(e) {}
  const cor = PALETA[nome];
  if (cor) document.documentElement.style.setProperty("--accent", cor);
}

/* fundo aleatório: sorteia uma imagem, e se o arquivo não existir tenta outra */
function sortear(cfg, el){
  if (!el || !cfg.total) return;
  const ordem = Array.from({length: cfg.total}, (_, i) => i + 1);
  for (let i = ordem.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [ordem[i], ordem[j]] = [ordem[j], ordem[i]];
  }
  const tentar = k => {
    if (k >= ordem.length) return;               // nenhum carregou: fica só o fundo escuro
    el.onload = () => {
      el.classList.add("ready");
      // a cor de destaque vem só da camada de trás (as camadas da frente são brancas)
      if (cfg === FUNDOS.base) aplicarDestaque(el.src);
    };
    el.onerror = () => tentar(k + 1);
    el.src = `${cfg.pasta}/${cfg.prefixo}${ordem[k]}.${cfg.ext}`;
  };
  tentar(0);
}
sortear(FUNDOS.base, $(".fundo .f1"));
sortear(FUNDOS.camada, $(".fundo .f2"));

/* parallax: as duas camadas estão no mesmo bloco, então se movem exatamente juntas */
(function(){
  const fundo = $(".fundo");
  if (!fundo || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  fundo.style.willChange = "transform";
  let ticking = false;
  addEventListener("scroll", () => {
    if (ticking || scrollY * (1 - FUNDOS.parallax) > fundo.offsetHeight + 100) return;
    ticking = true;
    requestAnimationFrame(() => {
      fundo.style.transform = `translate3d(0,${scrollY * FUNDOS.parallax}px,0)`;
      ticking = false;
    });
  }, { passive: true });
})();

/* sincroniza a altura do código de barras proporcionalmente com a logo (33% da altura) */
(function(){
  const logo = $(".hero-logo img");
  const barcode = $(".hero-barcode");
  if (!logo || !barcode) return;
  let lastH = 0, raf = null;
  const sync = () => {
    const h = logo.getBoundingClientRect().height;
    if (h > 0) {
      const target = Math.round(h * 0.33);
      if (target !== lastH && target >= 36) {
        lastH = target;
        barcode.style.setProperty("--bc-h", target + "px");
      }
    }
  };
  if ("ResizeObserver" in window) {
    const ro = new ResizeObserver(() => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        sync();
      });
    });
    ro.observe(logo);
  }
  addEventListener("resize", sync, { passive: true });
  if (logo.complete) sync();
  else logo.addEventListener("load", sync, { once: true });
})();

setupOverlayScrollbar(document.documentElement, true, false, 80);
