<style>
/* ============================================================
   GUIA RÁPIDO DE EDIÇÃO (CSS)
   - Cores do site ....... :root (logo abaixo)
   - Fontes .............. :root (--big / --tech / --mono)
   - Largura do conteúdo . .wrap
   - Altura do topo ...... --hero-h (seção "hero")
   - Abas/menu ........... seção "cabeçalho fixo + abas"
   - Cards de projeto .... seção "áreas" / .grid / .thumb
   - Sobre ............... seção "sobre"
   - Modal do projeto .... seção "projeto aberto"
   - Celular ............. seções com @media(max-width:640px)
   Os textos e a lista de projetos ficam no bloco de script, no fim do arquivo.
   ============================================================ */
:root{
  color-scheme:dark;
  /* ---------- CORES DO SITE (mude aqui e vale no site inteiro) ---------- */
  --ink:#050506;               /* fundo geral */
  --line:rgba(255,255,255,.13);/* bordas/divisórias */
  --white:#f4f4f2;             /* texto principal */
  --mute:#8d9490;              /* texto secundário */
  --accent:#ef2b31;            /* destaque padrão; o fundo sorteado troca este valor (ver PALETA) */
  /* ---------- FONTES (troque a família aqui; carregue o peso no head) ---------- */
  --big:"Bebas Neue","Arial Narrow",Impact,sans-serif;   /* títulos grandes */
  --tech:"Chakra Petch","Arial Narrow",Arial,sans-serif; /* texto/interface */
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;/* números/rótulos */
  /* ---------- TEXTURA DO VIDRO + MEDIDAS DO FUNDO E HERO ---------- */
  --grao:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23g)' opacity='.055'/></svg>");
  /* SCAN LINES do vidro: onda suave de 5px (transições em rampa, sem aresta) */
  --scan:repeating-linear-gradient(180deg,rgba(255,255,255,.01) 0,rgba(255,255,255,0) 1.25px,rgba(0,0,0,.2) 2.5px,rgba(0,0,0,0) 3.75px,rgba(255,255,255,.01) 5px);
  /* ruído fino do CRT (grão menor e mais denso que o --grao) */
  --ruido:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='1' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='90' height='90' filter='url(%23n)' opacity='.22'/></svg>");
  --fundo-h:133.34vw;          /* altura das camadas de fundo */
  --camada:.6;                 /* opacidade da 2ª camada */
  --hero-h:max(200px,35vh);    /* ALTURA DO TOPO = 35% da tela (mín. 200px) */
  --logo-max-h:40vh;           /* tamanho da logo mantido (independe da altura do hero) */
  --logo-sobe:1vh;             /* 0 = logo centralizada. Para subir, use ex.: 1vh */
  --thumb-h:clamp(320px,26vw,360px); /* miniaturas: altura igual (320px no mobile, 360px no PC = 2 paisagens por linha) */
}
@supports (height:max(1px,1vh)){:root{--fundo-h:max(133.34vw,130vh)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent} /* sem flash azul ao tocar no mobile */
/* barras de rolagem: overlay discreta (sem trilho/gutter), some sozinha como no mobile */
html{scroll-behavior:smooth;scroll-padding-top:80px;-webkit-text-size-adjust:100%;scrollbar-width:none}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar{display:none;width:0;height:0}
::-webkit-scrollbar-corner{background:transparent}
/* barras de rolagem customizadas (overlay, sem gutter, somem sozinhas) */
.ov-sb-track{position:absolute;opacity:0;pointer-events:auto;z-index:50;transition:opacity .7s ease}
.ov-sb-track.show{opacity:1;transition:opacity .15s ease}
.ov-sb-track.v{right:4px;top:0;width:6px}
.ov-sb-track.h{left:0;bottom:4px;height:6px;width:100%}
.ov-sb-thumb{position:absolute;background:rgba(244,244,242,.45);border-radius:999px}
.v .ov-sb-thumb{left:1px;width:4px;top:0}
.h .ov-sb-thumb{top:1px;height:4px;left:0}
.d-scroll{position:relative}
.d-thumbs{position:relative}
/* fundo e fonte padrão do site */
body{background:var(--ink);color:var(--white);font:400 1.0625rem/1.6 var(--tech);-webkit-font-smoothing:antialiased;position:relative}
a{color:inherit}
/* contorno de acessibilidade ao navegar com teclado */
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* LARGURA MÁXIMA DO CONTEÚDO: aumente/diminua o 1500px */
.wrap{width:min(1500px,100% - 2rem);margin-inline:auto}

/* janela: vidro jateado por dentro com superfície glossy lisa e borda abaulada fina + specular forte */
.win{
  position:relative;
  background-color:rgba(0,0,0,.50);
  background-image:
    var(--scan),
    var(--ruido),
    linear-gradient(102deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.022) 26%,transparent 48%),
    linear-gradient(118deg,rgba(18,22,30,.12),rgba(4,5,8,.46) 72%),
    var(--grao);
  background-size:auto,90px 90px,auto,auto,140px 140px;
  background-blend-mode:normal,overlay,screen,normal,overlay;
  border:0;
  border-radius:16px;
  overflow:hidden;
  box-shadow:
    0 22px 54px rgba(0,0,0,.66),
    0 2px 8px rgba(0,0,0,.52),
    inset 0 0 3px rgba(0,0,0,.28);
}
.win::before,.win::after,dialog::before,dialog::after{content:"";position:absolute;border-radius:inherit;pointer-events:none}
/* respiro mínimo atrás do reflexo (só pra o brilho não parecer recortado) */
.win::before,dialog::before{
  inset:0;z-index:3;mix-blend-mode:screen;
  background:
    radial-gradient(20px 48px at 1px 14px,rgba(255,255,255,.08),transparent 76%),
    radial-gradient(16px 32px at 1px calc(100% - 14px),rgba(255,255,255,.06),transparent 76%);
}
/* crista especular fina e dura (superfície lisa, roughness ~0): a luz nasce em cima da própria borda */
.win::after,dialog::after{
  /* banda a mesma distância da borda nas retas e nas curvas (evita degrau na junção) */
  --bvr:#0000 13.1px,rgba(0,0,0,.40) 13.7px,#000 14.4px 15.5px,rgba(0,0,0,.60) 16px;
  --bvl:rgba(0,0,0,.60) 0,#000 .5px 1.6px,rgba(0,0,0,.40) 2.3px,#0000 2.9px;
  inset:0;z-index:4;mix-blend-mode:screen;
  /* desalinho mínimo: desloca só no eixo horizontal, então o brilho continua encostado em cima e embaixo */
  transform:translateX(.4px);
  background:
    /* lateral esquerda: foco na aresta lateral + rastro longo descendo pelo lado */
    radial-gradient(8px 14px at 1px 14px,rgba(255,255,255,.70) 0 58%,rgba(255,255,255,.05) 76%,transparent 94%),
    radial-gradient(24px 140px at 1px 14px,rgba(255,255,255,.55) 0 16%,rgba(255,255,255,.04) 38%,rgba(255,255,255,.08) 68%,transparent 88%),
    radial-gradient(48px 16px at 12px 1px,rgba(255,255,255,.35),rgba(255,255,255,0) 55%,transparent 84%),
    /* quina TR: suave e reduzida (luz não é mais de cima) */
    radial-gradient(36px 14px at calc(100% - 8px) 1px,rgba(255,255,255,.18),transparent 84%),
    radial-gradient(14px 48px at calc(100% - 1px) 12px,rgba(255,255,255,.20),transparent 84%),
    /* quina BR: contraluz sutil */
    radial-gradient(48px 18px at calc(100% - 8px) calc(100% - 1px),rgba(255,255,255,.24),rgba(255,255,255,.05) 60%,transparent 86%),
    /* quina BL: rastro lateral descendo pela borda esquerda */
    radial-gradient(20px 52px at 1px calc(100% - 10px),rgba(255,255,255,.28),rgba(255,255,255,.06) 60%,transparent 86%),
    /* fio mínimo em toda a aresta (só pra silhueta não sumir no meio do lado) */
    linear-gradient(rgba(255,255,255,.10),rgba(255,255,255,.10));
  -webkit-mask:
    radial-gradient(circle at 16px 16px,var(--bvr)) 0 0/16px 16px no-repeat,
    radial-gradient(circle at 0 16px,var(--bvr)) 100% 0/16px 16px no-repeat,
    radial-gradient(circle at 16px 0,var(--bvr)) 0 100%/16px 16px no-repeat,
    radial-gradient(circle at 0 0,var(--bvr)) 100% 100%/16px 16px no-repeat,
    linear-gradient(180deg,var(--bvl)) 16px 0/calc(100% - 32px) 16px no-repeat,
    linear-gradient(0deg,var(--bvl)) 16px 100%/calc(100% - 32px) 16px no-repeat,
    linear-gradient(90deg,var(--bvl)) 0 16px/16px calc(100% - 32px) no-repeat,
    linear-gradient(270deg,var(--bvl)) 100% 16px/16px calc(100% - 32px) no-repeat;
          mask:
    radial-gradient(circle at 16px 16px,var(--bvr)) 0 0/16px 16px no-repeat,
    radial-gradient(circle at 0 16px,var(--bvr)) 100% 0/16px 16px no-repeat,
    radial-gradient(circle at 16px 0,var(--bvr)) 0 100%/16px 16px no-repeat,
    radial-gradient(circle at 0 0,var(--bvr)) 100% 100%/16px 16px no-repeat,
    linear-gradient(180deg,var(--bvl)) 16px 0/calc(100% - 32px) 16px no-repeat,
    linear-gradient(0deg,var(--bvl)) 16px 100%/calc(100% - 32px) 16px no-repeat,
    linear-gradient(90deg,var(--bvl)) 0 16px/16px calc(100% - 32px) no-repeat,
    linear-gradient(270deg,var(--bvl)) 100% 16px/16px calc(100% - 32px) no-repeat;
}
.win > *,dialog > *{position:relative;z-index:2}
@media (min-width: 768px){ .win{ backdrop-filter:blur(15px) saturate(135%); -webkit-backdrop-filter:blur(15px) saturate(135%); } }
@media (max-width: 767px){ .win{ background-color:rgba(6,8,12,.93); } }
.bar{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1.15rem .65rem;font:400 .85rem var(--mono);letter-spacing:.08em;color:var(--mute);
  /* entalhe: só o fio escuro da ranhura + lábio claro embaixo (sem sombra em cima) */
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 50%,transparent);
  border-bottom:1px solid rgba(0,0,0,.92);
  box-shadow:0 1px 0 rgba(255,255,255,.16)}
.win-ctl{display:inline-flex;align-items:center;gap:.85rem;opacity:.72;flex:0 0 auto}
.win-ctl i{display:block;width:12px;height:1px;background:currentColor}
.win-ctl b{display:block;width:11px;height:11px;position:relative}
.win-ctl b::before,.win-ctl b::after{content:"";position:absolute;left:50%;top:50%;width:13px;height:1px;background:currentColor}
.win-ctl b::before{transform:translate(-50%,-50%) rotate(45deg)}
.win-ctl b::after{transform:translate(-50%,-50%) rotate(-45deg)}
.hud-plus{position:absolute;width:14px;height:14px;pointer-events:none;z-index:5;color:rgba(255,255,255,.34);
  background:linear-gradient(currentColor,currentColor) center/100% 1px no-repeat,linear-gradient(currentColor,currentColor) center/1px 100% no-repeat}
.hud-plus.tr{top:1rem;right:1rem}
.hud-plus.bl{bottom:1rem;left:1rem}
.hud-plus.br{bottom:1rem;right:1rem}
.pl-menu,.pl-ico,.ftr-cat,.ftr-globe,.ftr-spk,.ico{fill:currentColor;fill-rule:evenodd}

/* topo */
#lang{font:500 .85rem var(--mono);letter-spacing:.1em;background:none;color:var(--white);border:1px solid var(--accent);padding:.3rem .75rem;border-radius:6px;cursor:pointer}
/* o preenchimento do hover só em aparelhos com mouse: no toque ele ficaria aceso */
@media(hover:hover){#lang:hover{background:var(--accent);color:var(--ink)}} /* texto escuro: o destaque é claro */

/* hero = linha de função + logo + código de barras no canto (tamanho próprio) */
.hero{position:relative;overflow:hidden;padding:clamp(.25rem,.8vw,.6rem) 0 clamp(.8rem,2vw,1.2rem)}
.hero-row{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(12px,1.8vw,24px);width:fit-content;max-width:100%;margin-inline:auto}
.hero-logo{display:block;margin:0;line-height:0;flex:0 1 auto;min-width:0}
.hero-logo img{display:block;width:auto;height:auto;max-width:100%;max-height:var(--logo-max-h);object-fit:contain}
/* código de barras: travado proporcionalmente com a logo (33% da altura da logo),
   aumentado em 10% e alinhado verticalmente à direita dela. Escala junto com a tela.
   --bc-h manda no tamanho de tudo. */
.hero-barcode{--bc-h:clamp(46px,min(calc(var(--logo-max-h)*.33),12.5vw),165px);flex:0 0 auto;height:var(--bc-h);width:auto;display:flex;align-items:stretch;gap:calc(var(--bc-h)*.052);color:var(--accent);opacity:.7;user-select:none;pointer-events:none}
.bc-bars{flex:0 0 calc(var(--bc-h)*.206);height:100%;width:calc(var(--bc-h)*.206);display:block}
.bc-txt{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);font:400 calc(var(--bc-h)*.093)/1 var(--mono);letter-spacing:.1em;white-space:nowrap}
/* fundo em duas camadas: ocupa a largura da tela, começa no topo da página e sobe
   mais devagar que ela (parallax). As duas camadas têm sempre o mesmo tamanho. */
.fundo-clip{position:absolute;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.fundo{position:absolute;top:0;left:0;width:100%;height:var(--fundo-h);
  -webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
/* object-position controla o enquadramento da foto; transition, o fade */
.fundo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;opacity:0;transition:opacity .8s}
.fundo img.ready{opacity:1}
.fundo .f2.ready{opacity:var(--camada)}
.hero .wrap{position:relative;z-index:2}

/* linha de função + botão EN */
.sub{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:nowrap;margin-bottom:.2rem;font:400 .95rem var(--mono);color:var(--mute);letter-spacing:.04em}
.sub > span[data-i18n]{flex:1 1 auto;min-width:0}
.sub .right{flex:0 0 auto;display:flex;align-items:center;gap:1rem}
/* em telas estreitas o "CG / 001" sai para o EN não cair para a linha de baixo */
@media(max-width:720px){.sub .right > span{display:none}}

/* áreas / grade de projetos */
.about{content-visibility:auto;contain-intrinsic-size:1px 500px}
.area{margin-top:0}
.area .head{padding:1.2rem 1.2rem 0}   /* espaço ao redor do título da área */
.area h2{font:400 clamp(2.6rem,6vw,4.4rem)/1 var(--big);letter-spacing:.02em}
.area .lead{color:var(--mute);max-width:56ch;margin-top:.4rem;white-space:pre-line}
/* GRADE: cards fluem com a largura natural da imagem; a altura é uniforme */
.grid{display:flex;flex-wrap:wrap;align-items:flex-start;gap:1.15rem;padding:1.4rem 1.2rem 1.4rem}
/* respiro extra no painel: o "+" do canto do vidro não pode cobrir os cards */
#panel .head,#panel .chips,#panel .grid{padding-left:2rem;padding-right:2rem}
#panel .grid{padding-bottom:2.2rem}
.item{flex:0 0 auto;display:block;width:auto;max-width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}
/* Miniaturas com a MESMA altura; a largura segue a proporção original da imagem (sem corte). */
.thumb{width:fit-content;max-width:none;overflow:hidden;background:#0c0d10;border:1px solid var(--line);border-radius:8px;position:relative;transition:border-color .2s}
/* fio de luz na aresta superior da miniatura (mesma linguagem do vidro) */
.thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.03)}
.item:hover .thumb{border-color:var(--accent)}
.thumb img{height:var(--thumb-h);width:auto;max-width:none;object-fit:contain;display:block;transition:transform .5s}
.thumb:has(.ph){height:var(--thumb-h);width:calc(var(--thumb-h) * 4 / 3)}
.item:hover .thumb img{transform:scale(1.015)}
/* etiqueta da categoria dentro da miniatura - so no filtro "Todos" */
.cat-etiqueta{position:absolute;top:.5rem;right:.6rem;z-index:2;max-width:calc(100% - 1.2rem);font:500 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;text-align:right;color:rgba(255,255,255,.5);text-shadow:0 1px 2px rgba(0,0,0,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.ph{position:absolute;inset:0;display:grid;place-items:center;font:400 .85rem var(--mono);color:var(--mute);letter-spacing:.08em;
  background:linear-gradient(160deg,hsl(var(--h) 30% 14%),#08090b)}
.item h3{font:500 1.2rem/1.2 var(--tech);margin-top:.7rem;letter-spacing:.03em}
/* CTA único depois da grade — só aparece no filtro "Todos" */
.cta-bloco{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:0 1.2rem 2.2rem;text-align:center}
.cta-bloco:empty{display:none}
.cta-kicker{font:400 .72rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.cta-main{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.7rem 1.6rem;background:var(--accent);border:1px solid var(--accent);border-radius:6px;color:#050506;font:700 .9rem var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;transition:filter .2s}
.cta-main:hover{filter:brightness(1.12)}
.cta-acoes{display:flex;flex-direction:column;align-items:stretch;gap:.6rem;width:fit-content;max-width:100%}
.cta-main{width:100%}
.cta-mail{display:flex;align-items:center;justify-content:center;width:100%;min-height:32px;padding:0 .4rem 2px;font:400 .85rem/1.3 var(--mono);color:var(--mute);text-decoration:none;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.cta-mail:hover{color:var(--accent);border-color:var(--accent)}
/* no desktop o bloco final fica ~10% maior */
@media(min-width:961px){
  .cta-bloco{gap:.66rem;padding-bottom:2.4rem}
  .cta-kicker{font-size:.79rem;letter-spacing:.15em}
  .cta-acoes{gap:.66rem}
  .cta-main{min-height:53px;padding:.77rem 1.76rem;font-size:.99rem}
  .cta-mail{min-height:35px;font-size:.94rem}
}

/* grid institucional estilo pôster (sobre + player) */
.home-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:clamp(1rem,2vw,1.4rem);align-items:start}
.side-col{display:grid;gap:clamp(1rem,2vw,1.4rem);min-width:0}
@media(max-width:960px){.home-grid{grid-template-columns:1fr}}

/* sobre (janela esquerda do pôster) */
.about{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(.8rem,2vw,1.5rem);padding:clamp(1.2rem,3vw,2.2rem)}
.about-side{display:flex;flex-direction:column;align-items:flex-end;gap:1.4rem;color:var(--mute)}
.vert-tag{writing-mode:vertical-rl;transform:rotate(180deg);font:400 .72rem/1 var(--mono);letter-spacing:.42em;color:var(--accent);opacity:.7;white-space:nowrap;user-select:none}
.pitch-lg{font:400 clamp(2.6rem,5.5vw,4.5rem)/.96 var(--big);letter-spacing:.02em;max-width:22ch;margin-bottom:1rem;white-space:pre-line;text-transform:uppercase}
.about-copy{max-width:58ch}
.about-copy+.about-copy{margin-top:.85rem}
.about-hr{border:0;height:1px;background:rgba(255,255,255,.5);margin:1.4rem 0 1rem}
.svc{list-style:none;padding:0;counter-reset:s}
.svc li{counter-increment:s;display:flex;gap:.85rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line);font:500 clamp(1rem,1.4vw,1.25rem) var(--tech);letter-spacing:.06em;text-transform:uppercase}
.svc li:last-child{border-bottom:0}
.svc li::before{content:counter(s,decimal-leading-zero);font:400 1.05rem var(--mono);color:var(--accent);flex:0 0 auto}
.svc li::after{content:"";order:1;flex:0 0 clamp(1.2rem,2.5vw,2rem);height:1px;background:linear-gradient(90deg,var(--mute) 0 42%,transparent 42% 58%,var(--mute) 58% 100%)}
.svc li span{order:2}

/* player musical HUD */
.player-hud{padding:.4rem .2rem 0;--prog:41%}
.pl-wrap{position:relative;display:flex;align-items:flex-end;gap:.8rem}
.pl-list{list-style:none;padding:0;margin:0;flex:1;min-width:0;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.18),#000 32%);mask-image:linear-gradient(180deg,rgba(0,0,0,.18),#000 32%)}
.trk{display:block;width:100%;text-align:left;background:none;border:0;padding:.38rem 0;color:var(--mute);cursor:pointer;font:400 .78rem/1.3 var(--tech);transition:color .18s}
.trk strong{display:block;font:500 .95rem/1.2 var(--tech);letter-spacing:.02em;color:inherit}
.trk small{display:block;font:400 .74rem/1.25 var(--mono);color:var(--mute)}
.trk:hover,.trk.on{color:var(--white)}
.trk.on strong{color:var(--white)}
.trk-e{display:inline-grid;place-items:center;width:.9em;height:.9em;margin-right:.35em;font-size:.72em;background:rgba(255,255,255,.45);color:var(--ink);border-radius:1px;font-weight:700;vertical-align:baseline}
.pl-menu{color:var(--accent);width:22px;height:14px;flex:0 0 auto;margin-bottom:.5rem;opacity:.7}
.pl-bar{position:relative;height:14px;display:flex;align-items:center;margin:.7rem 0 .45rem;cursor:pointer;opacity:.7}
.pl-bar::before{content:"";width:100%;height:3px;border-radius:99px;background:var(--accent);opacity:.38}
.pl-fill{position:absolute;left:0;width:var(--prog);height:3px;border-radius:99px;background:var(--accent);pointer-events:none}
.pl-knob{position:absolute;left:var(--prog);width:10px;height:10px;border-radius:50%;background:var(--accent);transform:translateX(-50%);pointer-events:none}
.pl-btns{display:flex;justify-content:space-around;align-items:center;padding-top:.2rem}
.pl-btn{background:none;border:0;padding:.35rem .5rem;color:var(--accent);cursor:pointer;display:grid;place-items:center;opacity:.7;transition:opacity .18s,transform .18s}
.pl-btn:hover,.pl-btn.lit{opacity:1;transform:scale(1.08)}
.player-hud.paused [data-pl="play"]{opacity:.4}
.pl-ico{width:20px;height:18px;display:block}
.pl-btn.main .pl-ico{width:22px;height:22px}

/* rodapé HUD */
.hud-ftr{margin-top:clamp(2.2rem,5vw,3.8rem);padding-bottom:clamp(2rem,4vw,3rem)}
.ftr-top{display:flex;align-items:center;gap:clamp(.8rem,2vw,1.6rem);color:var(--accent);opacity:.7}
.ftr-cat{width:clamp(50px,5.5vw,72px);height:auto;aspect-ratio:1;flex:0 0 auto}
.ftr-motto{display:grid;font:400 .88rem/1.4 var(--mono);letter-spacing:.04em;flex:0 0 auto}
.ftr-globe{width:clamp(64px,6.8vw,90px);height:auto;aspect-ratio:200/121;flex:0 0 auto}
.ftr-vol{flex:1;min-width:140px;display:flex;flex-direction:column;gap:.2rem}
.vol-pct{align-self:flex-end;font:400 .95rem/1 var(--mono);letter-spacing:.06em}
.vol-row{display:flex;align-items:center;gap:.6rem}
.ftr-spk{width:34px;height:24px;flex:0 0 auto}
.vol-track{position:relative;flex:1;height:4px;background:rgba(239,43,49,.28);background:color-mix(in srgb,currentColor 32%,transparent)}
.vol-fill{position:absolute;inset:0 auto 0 0;width:99%;background:currentColor}
.vol-knob{position:absolute;right:1%;top:50%;width:4px;height:14px;background:currentColor;transform:translateY(-50%)}
.ftr-bot{display:flex;align-items:center;gap:1rem;margin-top:1rem;color:var(--mute);font:400 .78rem/1 var(--mono);letter-spacing:.26em}
.ftr-place{flex:0 1 auto}
.ftr-line{flex:1;height:1px;background:rgba(255,255,255,.28)}
.ftr-scan{flex:0 0 auto;display:grid;justify-items:center;gap:.3rem;opacity:.7}
.scan-bars{width:clamp(108px,12vw,148px);height:26px;background:repeating-linear-gradient(90deg,var(--white) 0 2px,transparent 2px 5px,var(--white) 5px 8px,transparent 8px 10px,var(--white) 10px 11px,transparent 11px 15px,var(--white) 15px 18px,transparent 18px 21px)}
.scan-txt{font-size:.66rem;letter-spacing:.45em;padding-left:.45em}
@media(max-width:720px){
  .ftr-top{flex-wrap:wrap}
  .ftr-vol{flex:1 0 100%}
  .ftr-bot{flex-wrap:wrap;letter-spacing:.14em}
}

/* projeto aberto */
dialog{--dlg-max-h:96vh;isolation:isolate;width:min(1200px,100% - 1.5rem);max-height:var(--dlg-max-h);overflow:hidden;background-color:#06080c;color:var(--white);border:0;border-radius:16px;padding:0;margin:auto;
  background-image:
    var(--scan),
    var(--ruido),
    radial-gradient(26px 58px at 2px 14px,rgba(255,255,255,.46),rgba(255,255,255,.10) 60%,transparent 86%),
    radial-gradient(36px 20px at calc(100% - 3px) calc(100% - 2px),rgba(255,255,255,.24),transparent 86%),
    linear-gradient(102deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 26%,transparent 48%),
    linear-gradient(118deg,rgba(18,22,30,.20),rgba(4,5,8,.66) 72%),
    var(--grao);
  background-size:auto,90px 90px,auto,auto,auto,auto,140px 140px;
  background-blend-mode:normal,overlay,screen,screen,screen,normal,overlay;
  box-shadow:0 30px 90px rgba(0,0,0,.85),inset 0 0 0 1.4px rgba(255,255,255,.10),inset 0 0 3px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.82)}
dialog[open]{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* A rolagem fica dentro do modal: o recorte externo preserva todas as quinas arredondadas. */
.d-scroll{max-height:var(--dlg-max-h);overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
/* Cabeçalho do modal: repete o vidro, o grão e o vinco dos painéis do site. */
.d-header{position:sticky;top:0;z-index:3;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:1rem clamp(1.2rem,3vw,2.2rem);
  background-color:#07090d;
  background-image:var(--scan),var(--ruido),linear-gradient(102deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.022) 26%,transparent 48%),linear-gradient(118deg,rgba(18,22,30,.12),rgba(4,5,8,.46) 72%),var(--grao);
  background-size:auto,90px 90px,auto,auto,140px 140px;
  background-blend-mode:normal,overlay,screen,normal,overlay;
  border-bottom:1px solid rgba(0,0,0,.92);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 1px 0 rgba(255,255,255,.12),0 10px 22px rgba(0,0,0,.22)}
.d-header-copy{min-width:0}
.d-header #d-bar{display:block;color:var(--mute);font:400 .75rem/1.2 var(--mono);letter-spacing:.1em}
.d-header #d-title{margin:.35rem 0 0;font:400 clamp(2rem,4vw,3rem)/.95 var(--big);letter-spacing:.02em;overflow-wrap:anywhere}
.d-cta{display:flex;gap:.5rem;align-items:flex-start;flex:0 0 auto}
#close{flex:0 0 auto;min-height:44px;background:rgba(5,5,6,.32);border:1px solid var(--line);border-radius:6px;color:var(--white);font:500 .78rem var(--mono);letter-spacing:.1em;padding:.35rem .7rem;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
#close:hover{color:var(--accent);border-color:var(--accent);background:rgba(5,5,6,.64)}
/* CTA do modal: único destaque do cabeçalho; "fechar" fica neutro. */
#cta-modal{flex:0 0 auto;min-height:44px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);border:1px solid var(--accent);border-radius:6px;color:#050506;font:700 .78rem var(--mono);letter-spacing:.06em;padding:.35rem .8rem;text-decoration:none;white-space:nowrap;cursor:pointer;transition:filter .2s}
#cta-modal:hover{filter:brightness(1.12)}
/* ---- galeria do projeto aberto ---- */
.d-stage{
  position: relative;
  background: #050506;
  width: 100%;
  height: 80vh; /* Ocupa 80% da altura da tela */
  min-height: 320px;
  overflow: hidden;
  touch-action: pan-y; 
  --janela: 100%; /* largura da área visível (no carrossel = proporção da imagem) */
  border-bottom:1px solid rgba(0,0,0,.92);
  box-shadow:0 1px 0 rgba(255,255,255,.16);
}

.d-stage-view{
  width: var(--janela);
  margin: 0 auto;
  height: 100%;
  display: flex;
  overflow: hidden;
}

.d-track{
  position: relative;
  display: flex;
  height: 100%;
  will-change: transform;
  transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}

/* Modo Slide: cada imagem ocupa 100% da tela */
.d-track.slide {
  width: 100%;
}
.d-track.slide .d-slide {
  flex: 0 0 100%;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* cada slide é o bloco de referência do vídeo/capa (no carrossel, a janela) */
.d-slide{position:relative}

/* Modo Carrossel: imagens coladas, o track cresce */
.d-track.carrossel {
  width: max-content;
}
.d-track.carrossel .d-slide {
  flex: 0 0 auto;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.d-slide img{
  max-height: 100%;
  max-width: 100%;   /* sem isto, arte larga estoura o slide e a seguinte aparece junto */
  width: auto;
  height: auto;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  display: block;
}

.d-track.carrossel .d-slide img{
  width: 100%;
  height: 100%;
  max-height: none;
  object-fit: contain;
}

/* vídeo/3D: no modo slide já ocupam a tela toda; no carrossel a largura é
   definida pelo JS (ajustarLarguras) para o deslocamento ficar exato */
.d-track.carrossel .d-slide.is-video {
  flex: 0 0 auto;
}

.d-slide iframe{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
/* botão ⛶ tela cheia por imagem */
.d-fs{position:absolute;top:.6rem;right:.6rem;z-index:3;background:rgba(0,0,0,.55);color:var(--white);border:0;border-radius:8px;padding:.35rem;cursor:pointer;opacity:.75;transition:opacity .2s,background .2s;display:flex;align-items:center;justify-content:center}
.d-slide:hover .d-fs,.d-fs:focus{opacity:1}
.d-fs:hover{background:rgba(0,0,0,.8)}
@media (hover:none){.d-fs{opacity:1}}
/* botões ‹ › (só aparecem quando há mais de uma mídia) */
.d-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:auto;height:auto;display:grid;place-items:center;padding:.2rem;
  background:none;border:0;color:var(--white);font:400 2rem/1 var(--mono);cursor:pointer;text-shadow:0 1px 4px rgba(0,0,0,.85);
  opacity:0;pointer-events:none;transition:opacity .25s ease}
.d-nav:hover{color:var(--accent)}
.d-stage:hover .d-nav{opacity:1;pointer-events:auto}
@media (hover: none){.d-nav{opacity:1;pointer-events:auto}}
.d-prev{left:calc(50% - var(--janela) / 2 + .6rem)} .d-next{right:calc(50% - var(--janela) / 2 + .6rem)}
.d-nav[hidden],.d-thumbs[hidden],.d-thumbs-wrap[hidden],.d-count[hidden],.d-dots[hidden]{display:none}
/* bolinhas do carrossel (como no Instagram) */
.d-dots{position:absolute;left:50%;bottom:.7rem;transform:translateX(-50%);z-index:2;display:flex;gap:.4rem;
  background:rgba(5,5,6,.62);padding:.3rem .5rem;border-radius:999px}
.d-dots button{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
.d-dots button[aria-current="true"]{background:var(--accent);transform:scale(1.3)}
/* contador 1 / 4 */
.d-count{position:absolute;right:calc(50% - var(--janela) / 2 + .7rem);bottom:.7rem;z-index:2;font:400 .8rem var(--mono);letter-spacing:.08em;
  color:var(--mute);background:rgba(5,5,6,.7);padding:.15rem .5rem;border-radius:4px}
/* miniaturas */
.d-thumbs{display:flex;gap:.5rem;overflow-x:auto;padding:.8rem .6rem;scrollbar-width:none}
/* barra de miniaturas com botões de rolagem (desktop) */
.d-thumbs-wrap{position:relative;display:block;border-bottom:1px solid rgba(0,0,0,.92);box-shadow:0 1px 0 rgba(255,255,255,.16)}
.d-thumbs-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:rgba(5,5,6,.6);color:var(--white);font:500 .9rem var(--mono);line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:background .2s,border-color .2s,opacity .25s ease}
.d-thumbs-nav:hover{background:rgba(5,5,6,.9);border-color:var(--accent);color:var(--accent)}
.d-thumbs-prev{left:.35rem}
.d-thumbs-next{right:.35rem}
.d-thumbs-wrap:hover .d-thumbs-nav{opacity:1;pointer-events:auto}
@media (hover: none){.d-thumbs-nav{display:none}}
.d-thumb{flex:0 0 auto;position:relative;height:56px;min-width:76px;width:auto;aspect-ratio:auto;padding:0;border:1px solid var(--line);border-radius:6px;
  overflow:hidden;background:#0c0d10;cursor:pointer}
.d-thumb img{width:auto;height:100%;max-width:none;object-fit:contain;display:block}
.d-thumb[aria-current="true"]{border-color:var(--accent)}
.d-thumb.vid::after,.d-thumb.sk::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;
  font-size:1rem;color:#fff;text-shadow:0 1px 4px #000;background:rgba(0,0,0,.28)}
.d-thumb.sk::after{content:"3D";font:500 .7rem var(--mono);letter-spacing:.06em;text-shadow:none}
/* capa clicável de vídeo / modelo 3D */
.d-play{position:absolute;inset:0;z-index:1;border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
.d-play img{width:100%;height:100%;object-fit:contain}
.d-play::after{content:"▶";position:absolute;width:68px;height:68px;display:grid;place-items:center;
  border:2px solid #fff;border-radius:50%;color:#fff;font-size:1.4rem;background:rgba(5,5,6,.55);transition:background .2s,border-color .2s}
.d-play:hover::after{background:var(--accent);border-color:var(--accent)}
.d-play.sk::after{content:"3D";font:500 .9rem var(--mono);letter-spacing:.04em}
.d-rotulo{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);font:500 .72rem var(--mono);
  letter-spacing:.2em;color:var(--mute)}
.d-body{padding:0 clamp(1.2rem,3vw,2.2rem) 2rem}
.d-body p,#d-desc{max-width:90ch}
#d-desc{overflow-wrap:anywhere;word-break:break-word}
#d-desc p{margin:.75rem 0}
#d-desc > p:first-child{margin-top:0}
#d-desc > p:last-child{margin-bottom:0}
#d-desc strong{font-weight:700}
#d-desc em{font-style:italic}
#d-desc del{opacity:.55}
#d-desc code{font:400 .9em var(--mono);background:rgba(255,255,255,.09);padding:.1em .35em;border-radius:4px}
#d-desc a{color:var(--accent);text-decoration:underline;text-underline-offset:.2em}
#d-desc h3,#d-desc h4,#d-desc h5,#d-desc h6{font-family:var(--mono);font-weight:500;letter-spacing:.06em;color:var(--texto);margin:.9rem 0 .45rem;line-height:1.3}
#d-desc h3{font-size:1.05rem}#d-desc h4{font-size:1rem}#d-desc h5,#d-desc h6{font-size:.95rem}
#d-desc ul,#d-desc ol{margin:.5rem 0 .7rem;padding-left:1.4rem}
#d-desc li{margin:.2rem 0}
#d-desc li::marker{color:var(--accent)}
#d-desc blockquote{margin:.7rem 0;padding:.2rem 0 .2rem .9rem;border-left:2px solid var(--accent);color:var(--mute)}
#d-desc hr{border:0;border-top:1px solid var(--line);margin:1rem 0}
.d-tools{margin:0 calc(-1*clamp(1.2rem,3vw,2.2rem)) 0;padding:.8rem clamp(1.2rem,3vw,2.2rem);border-bottom:1px solid rgba(0,0,0,.92);box-shadow:0 1px 0 rgba(255,255,255,.16)}
.d-tools-label{display:block;color:var(--mute);font:400 .75rem/1.2 var(--mono);letter-spacing:.1em}
.d-desc-label{display:block;color:var(--mute);font:400 .75rem/1.2 var(--mono);letter-spacing:.1em;margin-top:.8rem;margin-bottom:.5rem}
.d-tools .meta{font:400 .9rem var(--mono);color:var(--accent);margin:.35rem 0 0;letter-spacing:.05em;white-space:pre-line;overflow-wrap:anywhere;word-break:break-word}
/* mensagem quando a área ainda não tem projeto */
.vazio{padding:2.4rem 1.2rem;margin:0;color:var(--mute);font:400 .95rem var(--mono);letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.home-sec{margin-top:clamp(2rem,5vw,3.5rem)}

/* cabeçalho fixo + abas */
.tabbar{position:sticky;top:0;z-index:30;background:rgba(5,5,6,.9);backdrop-filter:blur(12px) saturate(120%);border-top:1px solid var(--line);border-bottom:1px solid var(--line)} /* sticky = menu cola no topo */
.tabs{display:flex;flex-wrap:nowrap;align-items:center;gap:clamp(.65rem,3vw,1.8rem);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:500 clamp(.95rem,2.8vw,1.45rem) var(--tech);letter-spacing:.08em;text-transform:uppercase;padding:.9rem .3rem;cursor:pointer} /* tamanho/fonte das abas */
.tab:first-child{margin-left:auto}
.tab:last-child{margin-right:auto}
.tab:hover{color:var(--white)}
.tab[aria-selected="true"]{color:var(--white);border-bottom-color:var(--accent)}
.sep{flex:0 0 1px;width:1px;height:clamp(1.2rem,2.5vw,1.7rem);background:rgba(255,255,255,.72)}
#panel{margin-top:clamp(1.2rem,3vw,2rem)} /* espaço entre as abas e o painel */
.chips{display:flex;flex-wrap:wrap;gap:.5rem;padding:1.1rem 1.2rem 0} /* botões de filtro */
.chip{background:none;border:1px solid var(--line);color:var(--mute);font:500 .85rem var(--mono);letter-spacing:.06em;padding:.4rem .9rem;border-radius:999px;cursor:pointer}
.chip:hover{color:var(--white);border-color:var(--mute)}
.chip[aria-pressed="true"]{color:var(--white);border-color:var(--accent);background:rgba(239,43,49,.16);background:color-mix(in srgb,var(--accent) 16%,transparent)}

/* celular: os ajustes abaixo valem para telas <= 640px */
.chip,#lang,#close,#cta-modal{min-height:44px}
@media(hover:none){.item:hover .thumb img{transform:none}}
@media(max-width:640px){
  .win,.tabbar,dialog{backdrop-filter:none;-webkit-backdrop-filter:none}
  .wrap{width:calc(100% - 1.5rem)}
  .hero{padding:.25rem 0 .75rem}
  .hero-logo img{max-height:30vh}
  .sub{align-items:center;gap:.6rem;font-size:.72rem;letter-spacing:.03em}
  .sub > span[data-i18n]{line-height:1.35}
  .sub .right{gap:0}
  .tabs{gap:.65rem}
  .tab{padding:.8rem .2rem;letter-spacing:.04em}
  .bar{padding:.55rem .8rem;font-size:.78rem}
  .area .head{padding:1rem .9rem 0}
  .chips{padding:.9rem .9rem 0}
  /* no mobile cada projeto ocupa a largura do vidro com um respiro nas bordas (feed) */
  .grid{flex-direction:column;align-items:stretch;overflow-x:visible;scroll-snap-type:none;gap:1.5rem}
  #panel .grid{padding-left:1rem;padding-right:1rem}
  .item,.thumb,.thumb img{width:100%;max-width:none}
  .thumb img{height:auto}
  .thumb:has(.ph){width:100%;height:auto;aspect-ratio:4/3}
  .item h3{padding:0}
  .item h3{font-size:1rem}
  .about{padding:1.1rem .9rem}
  .svc li{font-size:1rem}
  dialog{--dlg-max-h:94dvh;width:calc(100% - 1rem)}
  .d-stage{height: 70vh; min-height: 260px; }
  .d-nav{width:auto;height:auto}
  .d-thumb{height:48px;min-width:64px}
  .pitch-lg{font-size:clamp(1.9rem,8vw,2.8rem);max-width:none}
  .d-header{flex-wrap:wrap;padding:.8rem .9rem;gap:.6rem}
  .d-header-copy{flex:1 1 100%}
  .d-cta{flex:1 1 100%;justify-content:space-between}
  .d-header #d-title{font-size:clamp(1.6rem,7vw,2rem);line-height:1}
}
/* Toque: amplia a área sensível ao dedo SEM mudar o tamanho visual dos botões.
   O pseudo-elemento é transparente e faz parte do botão, então qualquer toque
   nele dispara o clique — inclusive nas setas ‹ › e no ícone de tela cheia. */
@media (hover: none), (pointer: coarse){
  button{-webkit-user-select:none;user-select:none} /* evita seleção de texto no toque */
  .d-nav::before,#fs .fs-nav::before,#fs .fs-close::before,
  .d-fs::before,.d-dots button::before,.pl-btn::before,
  .chip::before,.tab::before,#lang::before,#close::before{

  .d-dots button::before{inset:-8px}
  .pl-bar::after{content:"";position:absolute;inset:-12px 0}
}

#fs .fs-close:hover{opacity:1}
#fs .fs-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:auto;height:auto;
  background:none;border:0;color:#fff;font:400 2.4rem/1 var(--mono);cursor:pointer;
  text-shadow:0 1px 6px rgba(0,0,0,.9);opacity:.55;transition:opacity .2s ease,color .2s ease}
#fs .fs-nav:hover{opacity:1;color:var(--accent)}
#fs .fs-prev{left:1rem} #fs .fs-next{right:1rem}
#fs .fs-nav[hidden]{display:none}
@media (hover:none){#fs .fs-close,#fs .fs-nav{opacity:1}}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Markdown mínimo e seguro: escapa o texto primeiro, depois aplica só as marcações permitidas.
const md = s => {
  const codos = [];
  const inline = txt => {
    let out = esc(txt).replace(/`([^`]+)`/g, (_, c) => {
      codos.push(c);
      return `\u0001${codos.length - 1}\u0002`;
    });
    out = out.replace(/\*\*([^\n]+?)\*\*/g, "<strong>$1</strong>")
             .replace(/__([^\n]+?)__/g, "<strong>$1</strong>")
             .replace(/~~([^~\n]+)~~/g, "<del>$1</del>")
             .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
             .replace(/_([^_\n]+)_/g, "<em>$1</em>")
             .replace(/\[([^\]]+)\]\(((?:[^()]|\([^()]*\))+)\)/g, (all, label, url) => {
               const u = url.trim();
               return /^https?:\/\//i.test(u)
                 ? `<a href="${u}" target="_blank" rel="noopener noreferrer">${label}</a>`
                 : label;
             })
             .replace(/\u0001(\d+)\u0002/g, (_, i) => `<code>${codos[+i]}</code>`);
    return out;
  };

  const linhas = String(s ?? "").replace(/\r\n?/g, "\n").split("\n");
  const ehTitulo = l => /^(#{1,6})\s+/.test(l);
  const ehQuote = l => /^>\s?/.test(l);
  const ehRisco = l => /^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(l);
  // "* texto *" é itálico com espaços, não marcador de lista.
  const itemLista = l => {
    let m = l.match(/^\s*\d+[.)]\s+(.+)$/);
    if (m) return { ordenada: true, texto: m[1] };
    m = l.match(/^\s*-\s+(.+)$/);
    if (m) return { ordenada: false, texto: m[1] };
    m = l.match(/^\s*\*\s+(.+)$/);
    if (m) {
      const corpo = m[1];
      // itálico escrito com espaços: "* texto *"
      const italicoEspacado = /\s+\*$/.test(corpo) && (corpo.match(/\*/g) || []).length === 1;
      if (!italicoEspacado) return { ordenada: false, texto: corpo };
    }
    return null;
  };
  const ehLista = l => !!itemLista(l);
  const blocos = [];
  let i = 0;

  while (i < linhas.length) {
    const linha = linhas[i];
    if (!linha.trim()) { i++; continue; }

    const titulo = linha.match(/^(#{1,6})\s+(.+)$/);
    if (titulo) {
      const nivel = Math.min(6, 2 + titulo[1].length); // # -> h3, ## -> h4, ...
      blocos.push(`<h${nivel}>${inline(titulo[2])}</h${nivel}>`);
      i++; continue;
    }

    if (ehRisco(linha)) { blocos.push("<hr>"); i++; continue; }

    if (ehQuote(linha)) {
      const citacoes = [];
      while (i < linhas.length && ehQuote(linhas[i])) {
        citacoes.push(inline(linhas[i].replace(/^>\s?/, "")));
        i++;
      }
      blocos.push(`<blockquote>${citacoes.join("<br>")}</blockquote>`);
      continue;
    }

    if (ehLista(linha)) {
      const ordenada = itemLista(linha).ordenada;
      const itens = [];
      while (i < linhas.length) {
        const item = itemLista(linhas[i]);
        if (!item || item.ordenada !== ordenada) break;
        itens.push(`<li>${inline(item.texto)}</li>`);
        i++;
      }
      const tag = ordenada ? "ol" : "ul";
      blocos.push(`<${tag}>${itens.join("")}</${tag}>`);
      continue;
    }

    const paragrafos = [];
    while (i < linhas.length && linhas[i].trim() &&
           !ehTitulo(linhas[i]) && !ehQuote(linhas[i]) && !ehRisco(linhas[i]) && !ehLista(linhas[i])) {
      paragrafos.push(inline(linhas[i]));
      i++;
    }
    if (paragrafos.length) blocos.push(`<p>${paragrafos.join("<br>")}</p>`);
  }
  return blocos.join("\n");
};

const overlaySetups = new WeakSet();
function setupOverlayScrollbar(container, vertical, short, topOffset = 0, bottomOffset = 0){
  if (!container || overlaySetups.has(container)) return;
  overlaySetups.add(container);
  const isPage = (container === document.documentElement || container === document.scrollingElement);
  const scrollEl = isPage ? document.documentElement : container;
  if (!isPage && getComputedStyle(container).position === "static") container.style.position = "relative";

  const track = document.createElement("div");
  track.className = "ov-sb-track " + (vertical ? "v" : "h");
  const thumb = document.createElement("div");
  thumb.className = "ov-sb-thumb";
  track.appendChild(thumb);
  const parent = isPage ? document.body : container;
  parent.appendChild(track);
  if (isPage){ track.style.position = "fixed"; track.style.right = "6px"; track.style.top = "0"; }

  let idleTimer = null;
  const show = () => {
    track.classList.add("show");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => track.classList.remove("show"), 1500);
  };
  const sync = () => {
    const scrollSize = vertical ? scrollEl.scrollHeight : scrollEl.scrollWidth;
    const clientSize = vertical ? scrollEl.clientHeight : scrollEl.clientWidth;
    const scrollPos = vertical ? scrollEl.scrollTop : scrollEl.scrollLeft;
    if (scrollSize <= clientSize + 1){ track.style.display = "none"; return; }
    track.style.display = "";
    const ratio = clientSize / scrollSize;
    const available = clientSize - (vertical ? (topOffset + bottomOffset) : 0);
    const trackSize = available;
    const thumbSize = Math.max(24, Math.min(trackSize * 0.9, trackSize * ratio));
    const maxScroll = scrollSize - clientSize;
    const maxThumb = trackSize - thumbSize;
    const thumbPos = maxScroll > 0 ? (scrollPos / maxScroll) * maxThumb : 0;
    if (vertical){
      track.style.height = trackSize + "px";
      track.style.top = (isPage ? topOffset : scrollPos + topOffset) + "px";
      thumb.style.height = thumbSize + "px";
      thumb.style.transform = "translateY(" + thumbPos + "px)";
    } else {
      track.style.width = clientSize + "px";
      thumb.style.width = thumbSize + "px";
      thumb.style.transform = "translateX(" + thumbPos + "px)";
    }
  };

  const onScroll = () => { sync(); show(); };
  if (isPage) window.addEventListener("scroll", onScroll, { passive: true });
  else scrollEl.addEventListener("scroll", onScroll, { passive: true });
  if (typeof ResizeObserver !== "undefined"){
    const ro = new ResizeObserver(() => sync());
    ro.observe(scrollEl);
    if (scrollEl !== container) ro.observe(container);
  }
  window.addEventListener("resize", sync, { passive: true });
  window.addEventListener("load", sync, { passive: true });
  setTimeout(sync, 500);
  setTimeout(sync, 2000);

  let dragging = false, start = 0, startPos = 0;
  thumb.addEventListener("mousedown", e => {
    dragging = true;
    start = vertical ? e.clientY : e.clientX;
    startPos = vertical ? scrollEl.scrollTop : scrollEl.scrollLeft;
    document.body.style.userSelect = "none";
    e.preventDefault();
  });
  document.addEventListener("mousemove", e => {
    if (!dragging) return;
    const delta = (vertical ? e.clientY : e.clientX) - start;
    const scrollSize = vertical ? scrollEl.scrollHeight : scrollEl.scrollWidth;
    const clientSize = vertical ? scrollEl.clientHeight : scrollEl.clientWidth;
    const maxScroll = scrollSize - clientSize;
    const thumbSize = parseFloat(vertical ? thumb.style.height : thumb.style.width);
    const maxThumb = clientSize - thumbSize;
    if (maxThumb <= 0) return;
    const newScroll = startPos + (delta / maxThumb) * maxScroll;
    if (vertical) scrollEl.scrollTop = newScroll; else scrollEl.scrollLeft = newScroll;
  });
  document.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.userSelect = "";
  });

  track.addEventListener("mousedown", e => {
    if (e.target !== track) return;
    const rect = track.getBoundingClientRect();
    const clickPos = vertical ? (e.clientY - rect.top) : (e.clientX - rect.left);
    const thumbSize = parseFloat(vertical ? thumb.style.height : thumb.style.width);
    const clientSize = vertical ? scrollEl.clientHeight : scrollEl.clientWidth;
    const scrollSize = vertical ? scrollEl.scrollHeight : scrollEl.scrollWidth;
    const maxScroll = scrollSize - clientSize;
    const maxThumb = clientSize - thumbSize;
    if (maxThumb <= 0) return;
    const ratio = Math.max(0, Math.min(1, (clickPos - thumbSize / 2) / maxThumb));
    if (vertical) scrollEl.scrollTop = ratio * maxScroll; else scrollEl.scrollLeft = ratio * maxScroll;
  });

  sync();
}

  const chave = par => String(par[0].id || slugProj(par[0]));
  const porId = new Map(list.map(par => [chave(par), par]));
  const usados = new Set();
  const out = [];
  for (const id of ids) {
    const k = String(id);
    if (porId.has(k) && !usados.has(k)) { out.push(porId.get(k)); usados.add(k); }
  }
  for (const par of list) {
    const k = chave(par);
    if (!usados.has(k)) { out.push(par); usados.add(k); }
  }
  return out;
}
