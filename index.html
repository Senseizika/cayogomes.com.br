<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Chakra+Petch:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"></noscript>
<style>
/* ============================================================
   GUIA RÁPIDO DE EDIÇÃO (CSS)
   - Cores do site ....... :root (logo abaixo)
   - Fontes .............. :root (--big / --tech / --mono)
   - Largura do conteúdo . .wrap
   - Altura do topo ...... --hero-h (seção "hero")
   - Abas/menu ........... seção "cabeçalho fixo + abas"
   - Cards de projeto .... seção "áreas" / .grid / .thumb
   - Sobre / Contato ..... seções "sobre" e "contato"
   - Modal do projeto .... seção "projeto aberto"
   - Celular ............. seções com @media(max-width:640px)
   Os textos e a lista de projetos ficam no bloco de script, no fim do arquivo.
   ============================================================ */
:root{
  color-scheme:dark;
  /* ---------- CORES DO SITE (mude aqui e vale no site inteiro) ---------- */
  --ink:#050506;      /* fundo geral */
  --panel:rgba(9,10,12,.86); /* fundo dos painéis (janelas) */
  --line:rgba(255,255,255,.13); /* bordas/divisórias */
  --white:#f4f4f2;    /* texto principal */
  --mute:#8d9490;     /* texto secundário */
  --accent:#ef2b31;   /* destaque padrão; o fundo sorteado troca este valor (ver PALETA) */
  --glow:rgba(40,130,95,.40);  /* brilho verde do fundo */
  --violet:rgba(90,60,150,.30);/* brilho roxo do fundo */
  /* ---------- FONTES (troque a família aqui; carregue o peso no head) ---------- */
  --big:"Bebas Neue","Arial Narrow",Impact,sans-serif;   /* títulos grandes */
  --tech:"Chakra Petch","Arial Narrow",Arial,sans-serif; /* texto/interface */
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;/* números/rótulos */
}
*{box-sizing:border-box;margin:0}
/* distância que o menu fixo ocupa ao pular para uma âncora */
html{scroll-behavior:smooth;scroll-padding-top:80px}
/* fundo e fonte padrão do site */
body{background:var(--ink);color:var(--white);font:400 1.0625rem/1.6 var(--tech);-webkit-font-smoothing:antialiased;position:relative}
a{color:inherit}
/* contorno de acessibilidade ao navegar com teclado */
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* LARGURA MÁXIMA DO CONTEÚDO: aumente/diminua o 1180px */
.wrap{width:min(1500px,100% - 2rem);margin-inline:auto}

/* janela: a unidade visual do site, como no cartão */
.win{background:rgba(9,10,12,.55);border:1px solid var(--line);border-radius:14px;overflow:hidden}
@media (min-width: 768px){ .win{ backdrop-filter:blur(4px); } }
.bar{display:flex;justify-content:space-between;align-items:center;padding:.65rem 1rem;font:400 .85rem var(--mono);letter-spacing:.08em;color:var(--mute);border-bottom:1px solid var(--line)}
.bar i{font-style:normal;letter-spacing:.25em}

/* topo */
#lang{font:500 .85rem var(--mono);letter-spacing:.1em;background:none;color:var(--white);border:1px solid var(--accent);padding:.3rem .75rem;border-radius:6px;cursor:pointer}
#lang:hover{background:var(--accent);color:var(--ink)} /* texto escuro: o destaque é claro */

/* hero = "capa" do topo (logo + linha de função + botão de idioma) */
.hero{position:relative;overflow:hidden;min-height:var(--hero-h);padding:clamp(1.5rem,4vw,3rem) 0 clamp(2rem,5vw,4rem);}
.hero-overlay{position:absolute;inset:0;z-index:1;display:grid;place-items:center;pointer-events:none}
/* fundo em duas camadas: ocupa a largura da tela, começa no topo da página e sobe
   mais devagar que ela (parallax). As duas camadas têm sempre o mesmo tamanho. */
:root{
  --fundo-h:133.34vw;               /* altura das camadas de fundo */
  --camada:.6;                      /* opacidade da 2ª camada */
  --hero-h:max(200px,35vh);         /* ALTURA DO TOPO = 35% da tela (mín. 200px) */
  --logo-max-h:40vh;                /* tamanho da logo mantido (independe da altura do hero) */
  --logo-sobe:1vh;                  /* 0 = logo centralizada. Para subir, use ex.: 1vh */
}
@supports (height:max(1px,1vh)){:root{--fundo-h:max(133.34vw,130vh)}}
.fundo-clip{position:absolute;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.fundo{position:absolute;top:0;left:0;width:100%;height:var(--fundo-h);
  -webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
/* object-position controla o enquadramento da foto; transition, o fade */
.fundo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;opacity:0;transition:opacity .8s}
.fundo img.ready{opacity:1}
.fundo .f2.ready{opacity:var(--camada)}
/* TAMANHO DA LOGO do topo: 31vh (mesmo tamanho em qualquer hero), no máx. 80% da largura.
   Como não depende de --hero-h, dá para baixar o hero sem encolher a logo. */
.hero-overlay img{max-width:80%;max-height:var(--logo-max-h);width:auto;height:auto;object-fit:contain;transform:translateY(calc(var(--logo-sobe) * -1))}
.hero .wrap{position:relative;z-index:2}

/* linha de função + botão EN. margin-top: distância até o topo do hero (menor = sobe) */
.sub{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:.15rem;font:400 .95rem var(--mono);color:var(--mute);letter-spacing:.04em}

/* áreas / grade de projetos */
.about,.contact{content-visibility:auto;contain-intrinsic-size:1px 500px}
.area{margin-top:clamp(3rem,7vw,5rem)}
.area .head{padding:1.2rem 1.2rem 0}   /* espaço ao redor do título da área */
.area h2{font:400 clamp(2.6rem,6vw,4.4rem)/1 var(--big);letter-spacing:.02em}
.area .lead{color:var(--mute);max-width:56ch;margin-top:.4rem}
/* Separadores discretos das categorias na visualização "Todos". */
.cat-group{min-width:0}
.cat-separator{
  display:flex;align-items:center;gap:.8rem;
  margin:1.25rem 1.2rem 0;
  color:var(--mute);font:inherit;font-size:1rem;line-height:1.3;
}
.cat-separator::after{
  content:"";height:1px;flex:1;
  background:currentColor;opacity:.7;
}
/* GRADE: minmax(250px,1fr) = largura mínima de cada card; gap = espaço entre eles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.15rem;padding:1.4rem 1.2rem 1.4rem}
.item{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}
/* Cada miniatura acompanha a proporção natural da imagem, sem cortes ou deformações. */
.thumb{overflow:hidden;background:#0c0d10;border:1px solid var(--line);border-radius:8px;position:relative;transition:border-color .2s}
.item:hover .thumb{border-color:var(--accent)}
.thumb img{width:100%;height:auto;object-fit:contain;display:block;transition:transform .5s}
.thumb:has(.ph){aspect-ratio:4/3}
.item:hover .thumb img{transform:scale(1.015)}
.ph{position:absolute;inset:0;display:grid;place-items:center;font:400 .85rem var(--mono);color:var(--mute);letter-spacing:.08em;
  background:linear-gradient(160deg,hsl(var(--h) 30% 14%),#08090b)}
.item h3{font:500 1.2rem/1.2 var(--tech);margin-top:.7rem;letter-spacing:.03em}

/* sobre: 1fr 1fr = duas colunas (texto | serviços). Ex.: 1.4fr 1fr deixa o texto maior */
.about{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,5vw,4rem);padding:clamp(1.4rem,4vw,2.6rem)}
.about h2,.contact h2{font:400 clamp(2.4rem,5vw,3.6rem)/1 var(--big);margin-bottom:1rem;letter-spacing:.02em}
.about p+p{margin-top:1rem}
.about p{max-width:60ch}
.svc{list-style:none;padding:0;counter-reset:s}
.svc li{counter-increment:s;display:flex;gap:1rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line);font:500 1.15rem var(--tech);letter-spacing:.06em;text-transform:uppercase}
.svc li::before{content:counter(s,decimal-leading-zero);font:400 1.1rem var(--mono);color:var(--accent)}
.svc li::after{content:"";order:-1;flex:0 0 0}
@media(max-width:760px){.about{grid-template-columns:1fr}}

/* contato (WhatsApp/e-mail ficam no HTML, perto do fim do arquivo) */
.contact{padding:clamp(1.4rem,4vw,2.6rem)}
.contact p{color:var(--mute);margin-bottom:1.4rem}
.contact a.big{display:block;width:fit-content;max-width:100%;overflow-wrap:anywhere;font:700 clamp(1.4rem,4.2vw,2.6rem)/1.3 var(--tech);text-decoration:none;border-bottom:2px solid var(--accent);margin-bottom:.8rem}
.contact a.big:hover{color:var(--accent)}
.brk{display:inline-block;position:relative;margin-top:1rem;padding:.7rem 1.4rem;font:500 1.15rem var(--big);letter-spacing:.14em;text-transform:uppercase}
.brk::before,.brk::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--white)}
.brk::before{left:0;top:0;border-right:0;border-bottom:0}
.brk::after{right:0;bottom:0;border-left:0;border-top:0}


/* projeto aberto */
dialog{width:min(1200px,100% - 1.5rem);max-height:96vh;overflow:auto;background:#0a0b0d;color:var(--white);border:1px solid var(--line);border-radius:14px;padding:0;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.82)}
dialog[open]{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#close{background:none;border:0;color:var(--white);font:500 .85rem var(--mono);letter-spacing:.1em;cursor:pointer}
#close:hover{color:var(--accent)}
/* ---- galeria do projeto aberto ---- */
.d-stage{
  position: relative;
  background: #050506;
  width: 100%;
  height: 80vh; /* Ocupa 80% da altura da tela */
  min-height: 320px;
  overflow: hidden;
  touch-action: pan-y; /* Permite rolagem vertical da página, mas nós controlamos a horizontal */
}

/* Contêiner que esconde o que está fora da tela */
.d-stage-view{
  width: 100%;
  height: 100%;
  display: flex;
}

/* A "esteira" que contém todas as imagens lado a lado */
.d-track{
  display: flex;
  width: 100%;
  height: 100%;
  will-change: transform;
  transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}

/* Cada slide individual */
.d-slide{
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* A imagem se ajusta à altura sem cortar */
.d-slide img{
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none; /* Impede o navegador de arrastar a imagem por padrão */
}

.d-slide iframe{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
/* botões ‹ › (só aparecem quando há mais de uma mídia) */
.d-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:50%;background:rgba(5,5,6,.72);color:var(--white);font:400 1.5rem/1 var(--mono);cursor:pointer}
.d-nav:hover{border-color:var(--accent);color:var(--accent)}
.d-prev{left:.6rem} .d-next{right:.6rem}
.d-nav[hidden],.d-thumbs[hidden],.d-count[hidden]{display:none}
/* contador 1 / 4 */
.d-count{position:absolute;right:.7rem;bottom:.7rem;z-index:2;font:400 .8rem var(--mono);letter-spacing:.08em;
  color:var(--mute);background:rgba(5,5,6,.7);padding:.15rem .5rem;border-radius:4px}
/* miniaturas */
.d-thumbs{display:flex;gap:.5rem;overflow-x:auto;padding:.7rem clamp(1.2rem,3vw,2.2rem);border-bottom:1px solid var(--line)}
.d-thumb{flex:0 0 auto;position:relative;height:56px;min-width:76px;width:auto;aspect-ratio:auto;padding:0;border:1px solid var(--line);border-radius:6px;
  overflow:hidden;background:#0c0d10;cursor:pointer}
.d-thumb img{width:auto;height:100%;max-width:none;object-fit:contain;display:block}
.d-thumb[aria-current="true"]{border-color:var(--accent)}
.d-thumb.vid::after,.d-thumb.sk::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;
  font-size:1rem;color:#fff;text-shadow:0 1px 4px #000;background:rgba(0,0,0,.28)}
.d-thumb.sk::after{content:"3D";font:500 .7rem var(--mono);letter-spacing:.06em;text-shadow:none}
/* capa clicável de vídeo / modelo 3D */
.d-play{position:absolute;inset:0;z-index:1;border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
.d-play img{width:100%;height:100%;object-fit:contain}
.d-play::after{content:"▶";position:absolute;width:68px;height:68px;display:grid;place-items:center;
  border:2px solid #fff;border-radius:50%;color:#fff;font-size:1.4rem;background:rgba(5,5,6,.55);transition:background .2s,border-color .2s}
.d-play:hover::after{background:var(--accent);border-color:var(--accent)}
.d-play.sk::after{content:"3D";font:500 .9rem var(--mono);letter-spacing:.04em}
.d-rotulo{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);font:500 .72rem var(--mono);
  letter-spacing:.2em;color:var(--mute)}
.d-body{padding:1.4rem clamp(1.2rem,3vw,2.2rem) 2rem}
.d-body h3{font:400 2.8rem/1 var(--big);letter-spacing:.02em}
.d-body .meta{font:400 .9rem var(--mono);color:var(--accent);margin:.6rem 0 1rem;letter-spacing:.05em}
.d-body p{max-width:62ch}
/* mensagem quando a área ainda não tem projeto */
.vazio{padding:2.4rem 1.2rem;margin:0;color:var(--mute);font:400 .95rem var(--mono);letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.area{margin-top:0}
.home-sec{margin-top:clamp(2rem,5vw,3.5rem)}

/* cabeçalho fixo + abas */
/* padding do hero: 1º = espaço acima da linha de função (menor = sobe), 2º = base */
.hero{padding:clamp(.75rem,1.8vw,1.1rem) 0 clamp(1rem,2.5vw,1.6rem)}
.sub{align-items:center}
.sub .right{display:flex;align-items:center;gap:1rem} /* linha de função + botão idioma */
.tabbar{position:sticky;top:0;z-index:30;background:rgba(5,5,6,.93);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)} /* sticky = menu cola no topo */
.tabs{display:flex;justify-content:center;align-items:center;gap:clamp(.5rem,3vw,1.8rem)} /* justify-content: alinhamento das abas */
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:500 clamp(.95rem,2.8vw,1.45rem) var(--tech);letter-spacing:.08em;text-transform:uppercase;padding:.9rem .3rem;cursor:pointer} /* tamanho/fonte das abas */
.tab:hover{color:var(--white)}
.tab[aria-selected="true"]{color:var(--white);border-bottom-color:var(--accent)}
.sep{color:var(--accent);font:400 1.4rem var(--mono)}
#panel{margin-top:clamp(1.2rem,3vw,2rem)} /* espaço entre as abas e o painel */
.chips{display:flex;flex-wrap:wrap;gap:.5rem;padding:1.1rem 1.2rem 0} /* botões de filtro */
.chip{background:none;border:1px solid var(--line);color:var(--mute);font:500 .85rem var(--mono);letter-spacing:.06em;padding:.4rem .9rem;border-radius:999px;cursor:pointer}
.chip:hover{color:var(--white);border-color:var(--mute)}
.chip[aria-pressed="true"]{color:var(--white);border-color:var(--accent);background:rgba(239,43,49,.16);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.pitch-sm{font:400 clamp(2rem,4.5vw,3rem)/1 var(--big);margin-bottom:1rem;max-width:18ch}

/* celular: os ajustes abaixo valem para telas <= 640px */
html{-webkit-text-size-adjust:100%}
.chip,#lang,#close{min-height:40px}
.chips{flex-wrap:wrap}
@media(hover:none){.item:hover .thumb img{transform:none}}
@media(max-width:640px){
  .win,.tabbar,dialog{backdrop-filter:none}
  .wrap{width:calc(100% - 1.5rem)}
  .sub{font-size:.78rem}
  .tabs{gap:.4rem}
  .tab{padding:.8rem .2rem;letter-spacing:.04em}
  .bar{padding:.55rem .8rem;font-size:.78rem}
  .area .head{padding:1rem .9rem 0}
  .chips{padding:.9rem .9rem 0}
  .cat-separator{margin:1.1rem .9rem 0}
  .grid{grid-template-columns:1fr;gap:1rem;padding:1rem .9rem}
  .item h3{font-size:1rem}
  .about,.contact{padding:1.2rem .9rem}
  .svc li{font-size:1rem}
  dialog{width:calc(100% - 1rem);max-height:94dvh}
  .d-stage{
  height: 70vh; /* Um pouco menor para telas de celular */
  min-height: 260px;
}
  .d-stage img{
  max-height: 100%;
  max-width: 100%;
}
  .d-nav{width:40px;height:40px}
  .d-thumb{height:48px;min-width:64px}
  .d-body h3{font-size:2.2rem}
}
</style>
</head>
<body>
<noscript><p style="padding:2rem;text-align:center">Ative o JavaScript para ver o portfólio.</p></noscript>

<!-- camadas do fundo (as imagens são sorteadas pelo JS no fim do arquivo) -->
<div class="fundo-clip" aria-hidden="true"><div class="fundo"><img class="f1" alt="" decoding="async"><img class="f2" alt="" decoding="async"></div></div>

<!-- HERO (capa do topo): logo + linha de função + botão de idioma -->
<div class="hero" id="top">
  <h1 class="hero-overlay"><img src="img/cayo_gomes.webp" alt="Cayo Gomes" fetchpriority="high" decoding="async"></h1>
  <div class="wrap">
    <div class="sub">
      <span data-i18n="role"></span>
      <span class="right"><span>CG / 001</span><button id="lang" type="button" aria-label="Mudar idioma / Change language">EN</button></span>
    </div>
  </div>
</div>

<!-- menu de abas (gerado pelo JS a partir do array AREAS) -->
<div class="tabbar"><div class="wrap tabs" id="tabs" role="tablist"></div></div>

<main>
  <!-- painel de projetos (preenchido pelo JS) -->
  <div class="wrap"><section class="win area" id="panel" role="tabpanel"></section></div>

  <!-- SEÇÃO SOBRE (os textos vêm do objeto UI, no fim do arquivo) -->
  <div class="wrap home-sec">
    <section class="win about" id="sobre">
      <div>
        <p class="pitch-sm" data-i18n="pitch"></p>
        <p data-i18n="about_p1"></p>
        <p data-i18n="about_p2"></p>
      </div>
      <ul class="svc" id="services"></ul>
    </section>

  <!-- SEÇÃO CONTATO (edite o número do WhatsApp e o e-mail abaixo) -->
  <div class="wrap" style="margin-top:1.2rem">
    <section class="win contact" id="contato">
      <h2 data-i18n="contact_h"></h2>
      <p data-i18n="contact_p"></p>
      <a class="big" href="https://wa.me/5524999283346" target="_blank" rel="noopener">WhatsApp 24 99928-3346</a>
      <a class="big" href="mailto:cayogomes.99@gmail.com">cayogomes.99@gmail.com</a>
      <span class="brk" data-i18n="quote"></span>
    </section>
  </div>
</main>

<!-- projetos (gerado pelo painel) + demais textos -->
<script src="conteudo/projetos.js"></script>
<script src="content.js"></script>
<script>
/* ============================================================
   ESTE ARQUIVO TEM SÓ O CÓDIGO.
   Para editar áreas, projetos, serviços e textos: content.js

   O que continua aqui, e por quê:
   - FUNDOS: lido por tools/paleta.js, que também ajusta o total.
   - PALETA: gerado por tools/paleta.js (não edite à mão).
   ============================================================ */
const FUNDOS = {
  // camada de trás: arquivos img/Fundo/fundo1.webp ... fundo16.webp
  // total = quantidade de arquivos; ao adicionar um, aumente este número
  base:   { pasta:"img/Fundo",  prefixo:"fundo",  total:16, ext:"webp" },
  // camada da frente (com transparência): img/Fundo2/camada1.webp ...
  camada: { pasta:"img/Fundo2", prefixo:"camada", total:6,  ext:"webp" },
  // intensidade do parallax: 0 = o fundo rola junto; 1 = fica parado. (desligado no celular)
  parallax: .5
};

/* COR DE DESTAQUE POR FUNDO.
   O site sorteia um fundo e aplica aqui a cor de destaque correspondente.
   NÃO edite à mão: rode  node tools/paleta.js  depois de adicionar/trocar fundos.
   A cor sai da imagem de img/Fundo e é clareada para ter contraste >= 4.5:1. */
/* PALETA:INICIO (gerado por tools/paleta.js - não edite à mão) */
const PALETA = {
  "fundo1.webp": "#d42d9d",
  "fundo2.webp": "#ef0606",
  "fundo3.webp": "#0cd925",
  "fundo4.webp": "#2f73df",
  "fundo5.webp": "#25c1a8",
  "fundo6.webp": "#06c1e0",
  "fundo7.webp": "#06e0ba",
  "fundo8.webp": "#ef0606",
  "fundo9.webp": "#ef0606",
  "fundo10.webp": "#ef0606",
  "fundo11.webp": "#06e0bb",
  "fundo12.webp": "#ec0f06",
  "fundo13.webp": "#ca06e7",
  "fundo14.webp": "#06e0ba",
  "fundo15.webp": "#09dc52",
  "fundo16.webp": "#6262fb"
};
/* PALETA:FIM */

let lang = "pt", current = null, filter = "all";
// idioma inicial: troque o "pt" por "en" para abrir em inglês por padrão
try { lang = localStorage.getItem("lang") || "pt"; } catch(e){}
if (!UI[lang]) lang = "pt";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(3,"0");

// Capa do projeto = primeira mídia da lista. Sem mídia, mostra o placeholder colorido.
const capa = p => (p.media && p.media[0]) || null;

// Monta a capa do card. width/height evitam "pulo" no layout.
function capaHTML(p){
  const c = capa(p);
  const src = c && (c.type === "image" ? c.src : c.poster);
  if (!src) return `<div class="ph" style="--h:${p.h}">${UI[lang].img}</div>`;
  return `<img src="${esc(src)}" alt="${esc(p.title[lang])}" width="600" height="450" loading="lazy" decoding="async">`;
}

const pad2 = n => String(n).padStart(2,"0");

/* ---- galeria: identificar links e navegar entre mídias ---- */
let mid = 0;   // índice da mídia aberta dentro do projeto atual

// ID do YouTube: aceita youtu.be, watch?v=, shorts, embed, live, ou o ID puro
const YT = s => {
  s = String(s).trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m ? m[1] : null;
};

// ID do Sketchfab: aceita .../3d-models/nome-ID, /models/ID, ou o ID puro
const SK = s => {
  s = String(s).trim();
  if (/^[0-9a-f]{32}$/i.test(s)) return s;
  const m = s.match(/sketchfab\.com\/(?:3d-models\/[^/?#]*-|models\/)([0-9a-f]{32})/i);
  return m ? m[1] : null;
};

// capa do YouTube: maxresdefault é maior, mas nem sempre existe -> hqdefault como reserva
const posterYT  = id => `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
const posterYT2 = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;

const DLG = `<dialog id="dlg" aria-labelledby="d-title"><div class="bar"><span id="d-bar"></span><button id="close" type="button"></button></div>
<div class="d-stage"><div class="d-stage-view" id="d-view"></div><button class="d-nav d-prev" id="d-prev" type="button" data-step="-1"><span aria-hidden="true">&#8249;</span></button><button class="d-nav d-next" id="d-next" type="button" data-step="1"><span aria-hidden="true">&#8250;</span></button><span class="d-count" id="d-count" hidden></span></div>
<div class="d-thumbs" id="d-thumbs" hidden></div>
<div class="d-body"><h3 id="d-title"></h3><p class="meta" id="d-meta"></p><p id="d-desc"></p></div></dialog>`;
let area = null;

function pick(id, push){
  if (!AREAS.some(a => a.id === id)) id = AREAS[0].id;
  if (id !== area) filter = "all";
  area = id;
  if (push) { try { history.replaceState(null, "", "#" + id); } catch(err){} }
  render();
}

// render(): redesenha abas, filtros e a grade conforme a área/idioma/filtro.
function render(){
  const u = UI[lang];
  document.documentElement.lang = u.lang;
  if (!$("#dlg")) { document.body.insertAdjacentHTML("beforeend", DLG); ligarGaleria(); }
  $("#close").textContent = u.close;
  $("#lang").textContent = u.btn;
  $("#d-prev").setAttribute("aria-label", u.prev);
  $("#d-next").setAttribute("aria-label", u.next);
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = u[el.dataset.i18n]);
  $("#services").innerHTML = SERVICES[lang].map(s => `<li>${esc(s)}</li>`).join("");

  $("#tabs").innerHTML = AREAS.map(a =>
    `<button class="tab" type="button" role="tab" id="tab-${a.id}" aria-selected="${a.id === area}" tabindex="${a.id === area ? 0 : -1}" aria-controls="panel" data-id="${a.id}">${esc(a.name[lang])}</button>`
  ).join('<span class="sep" aria-hidden="true">/</span>');

  const a = AREAS.find(x => x.id === area), i = AREAS.indexOf(a);
  $("#panel").setAttribute("aria-labelledby", "tab-" + a.id);
  const cats = a.cats || [];
  const list = PROJECTS.map((p,j) => [p,j]).filter(([p]) => p.area === a.id && (filter === "all" || p.cat === filter));
  // Em "Todos", agrupa pela ordem das categorias cadastradas; dentro de cada
  // categoria, preserva a ordem original dos projetos em PROJECTS.
  const grupos = filter === "all" && cats.length
    ? cats.map(c => ({ cat:c, items:list.filter(([p]) => p.cat === c.id) })).filter(g => g.items.length)
    : [];
  const chips = cats.length
    ? `<div class="chips" role="group" aria-label="${u.filters}">` + [{id:"all",name:u.all}, ...cats.map(c => ({id:c.id,name:c.name[lang]}))]
        .map(c => `<button class="chip" type="button" data-c="${c.id}" aria-pressed="${c.id === filter}">${esc(c.name)}</button>`).join("") + `</div>`
    : "";
  const cardsHTML = items => `<div class="grid${items.length > 2 ? " feat" : ""}">${items.map(([p,j]) => `
      <button class="item" type="button" data-i="${j}">
        <div class="thumb">${capaHTML(p)}</div>
        <h3>${esc(p.title[lang])}</h3>
      </button>`).join("")}</div>`;
  const grade = list.length
    ? grupos.length
      ? grupos.map(g => `<section class="cat-group"><div class="cat-separator"><span>${esc(g.cat.name[lang])}</span></div>${cardsHTML(g.items)}</section>`).join("")
      : cardsHTML(list)
    : `<p class="vazio">${esc(u.empty)}</p>`;
  $("#panel").innerHTML = `
    <div class="bar"><span>${esc(a.name[lang]).toUpperCase()} / ${pad(i+1)}</span><i aria-hidden="true">— ✕</i></div>
    <div class="head"><h2>${esc(a.name[lang])}</h2><p class="lead">${esc(a.lead[lang])}</p></div>
    ${chips}
    ${grade}`;
  if (current !== null && $("#dlg").open) fill(current);
}

// fill(i): preenche o modal com os dados do projeto i.
function fill(i){
  const p = PROJECTS[i];
  const a = AREAS.find(x => x.id === p.area);
  $("#d-bar").textContent = a.name[lang].toUpperCase() + " / " + pad(i+1);
  $("#d-title").textContent = p.title[lang];
  $("#d-meta").textContent = p.tools;
  $("#d-meta").hidden = !p.tools;
  $("#d-desc").textContent = p.desc[lang];
  mid = 0;
  pintarMidia();
}

// HTML de uma mídia dentro do slide (sem o wrapper .d-slide)
function midiaHTML(m, i){
  const p = PROJECTS[current];
  const alt = esc(p.title[lang]);
  if (m.type === "video") {
    const id = YT(m.src);
    if (!id) return `<div class="ph">${esc(UI[lang].media_error)}</div>`;
    return `<button class="d-play" type="button" data-play="${i}" aria-label="${esc(UI[lang].play)}">
      <img src="${esc(m.poster || posterYT(id))}" alt="${alt}" data-fb="${m.poster ? "" : esc(posterYT2(id))}"></button>`;
  }
  if (m.type === "sketchfab") {
    const id = SK(m.src);
    if (!id) return `<div class="ph">${esc(UI[lang].media_error)}</div>`;
    const capa = m.poster ? `<img src="${esc(m.poster)}" alt="${alt}">` : `<span class="d-rotulo">SKETCHFAB</span>`;
    return `<button class="d-play sk" type="button" data-play="${i}" aria-label="${esc(UI[lang].model3d)}">${capa}</button>`;
  }
  return `<img src="${esc(m.src)}" alt="${alt}" decoding="async">`;
}

// HTML de uma miniatura da tira de baixo.
function thumbHTML(m, i){
  const classe = m.type === "video" ? " vid" : m.type === "sketchfab" ? " sk" : "";
  const src = m.type === "image" ? m.src : m.poster;
  const img = src ? `<img src="${esc(src)}" alt="">` : "";
  return `<button class="d-thumb${classe}" type="button" data-thumb="${i}" aria-current="${i === mid}"
    aria-label="${esc(UI[lang].media)} ${i+1}">${img}</button>`;
}

// Renderiza o track inteiro ou atualiza a posição
function pintarMidia(){
  const p = PROJECTS[current];
  const lista = p.media || [];
  
  if (!lista.length) {
    $("#d-view").innerHTML = `<div class="ph" style="--h:${p.h}">${UI[lang].img}</div>`;
    return;
  }
  
  let track = $("#d-track");
  // Se o track não existe ou o número de itens mudou, recria tudo
  if (!track || track.children.length !== lista.length) {
    $("#d-view").innerHTML = `<div class="d-track" id="d-track">
      ${lista.map((m, i) => `<div class="d-slide" data-index="${i}">${midiaHTML(m, i)}</div>`).join('')}
    </div>`;
    track = $("#d-track");
    
    // Posiciona instantaneamente sem animação no primeiro carregamento
    track.style.transition = 'none';
    track.style.transform = `translateX(-${mid * 100}%)`;
    void track.offsetWidth; // Força o navegador a recalcular
    track.style.transition = ''; // Restaura a animação
  } else {
    // Se só mudou de posição, anima suavemente
    track.style.transform = `translateX(-${mid * 100}%)`;
  }
  
  // Limpa iframes de vídeos que não estão ativos para não ficarem rodando
  [...track.children].forEach((slide, i) => {
    if (i !== mid && slide.querySelector('iframe')) {
      slide.innerHTML = midiaHTML(lista[i], i);
    }
  });
  
  // Carrega o vídeo atual
  const m = lista[mid];
  if (m && (m.type === "video" || m.type === "sketchfab")) {
    tocar(mid, false);
  }
  
  // Atualiza setas, contador e miniaturas
  const varias = lista.length > 1;
  $("#d-prev").hidden = !varias;
  $("#d-next").hidden = !varias;
  $("#d-count").hidden = !varias;
  $("#d-count").textContent = varias ? (mid+1) + " / " + lista.length : "";
  $("#d-thumbs").hidden = !varias;
  $("#d-thumbs").innerHTML = varias ? lista.map(thumbHTML).join("") : "";
}

// Troca a mídia (n = +1 ou -1)
function irMedia(n){
  const total = (PROJECTS[current].media || []).length;
  if (total < 2) return;
  mid = (mid + n + total) % total;
  pintarMidia();
}

// Troca a capa pelo player. Só no clique: nenhum iframe carrega antes disso.
function tocar(i, autoplay = true){
  const p = PROJECTS[current];
  const m = (p.media || [])[i];
  if (!m) return;
  
  const slide = document.querySelector(`.d-slide[data-index="${i}"]`);
  if (!slide) return;
  
  const titulo = esc(p.title[lang]);
  if (m.type === "video") {
    const id = YT(m.src);
    if (!id) return;
    const origem = /^https?:$/.test(location.protocol) ? `&origin=${encodeURIComponent(location.origin)}` : "";
    slide.innerHTML = `<iframe
      src="https://www.youtube.com/embed/${id}?autoplay=${autoplay ? 1 : 0}&rel=0&playsinline=1${origem}"
      title="${titulo}"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>`;
  } else if (m.type === "sketchfab") {
    const id = SK(m.src);
    if (!id) return;
    slide.innerHTML = `<iframe src="https://sketchfab.com/models/${id}/embed?autospin=0.2&autostart=1&ui_theme=dark"
      title="${titulo}" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe>`;
  }
}

// Teclado (← →), Swipe (arrastar) e clique
function ligarGaleria(){
  const dlg = $("#dlg"), palco = dlg.querySelector(".d-stage");
  
  // Teclado
  dlg.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); irMedia(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); irMedia(-1); }
  });
  
  // Arrastar (Swipe)
  let x0 = null, y0 = null, dragging = false;
  let track = null, largura = 0, startTranslate = 0;

  palco.addEventListener("pointerdown", e => {
    if (e.target.closest(".d-nav") || e.target.closest(".d-thumbs")) return;
    
    track = $("#d-track");
    if (!track) return;
    largura = palco.offsetWidth;
    if (!largura) return;

    x0 = e.clientX;
    y0 = e.clientY;
    dragging = false;
    startTranslate = -mid * largura;
    
    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';
  });

  palco.addEventListener("pointermove", e => {
    if (x0 === null || !track) return;
    const dx = e.clientX - x0;
    const dy = e.clientY - y0;
    
    if (!dragging) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
        dragging = true;
        track.style.transition = 'none';
        palco.setPointerCapture(e.pointerId);
      } else {
        return;
      }
    }
    
    track.style.transform = `translateX(${startTranslate + dx}px)`;
  });

  const finalizarArraste = (e) => {
    if (!track) return;
    document.body.style.userSelect = '';
    document.body.style.webkitUserSelect = '';
    
    if (!dragging) { x0 = null; return; }
    
    const dx = e.clientX - x0;
    x0 = null;
    dragging = false;
    
    track.style.transition = '';
    
    const limiar = largura * 0.15;
    
    if (dx > limiar && mid > 0) {
      irMedia(-1);
    } else if (dx < -limiar && mid < track.children.length - 1) {
      irMedia(1);
    } else {
      track.style.transform = `translateX(-${mid * 100}%)`;
    }
  };

  palco.addEventListener("pointerup", finalizarArraste);
  palco.addEventListener("pointercancel", () => {
      if(track) track.style.transform = `translateX(-${mid * 100}%)`;
      x0 = null; dragging = false;
      document.body.style.userSelect = '';
      document.body.style.webkitUserSelect = '';
  });
}

// Um único "ouvinte" de cliques para: abas, filtros, cards, fechar modal e idioma.
document.addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (t) { pick(t.dataset.id, true); return; }
  const f = e.target.closest(".chip");
  if (f) { filter = f.dataset.c; render(); const n = document.querySelector(`.chip[data-c="${filter}"]`); if (n) n.focus(); return; }
  const b = e.target.closest(".item");
  if (b) { current = +b.dataset.i; fill(current); $("#dlg").showModal(); return; }
  const th = e.target.closest("[data-thumb]");
  if (th) { mid = +th.dataset.thumb; pintarMidia(); return; }
  const nv = e.target.closest("[data-step]");
  if (nv) { irMedia(+nv.dataset.step); return; }
  const pl = e.target.closest("[data-play]");
  if (pl) { tocar(+pl.dataset.play); return; }
  if (e.target.closest("#close") || e.target.id === "dlg") {
    $("#d-view").innerHTML = "";   // para o vídeo se estiver tocando
    $("#dlg").close();
  }
  if (e.target.closest("#lang")) {
    lang = lang === "pt" ? "en" : "pt";
    try { localStorage.setItem("lang", lang); } catch(err){}
    render();
  }
});
/* imagem que o navegador não consegue mostrar (formato errado ou arquivo faltando)
   vira o placeholder em vez de ícone de imagem quebrada */
document.addEventListener("error", e => {
  const img = e.target;
  if (!img || img.tagName !== "IMG" || img.dataset.fb || img.dataset.falhou) return;
  img.dataset.falhou = "1";
  const ph = document.createElement("div");
  ph.className = "ph";
  ph.style.setProperty("--h", "0");
  ph.textContent = UI[lang].img;
  img.replaceWith(ph);
}, true);

window.addEventListener("hashchange", () => pick(location.hash.slice(1), false));
$("#tabs").addEventListener("keydown", e => {
  const k = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
  if (!k) return;
  e.preventDefault();
  const i = (AREAS.findIndex(a => a.id === area) + k + AREAS.length) % AREAS.length;
  pick(AREAS[i].id, true);
  $("#tab-" + AREAS[i].id).focus();
});

pick(location.hash.slice(1), false);


/* aplica a cor de destaque do fundo sorteado (tabela PALETA, gerada por tools/paleta.js) */
function aplicarDestaque(url){
  let nome = String(url).split("/").pop() || "";
  try { nome = decodeURIComponent(nome); } catch(e) {}
  const cor = PALETA[nome];
  if (cor) document.documentElement.style.setProperty("--accent", cor);
}

/* fundo aleatório: sorteia uma imagem, e se o arquivo não existir tenta outra */
function sortear(cfg, el){
  if (!el) return;
  const ordem = Array.from({length: cfg.total}, (_, i) => i + 1).sort(() => Math.random() - .5);
  const tentar = k => {
    if (k >= ordem.length) return;               // nenhum carregou: fica só o fundo escuro
    el.onload = () => {
      el.classList.add("ready");
      // a cor de destaque vem só da camada de trás (as camadas da frente são brancas)
      if (cfg === FUNDOS.base) aplicarDestaque(el.src);
    };
    el.onerror = () => tentar(k + 1);
    el.src = `${cfg.pasta}/${cfg.prefixo}${ordem[k]}.${cfg.ext}`;
  };
  tentar(0);
}
sortear(FUNDOS.base, $(".fundo .f1"));
sortear(FUNDOS.camada, $(".fundo .f2"));

/* parallax: as duas camadas estão no mesmo bloco, então se movem exatamente juntas */
(function(){
  const fundo = $(".fundo");
  if (!fundo || matchMedia("(prefers-reduced-motion: reduce)").matches || matchMedia("(max-width: 640px)").matches) return;
  fundo.style.willChange = "transform";
  let ticking = false;
  addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      fundo.style.transform = `translate3d(0,${scrollY * FUNDOS.parallax}px,0)`;
      ticking = false;
    });
  }, { passive: true });
})();
