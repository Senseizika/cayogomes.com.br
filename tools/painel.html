function linhaCategoria(c, i, total) {
  return `<div class="cat" data-ci="${i}">
    <div class="cat-topo">
      <span class="num">${String(i + 1).padStart(2, '0')}</span>
      <button class="empurra" data-cat-subir ${i === 0 ? 'disabled' : ''} title="mover para cima">↑</button>
      <button data-cat-descer ${i === total - 1 ? 'disabled' : ''} title="mover para baixo">↓</button>
      <button class="perigo" data-cat-remover title="remover categoria">×</button>
    </div>
    <div class="cat-linha">
      <label>nome PT <input data-catcampo="name.pt" value="${esc(c.name?.pt)}"></label>
      <label>nome EN <input data-catcampo="name.en" value="${esc(c.name?.en)}"></label>
    </div>
    <label class="cat-id">id (slug) <input data-catcampo="id" value="${esc(c.id)}" placeholder="gerado automaticamente ao salvar"></label>
  </div>`;
}

function abrir(p) {
  projetoSelecionado = p && projetos.includes(p) ? p : null;
  areaSelecionada = null;
  categoriaSelecionada = null;
  document.body.classList.add("editando");
  if (modoAtual !== 'projetos') { mudarModo('projetos'); return; }
  if (!$("#lista").firstElementChild) desenharLista(true);
  atualizarSelecaoVisual();
  if (projetoAtual()) desenharForm();
}
function abrirArea(a) {
  areaSelecionada = a && areasEditaveis.includes(a) ? a : null;
  categoriaSelecionada = null;
  idOriginalArea = areaSelecionada?.id || '';
  document.body.classList.add('editando');
  if (modoAtual !== 'areas') { mudarModo('areas'); return; }
  if (!$("#lista").firstElementChild) desenharLista(true);
  atualizarSelecaoVisual();
  if (areaAtual()) desenharFormArea();
}
function abrirCat(a, c) {
  categoriaSelecionada = a && c && (a.cats || []).includes(c) ? c : null;
  if (categoriaSelecionada) areaSelecionada = a;
  document.body.classList.add('editando');
  if (modoAtual !== 'categorias') { mudarModo('categorias'); return; }
  if (!$("#lista").firstElementChild) desenharLista(true);
  atualizarSelecaoVisual();
  if (categoriaAtual()) desenharFormCat();
}
function fechar() { document.body.classList.remove("editando"); }
$("#fechar-drawer").onclick = fechar;

$("#busca-projeto").addEventListener("input", e => { buscaProjeto = e.target.value; if (modoAtual === 'projetos') desenharLista(true); });

$("#form").addEventListener("input", e => {
  const c = e.target.closest("[data-campo]");
  if (c) {
    if (c.dataset.campo === "carrossel") {
      projetoAtual().galeria = c.checked ? "carrossel" : "slide";
      marcarSujo();
      return;
    }
    setCampo(projetoAtual(), c.dataset.campo, c.value);
    if (c.dataset.campo === "title.pt") {
      $("#drawer-titulo").textContent = String(indiceProjeto(projetoAtual()) + 1).padStart(2, "0") + " · " + (c.value || "sem título");
      const li = document.querySelector(`li[data-i="${indiceProjeto(projetoAtual())}"] span:not(.handle)`);
      if (li) {
        const avisos = temProblema(projetoAtual());
        const avisoHTML = avisos.length ? `<span class="aviso-icon" title="${avisos.join(' • ')}">⚠️</span>` : "";
        li.innerHTML = `${esc(c.value || "(sem título)")} ${avisoHTML}`;
      }
    }
    marcarSujo();
    return;
  }
  
  const m = e.target.closest("[data-mcampo]");
  if (m && (m.dataset.mcampo === "src" || m.dataset.mcampo === "poster")) {
    const mi = +m.closest("[data-mi]").dataset.mi;
    projetoAtual().media[mi][m.dataset.mcampo] = m.value;
    marcarSujo();
    return;
  }
  const ca = e.target.closest('[data-acampo]');
  if (ca) {
    const a = areaAtual();
    if (!a) return;
    if (ca.dataset.acampo === 'id') a._autoId = false;
    setCampo(a, ca.dataset.acampo, ca.value);
    if (ca.dataset.acampo === 'name.pt') {
      $('#drawer-titulo').textContent = String(indiceArea(a) + 1).padStart(2, '0') + ' · ' + (ca.value || 'sem nome');
      if (a._autoId || /^area-\d+$/.test(a.id || '')) {
        a._autoId = true;
        const novoSlug = slug(ca.value);
        if (novoSlug && novoSlug !== 'item') {
          const antigoId = a.id;
          a.id = novoSlug;
          idOriginalArea = novoSlug;
          projetos.forEach(p => { if (p.area === antigoId) p.area = novoSlug; });
          const idInput = document.querySelector('[data-acampo="id"]');
          if (idInput) idInput.value = a.id;
          const det = document.querySelector(`#lista details[data-area-id="${antigoId}"]`);
          if (det) det.dataset.areaId = novoSlug;
          if (gruposFechados.has(`areas:area:${antigoId}`)) {
            gruposFechados.delete(`areas:area:${antigoId}`);
            gruposFechados.add(`areas:area:${novoSlug}`);
          }
        }
      }
      const det = document.querySelector(`#lista details[data-area-id="${a.id}"]`);
      const sum = det && det.querySelector(':scope > summary');
      if (sum) {
        const handle = sum.querySelector('.handle');
        sum.textContent = '';
        if (handle) sum.appendChild(handle);
        sum.append(' ' + (ca.value || '(sem nome)'));
      }
    }
    if (ca.dataset.acampo === 'id') {
      const rolagem = $('#form').scrollTop;
      desenharFormArea();
      $('#form').scrollTop = rolagem;
      const idInput = document.querySelector('[data-acampo="id"]');
      if (idInput) { idInput.focus(); idInput.setSelectionRange(ca.value.length, ca.value.length); }
      return;
    }
    marcarSujo();
    return;
  }
  const cc = e.target.closest('[data-catcampo]');
  if (cc) {
    let cat = null, area = null;
    if (modoAtual === 'categorias') {
      cat = categoriaAtual();
      area = areaDaCategoria(cat);
    } else {
      area = areaAtual();
      const ci = +cc.closest('[data-ci]').dataset.ci;
      cat = area?.cats?.[ci] || null;
    }
    if (!cat) return;
    if (cc.dataset.catcampo === 'id') cat._autoId = false;
    setCampo(cat, cc.dataset.catcampo, cc.value);
    if (cc.dataset.catcampo === 'name.pt') {
      if (modoAtual === 'categorias') $('#drawer-titulo').textContent = 'Cat · ' + (cc.value || 'sem nome');
      if (area && (cat._autoId || /^cat-\d+$/.test(cat.id || ''))) {
        cat._autoId = true;
        const baseSlug = slug(cc.value);
        if (baseSlug && baseSlug !== 'item') {
          const usados = new Set((area.cats || []).filter(x => x !== cat).map(x => x.id));
          let novoSlug = baseSlug, n = 2;
          while (usados.has(novoSlug)) novoSlug = baseSlug + '-' + (n++);
          const antigoId = cat.id;
          cat.id = novoSlug;
          projetos.forEach(p => { if (p.area === area.id && p.cat === antigoId) p.cat = novoSlug; });
          const box = cc.closest('.cat[data-ci]') || $('#form');
          const idInput = box.querySelector('[data-catcampo="id"]');
          if (idInput) idInput.value = novoSlug;
        }
      }
    }
    marcarSujo();
    return;
  }
});

$("#form").addEventListener("change", async e => {
  if (e.target.id === "opt-webp") {
    try { localStorage.setItem("painel_webp", e.target.checked ? "1" : "0"); } catch (err) {}
    return;
  }
  if (e.target.id === "opt-marca") {
    try { localStorage.setItem("painel_marca", e.target.checked ? "1" : "0"); } catch (err) {}
    return;
  }
  const tipo = e.target.closest('[data-mcampo="type"]');
  if (tipo) {
    const mi = +tipo.closest("[data-mi]").dataset.mi;
    projetoAtual().media[mi].type = tipo.value;
    marcarSujo();
    desenharForm();
    return;
  }
  const pp = e.target.closest('[data-mcampo="poster-pick"]');
  if (pp) {
    const mi = +pp.closest("[data-mi]").dataset.mi;
    projetoAtual().media[mi].poster = pp.value;
    marcarSujo();
    desenharForm();
    return;
  }
  const area = e.target.closest('[data-campo="area"]');
  if (area) {
    projetoAtual().area = area.value;
    projetoAtual().cat = "";
    abrirGrupoDoProjeto(projetoAtual());
    marcarSujo();
    desenharForm();
    desenharLista();
    atualizarSelecaoVisual();
    return;
  }
  const categoria = e.target.closest('[data-campo="cat"]');
  if (categoria) {
    projetoAtual().cat = categoria.value;
    abrirGrupoDoProjeto(projetoAtual());
    marcarSujo();
    desenharLista();
    atualizarSelecaoVisual();
    return;
  }
  const catArea = e.target.closest('[data-cat-area]');
  if (catArea) {
    const destino = areasEditaveis.find(a => a.id === catArea.value);
    const origem = areaDaCategoria(categoriaAtual());
    if (origem && destino && origem !== destino) {
      const catObj = categoriaAtual();
      origem.cats.splice(origem.cats.indexOf(catObj), 1);
      destino.cats = destino.cats || [];
      destino.cats.push(catObj);
      categoriaSelecionada = catObj;
      gruposFechados.delete('categorias:area:' + destino.id);
      marcarSujo();
      desenharFormCat();
      desenharLista();
      atualizarSelecaoVisual();
      status("Categoria movida de área!");
    }
    return;
  }
});

$("#form").addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (!b) return;

  if (b.id === 'corrigir-slug') {
    const novoId = areaAtual().id;
    const antigoId = idOriginalArea;
    projetos.forEach(p => { if (p.area === antigoId) p.area = novoId; });
    idOriginalArea = novoId;
    marcarSujo();
    desenharFormArea();
    desenharLista();
    status("Projetos vinculados ao novo ID com sucesso!");
    return;
  }

  if (b.id === 'apagar-cat') {
    if (confirm('Apagar esta categoria? Os projetos ficarão "Sem categoria".')) {
      const cat = categoriaAtual();
      const catArea = areaDaCategoria(cat);
      if (catArea) {
        catArea.cats.splice(catArea.cats.indexOf(cat), 1);
        projetos.forEach(p => { if (p.area === catArea.id && p.cat === cat.id) delete p.cat; });
      }
      categoriaSelecionada = null;
      marcarSujo();
      fechar();
      desenharLista();
      status("Categoria apagada!");
    }
    return;
  }

  const caixaCat = b.closest(".cat[data-ci]");
  if (caixaCat && areaAtual()) {
    const ci = +caixaCat.dataset.ci;
    const cats = areaAtual().cats || [];
    if (b.hasAttribute("data-cat-subir") && ci > 0) {
      [cats[ci - 1], cats[ci]] = [cats[ci], cats[ci - 1]];
      marcarSujo();
      const rolagem = $('#form').scrollTop;
      desenharFormArea();
      $('#form').scrollTop = rolagem;
      desenharLista();
      return;
    }
    if (b.hasAttribute("data-cat-descer") && ci < cats.length - 1) {
      [cats[ci + 1], cats[ci]] = [cats[ci], cats[ci + 1]];
      marcarSujo();
      const rolagem = $('#form').scrollTop;
      desenharFormArea();
      $('#form').scrollTop = rolagem;
      desenharLista();
      return;
    }
    if (b.hasAttribute("data-cat-remover")) {
      if (confirm('Apagar esta categoria? Os projetos ficarão "Sem categoria".')) {
        const [removida] = cats.splice(ci, 1);
        if (removida) {
          const areaId = areaAtual().id;
          projetos.forEach(p => { if (p.area === areaId && p.cat === removida.id) delete p.cat; });
          if (categoriaSelecionada === removida) categoriaSelecionada = null;
        }
        marcarSujo();
        const rolagem = $('#form').scrollTop;
        desenharFormArea();
        $('#form').scrollTop = rolagem;
        desenharLista();
        status("Categoria apagada!");
      }
      return;
    }
  }

  if (b.id === 'add-cat') {
    areaAtual().cats = areaAtual().cats || [];
    areaAtual().cats.push({ id: "cat-" + Date.now(), name: { pt: '', en: '' } });
    marcarSujo();
    const rolagem = $('#form').scrollTop;
    desenharFormArea();
    $('#form').scrollTop = rolagem;
    const catInputs = document.querySelectorAll('[data-catcampo="name.pt"]');
    catInputs[catInputs.length - 1]?.focus();
    return;
  }
  
  if (b.id === 'apagar-area') {
    if (confirm('Apagar esta área? Projetos que a usam ficarão sem área válida.')) {
      const removida = areaAtual();
      const ai = areasEditaveis.indexOf(removida);
      if (ai >= 0) areasEditaveis.splice(ai, 1);
      areaSelecionada = areasEditaveis[Math.min(ai, areasEditaveis.length - 1)] || null;
      marcarSujo();
      if (!areaSelecionada) fechar();
      else { idOriginalArea = areaSelecionada.id || ''; desenharFormArea(); }
      desenharLista();
    }
    return;
  }

  if (b.hasAttribute("data-fs-mark")) {
    const cx = b.closest("[data-mi]");
    const mi = cx ? +cx.dataset.mi : -1;
    const media = projetoAtual()?.media || [];
    if (mi >= 0 && media[mi]) { media[mi].fullscreen = !media[mi].fullscreen; marcarSujo(); desenharForm(); }
    return;
  }
  if (b.id === "marcar-todas-fs") {
    const p = projetoAtual();
    if (!p) return;
    const imgs = (p.media || []).filter(m => m.type === "image");
    if (!imgs.length) return;
    const todas = imgs.every(m => m.fullscreen);
    imgs.forEach(m => { m.fullscreen = !todas; });
    marcarSujo();
    desenharForm();
    return;
  }
  if (b.dataset.op) {
    const cx = b.closest("[data-mi]");
    const m = projetoAtual()?.media?.[cx ? +cx.dataset.mi : -1];
    if (!m || !midiaProcessavel(m)) return;
    const op = b.dataset.op;
    if (op === "webp" && /\.webp$/i.test(m.src || "")) return; // já é WebP
    const ligar = !desejoMidia(m.src)[op];
    const pend = { ...(pendenteMidia[m.src] || {}) };
    if (ligar === !!(estadoMidia[m.src] || {})[op]) delete pend[op];
    else pend[op] = ligar;
    if (Object.keys(pend).length) pendenteMidia[m.src] = pend; else delete pendenteMidia[m.src];
    gravarMapa(KEY_PENDENTE_MIDIA, pendenteMidia);
    const rolagem = $("#form").scrollTop;
    desenharForm();
    $("#form").scrollTop = rolagem;
    return;
  }
  if (b.dataset.bulk) {
    const ligar = b.dataset.bulk === "on";
    for (const m of (projetoAtual()?.media || [])) {
      if (!midiaProcessavel(m)) continue;
      const pend = { ...(pendenteMidia[m.src] || {}) };
      for (const op of ["webp", "marca"]) {
        if (op === "webp" && /\.webp$/i.test(m.src || "")) { delete pend.webp; continue; }
        if (ligar === !!(estadoMidia[m.src] || {})[op]) delete pend[op];
        else pend[op] = ligar;
      }
      if (Object.keys(pend).length) pendenteMidia[m.src] = pend; else delete pendenteMidia[m.src];
    }
    gravarMapa(KEY_PENDENTE_MIDIA, pendenteMidia);
    const rolagem = $("#form").scrollTop;
    desenharForm();
    $("#form").scrollTop = rolagem;
    return;
  }
  if (b.id === "enviar-imagens") {
    const p = projetoAtual();
    if (!p) return;
    p.media = p.media || [];
    abrirSeletor("src", p.media.length);
    return;
  }
  if (b.id === "aplicar-mudancas") {
    await aplicarMudancasMidia();
    return;
  }

  const caixa = b.closest("[data-mi]");
  const mi = caixa ? +caixa.dataset.mi : -1;
  const media = projetoAtual()?.media || [];

  if (b.hasAttribute("data-escolher")) {
    if (caixa) abrirSeletor(b.dataset.escolher, mi);
  }
  else if (b.id === "add-midia") {
    projetoAtual().media.unshift({ type: "image", src: "" });
    marcarSujo();
    desenharForm();
  }
  else if (b.hasAttribute("data-subir") && mi > 0) {
    [media[mi - 1], media[mi]] = [media[mi], media[mi - 1]];
    marcarSujo();
    desenharForm();
  }
  else if (b.hasAttribute("data-descer") && mi < media.length - 1) {
    [media[mi + 1], media[mi]] = [media[mi], media[mi + 1]];
    marcarSujo();
    desenharForm();
  }
  else if (b.hasAttribute("data-remover")) {
    media.splice(mi, 1);
    marcarSujo();
    desenharForm();
  }
});

const seletor = $("#seletor");
function abrirSeletor(alvo, mi) {
  seletor.value = "";
  seletor.multiple = alvo === "src";
  seletor.dataset.alvo = alvo;
  seletor.dataset.mi = String(mi);
  status(alvo === "src" ? "escolha uma ou mais imagens…" : "escolha a imagem de capa…");
  seletor.click();
}

seletor.addEventListener("change", () => {
  const lista = [...seletor.files];
  const alvo = seletor.dataset.alvo;
  const mi = +seletor.dataset.mi;
  seletor.value = "";
  if (lista.length) enviarArquivos(lista, alvo, mi);
});

let marcaDaguaCarregada = null;

function carregarMarcaDagua() {
  if (marcaDaguaCarregada) return marcaDaguaCarregada;
  marcaDaguaCarregada = new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => { marcaDaguaCarregada = null; falha(new Error("imagem da marca não carregou")); };
    img.src = MARCA_DAGUA_PNG;
  });
  return marcaDaguaCarregada;
}

// Queima a marca no centro do canvas, com 20% de opacidade.
async function aplicarMarcaDagua(canvas, ctx) {
  try {
    const img = await carregarMarcaDagua();
    const largura = canvas.width * 0.2;
    const proporcao = (img.naturalHeight || 168) / (img.naturalWidth || 356);
    const altura = largura * proporcao;
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.drawImage(img, (canvas.width - largura) / 2, (canvas.height - altura) / 2, largura, altura);
    ctx.restore();
    return true;
  } catch (e) {
    console.warn("marca d'água não aplicada:", e);
    return false;
  }
}

// Desenha o arquivo no canvas já com o teto FullHD (mesma conta de antes).
async function desenharNoCanvas(file) {
  let bmp = null, url = null;
  try {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    let srcW, srcH;
    if (typeof createImageBitmap === "function") {
      bmp = await createImageBitmap(file);
      srcW = bmp.width; srcH = bmp.height;
      const scale = Math.min(1, LIMITE_W / srcW, LIMITE_H / srcH);
      canvas.width = Math.round(srcW * scale);
      canvas.height = Math.round(srcH * scale);
      ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
    } else {
      url = URL.createObjectURL(file);
      const img = await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = rej;
        im.src = url;
      });
      srcW = img.naturalWidth || img.width;
      srcH = img.naturalHeight || img.height;
      const scale = Math.min(1, LIMITE_W / srcW, LIMITE_H / srcH);
      canvas.width = Math.round(srcW * scale);
      canvas.height = Math.round(srcH * scale);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }
    return { canvas, ctx, srcW, srcH };
  } finally {
    if (bmp && typeof bmp.close === "function") bmp.close();
    if (url) URL.revokeObjectURL(url);
  }
}

// Nome mantido por compatibilidade: além do WebP, agora queima a marca d'água
// mesmo com a otimização desligada (reexportando no formato original).
async function otimizarImagemWebP(file, opcoes = null) {
  // opcoes = { webp, marca } força o processamento desta imagem; um booleano
  // legado significa "forçar marca" (usado pela marcação do acervo).
  const escolha = typeof opcoes === "boolean" ? { marca: opcoes } : (opcoes && typeof opcoes === "object" ? opcoes : {});
  const tipoOriginal = file.type || "";
  const tipo = /^image\/jpg$/i.test(tipoOriginal) ? "image/jpeg" : tipoOriginal;
  const converter = /^image\/(png|jpeg|bmp)$/i.test(tipo);
  const jaWebP = /^image\/webp$/i.test(tipo);
  const estatica = TIPOS_IMAGEM_ESTATICA.test(tipo);
  const webp = "webp" in escolha ? !!escolha.webp : webpAtivo();
  const marcar = estatica && ("marca" in escolha ? !!escolha.marca : marcaAtiva());

  // GIF, vídeo, PDF, 3D e tipos desconhecidos passam intactos.
  if (!estatica) return file;
  // WebP desligado e sem marca: nada a fazer.
  if (!webp && !marcar) return file;
  // Com WebP ligado, sem marca, só PNG/JPEG/BMP/WebP são processados.
  if (!marcar && !(converter || jaWebP)) return file;

  let desenho;
  try {
    desenho = await desenharNoCanvas(file);
  } catch (e) {
    // Se falhar o desenho no navegador, envia o arquivo original.
    return file;
  }
  const { canvas, ctx, srcW, srcH } = desenho;

  // WebP já dentro do teto e sem marca não precisa ser reencodado (regra antiga).
  if (!marcar && jaWebP && srcW <= LIMITE_W && srcH <= LIMITE_H) return file;

  if (marcar) await aplicarMarcaDagua(canvas, ctx);

  const usarWebP = webp && (converter || jaWebP);
  let destino = usarWebP ? "image/webp" : tipo;
  let blob = await new Promise(res => canvas.toBlob(res, destino, 0.92));

  // Alguns navegadores não exportam BMP/AVIF: cai para PNG para não perder a marca.
  if (!blob && marcar && destino !== "image/png") {
    destino = "image/png";
    blob = await new Promise(res => canvas.toBlob(res, "image/png"));
  }
  if (!blob || !blob.size) return file;

  // Sem marca, mantém a regra antiga: PNG/JPEG/BMP só trocam se o WebP ficar menor.
  if (!marcar && !jaWebP && blob.size >= file.size) return file;

  const base = file.name.replace(/\.[^.]+$/, "") || "imagem";
  const ext = { "image/webp": ".webp", "image/png": ".png", "image/jpeg": ".jpg", "image/avif": ".avif" }[destino];
  const nome = destino === tipo ? file.name : base + (ext || (file.name.match(/\.[^.]+$/) || [""])[0]);
  return new File([blob], nome, { type: destino });
}

// Marca em massa das imagens já salvas no acervo — tudo no navegador:
// lê cada arquivo, passa pelo mesmo fluxo de marca e grava via /api/arquivo.
const MIME_IMAGEM = {
  png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg",
  bmp: "image/bmp", webp: "image/webp", avif: "image/avif"
};
const CHAVE_MARCADOS_ACERVO = "painel_marca_acervo";

function imagensMarcaveis() {
  const achados = new Set();
  for (const p of projetos) {
    for (const m of (p.media || [])) {
      for (const campo of ["src", "poster"]) {
        const v = m && m[campo];
        if (typeof v !== "string" || /^https?:\/\//i.test(v)) continue;
        if (/\.(png|jpe?g|bmp|webp|avif)$/i.test(v)) achados.add(v);
      }
    }
  }
  return [...achados];
}

function jaMarcadosNoAcervo() {
  try {
    const v = JSON.parse(localStorage.getItem(CHAVE_MARCADOS_ACERVO) || "[]");
    return new Set(Array.isArray(v) ? v : []);
  } catch (e) { return new Set(); }
}

$("#marcar-acervo").onclick = async e => {
  const refazer = e.shiftKey;
  const feitos = refazer ? new Set() : jaMarcadosNoAcervo();
  const lista = imagensMarcaveis().filter(c => !feitos.has(c));
  if (!lista.length) { status("acervo já marcado (shift+clique para refazer)"); return; }
  if (!confirm("Aplicar a marca em " + lista.length + " imagem(ns) do acervo?\n\n" +
      "Serão criados arquivos novos, as referências serão atualizadas e os originais " +
      "sairão de img/projetos. Cópias locais ficam fora do repositório para você desfazer depois.\n" +
      "Depois clique em salvar e em ↑ push.")) return;

  const btn = $("#marcar-acervo");
  btn.disabled = true;
  let ok = 0, falhas = 0;
  const remover = new Set();
  try {
    const pares = lista.map(caminho => ({ src: caminho, origem: (estadoMidia[caminho] || {}).origem || caminho }));
    const criados = await garantirBackups(pares);
    for (let i = 0; i < lista.length; i++) {
      const caminho = lista[i];
      const origemAntes = pares[i].origem;
      const origem = (estadoMidia[caminho] || {}).origem || caminho;
      status("marcando " + (i + 1) + " de " + lista.length + ": " + (caminho.split("/").pop() || caminho));
      try {
        const { arquivo } = await carregarOriginal(caminho);
        const marcada = await otimizarImagemWebP(arquivo, { marca: true, webp: false });
        if (marcada === arquivo) throw new Error("o navegador não processou a imagem");
        const r = await api("/api/arquivo", {
          pasta: pastaDeMidia(caminho, origem),
          nome: marcada.name,
          dados: await lerBase64(marcada)
        });
        for (const p of projetos) {
          for (const m of (p.media || [])) {
            for (const campo of ["src", "poster"]) if (m[campo] === caminho) m[campo] = r.caminho;
          }
        }
        limparPendencia(caminho);
        delete estadoMidia[caminho];
        registrarEstado(r.caminho, { marca: true, webp: false }, origem);
        remover.add(caminho);
        if (criados.has(origemAntes)) remover.add(origemAntes);
        feitos.add(caminho);
        feitos.add(r.caminho);
        try { localStorage.setItem(CHAVE_MARCADOS_ACERVO, JSON.stringify([...feitos])); } catch (err) {}
        ok++;
      } catch (err) {
        falhas++;
        console.warn("marca do acervo falhou:", caminho, err);
      }
    }
    const refs = referenciasMidia();
    await removerArquivosMidia([...remover].filter(c => !refs.has(c)));
  } finally {
    btn.disabled = false;
  }
  marcarSujo();
  desenharLista();
  if (projetoAtual()) desenharForm();
  status("acervo: " + ok + " imagem(ns) marcada(s)" + (falhas ? " · " + falhas + " falha(s) (ver console)" : "") + ". Originais fora do site. Salve e depois ↑ push.", falhas > 0);
};

function pastaDoProjeto(p) {
  for (const m of (p.media || [])) {
    for (const campo of ["src", "poster"]) {
      const val = m && m[campo];
      if (!val) continue;
      const match = /^img\/projetos\/([^/]+)\//.exec(val);
      if (match && match[1] && match[1] !== "item") return match[1];
    }
  }
  const titulo = String(p.title?.pt || p.title?.en || "").trim();
  if (titulo) return slug(titulo);
  p._pastaTemp = p._pastaTemp || ("novo-" + Date.now().toString(36));
  return p._pastaTemp;
}

async function enviarArquivos(lista, alvo, mi0) {
  const p = projetoAtual();
  if (!p || !p.media || !lista.length) return;
  if (!p.media[mi0]) p.media[mi0] = { type: "image", src: "" };

  const arquivos = [...lista];
  if (alvo !== "src") arquivos.length = 1;

  const pasta = pastaDoProjeto(p);
  let destino = mi0, ultimo = null, foraDoSite = [];

  for (let k = 0; k < arquivos.length; k++) {
    const original = arquivos[k];
    try {
      const f = await otimizarImagemWebP(original);
      // O original do arquivo novo nunca entra no repo; guarde uma cópia fora
      // dele para que "desmarcar + confirmar" consiga restaurar depois.
      let origemBackup = null;
      if (f !== original && alvo === "src") {
        const b = await api("/api/midia/backup", { nome: original.name, dados: await lerBase64(original) });
        origemBackup = PREFIXO_BACKUP + b.chave;
      }
      status(arquivos.length > 1 ? "enviando " + (k + 1) + " de " + arquivos.length + ": " + f.name : "enviando " + f.name + "…");
      const dados = await lerBase64(f);
      const r = await api("/api/arquivo", { pasta, nome: f.name, dados });
      if (projetoAtual() !== p) return;
      if (k > 0) { p.media.splice(destino + 1, 0, { type: "image", src: "" }); destino += 1; }
      p.media[destino][alvo] = r.caminho;
      if (origemBackup && alvo === "src") {
        registrarEstado(r.caminho, {
          webp: webpAtivo() && !arquivoJaWebP(original) && /\.webp$/i.test(f.name),
          marca: marcaAtiva() && TIPOS_IMAGEM_ESTATICA.test(original.type || "")
        }, origemBackup);
      }
      ultimo = r;
      if (alvo === "src" && !WEB_IMG.test(r.caminho)) foraDoSite.push(r.caminho.split("/").pop());
      marcarSujo();
      const rolagem = $("#form").scrollTop;
      desenharForm();
      $("#form").scrollTop = rolagem;
    } catch (err) {
      console.error(err);
      marcarSujo();
      desenharForm();
      status("erro ao enviar " + original.name + ": " + (err && err.message ? err.message : String(err)), true);
      return;
    }
  }

  const kb = r => r.bytes < 1024 ? r.bytes + " B" : Math.round(r.bytes / 1024) + " KB";
  const aviso = foraDoSite.length ? " — " + foraDoSite.join(", ") + (foraDoSite.length > 1 ? " não aparecem" : " não aparece") + " no site (use webp, jpg, png, gif ou avif)" : "";
  if (arquivos.length === 1) status("arquivo salvo: " + ultimo.caminho + " (" + kb(ultimo) + ")" + aviso, aviso !== "");
  else status(arquivos.length + " arquivos salvos" + aviso, aviso !== "");
}

let midiaDragIdx = null;
$("#form").addEventListener("dragstart", e => {
  const topo = e.target.closest(".midia .topo");
  if (!topo) return;
  const caixa = topo.closest(".midia[data-mi]");
  if (!caixa) return;
  midiaDragIdx = +caixa.dataset.mi;
  caixa.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", String(midiaDragIdx));
});
$("#form").addEventListener("dragend", () => {
  midiaDragIdx = null;
  document.querySelectorAll("#form .midia.dragging, #form .midia.drag-over").forEach(el => el.classList.remove("dragging", "drag-over"));
});
$("#form").addEventListener("dragover", e => {
  if (midiaDragIdx !== null) {
    const caixa = e.target.closest(".midia[data-mi]");
    document.querySelectorAll("#form .midia.drag-over").forEach(el => { if (el !== caixa) el.classList.remove("drag-over"); });
    if (caixa && +caixa.dataset.mi !== midiaDragIdx) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      caixa.classList.add("drag-over");
    }
    return;
  }
  const alvo = e.target.closest("[data-escolher]");
  if (!alvo) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
  alvo.classList.add("recebendo");
});
$("#form").addEventListener("dragleave", e => {
  if (midiaDragIdx !== null) {
    const caixa = e.target.closest(".midia[data-mi]");
    if (caixa && !caixa.contains(e.relatedTarget)) caixa.classList.remove("drag-over");
    return;
  }
  const alvo = e.target.closest("[data-escolher]");
  if (alvo) alvo.classList.remove("recebendo");
});
$("#form").addEventListener("drop", e => {
  if (midiaDragIdx !== null) {
    e.preventDefault();
    const origem = midiaDragIdx;
    midiaDragIdx = null;
    document.querySelectorAll("#form .midia.dragging, #form .midia.drag-over").forEach(el => el.classList.remove("dragging", "drag-over"));
    const caixa = e.target.closest(".midia[data-mi]");
    const media = projetoAtual()?.media;
    if (caixa && Array.isArray(media)) {
      const destino = +caixa.dataset.mi;
      if (destino !== origem && media[origem] && media[destino]) {
        const [item] = media.splice(origem, 1);
        media.splice(destino, 0, item);
        marcarSujo();
        const rolagem = $("#form").scrollTop;
        desenharForm();
        $("#form").scrollTop = rolagem;
      }
    }
    return;
  }
  const alvo = e.target.closest("[data-escolher]");
  if (!alvo) return;
  e.preventDefault();
  alvo.classList.remove("recebendo");
  const lista = [...(e.dataTransfer?.files || [])];
  const caixa = alvo.closest("[data-mi]");
  if (caixa && lista.length) enviarArquivos(lista, alvo.dataset.escolher, +caixa.dataset.mi);
});

document.addEventListener("keydown", e => {
  const editorAberto = $("#editor-texto")?.open;
  if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "s") {
    e.preventDefault();
    if (editorAberto) $("#editor-texto-aplicar").click();
    else $("#salvar").click();
    return;
  }
  if (e.key === "Escape" && editorAberto) return; // o próprio dialog fecha
  if (e.key === "Escape" && document.body.classList.contains("editando")) fechar();
});
window.addEventListener("beforeunload", e => {
  if (!sujo) return;
  e.preventDefault();
  e.returnValue = "";
});

(async () => {
  try {
    const r = await api("/api/estado");
    projetos = r.projetos;
    ordemTodos = r.ordemTodos || {};
    areas = r.areas;
    areasEditaveis = r.areasCompletas || r.areas;
    garantirIdsProjetos();
    sincronizarSoftwares();
    desenharLista();
    ligarFrame();
    if (!token || token.indexOf("__PAINEL") === 0)
      status("abra com node tools/painel.js (o servidor entrega o token)", true);
  } catch (e) { status("erro ao carregar: " + e.message, true); }
})();
</script>
