<!-- tools/painel.html -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel — cayogomes.com.br</title>
<style>
:root{--ink:#050506;--panel:#0b0c0e;--line:rgba(255,255,255,.14);--white:#f4f4f2;--mute:#8d9490;--accent:#ef2b31}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--white);font:400 14px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);background:#07080a;flex:0 0 auto;z-index:40}
header strong{font:400 1rem ui-monospace,Consolas,monospace;letter-spacing:.22em}
#sujo{font:400 .78rem ui-monospace,Consolas,monospace;color:#f0b429;border:1px solid rgba(240,180,41,.4);border-radius:4px;padding:.15rem .45rem}
#sujo[hidden]{display:none}
#status{font:400 .78rem ui-monospace,Consolas,monospace;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status.ok{color:#39d98a} #status.err{color:#ff5a5f}
.acoes{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex:0 0 auto}
button{background:none;border:1px solid var(--line);color:var(--white);padding:.4rem .7rem;border-radius:6px;cursor:pointer;font:inherit}
button:hover{border-color:var(--mute)}
button.pri{background:var(--accent);border-color:var(--accent);color:#0a0a0a;font-weight:600}
button.git{color:#39d98a;border-color:rgba(57,217,138,.4)}
button.git:hover{background:rgba(57,217,138,.1);border-color:#39d98a}
button.git.pull{color:var(--mute);border-color:var(--line)}
button.git.pull:hover{color:var(--white);background:rgba(255,255,255,.06);border-color:var(--mute)}
button.perigo{color:#ff5a5f;border-color:rgba(255,90,95,.4)}
button:disabled{opacity:.35;cursor:default}
a{color:var(--mute);text-decoration:none;font-size:.82rem}
a:hover{color:var(--white)}

.toggle-modo{display:flex;gap:2px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px}
.toggle-modo button{border:none;border-radius:4px;padding:.22rem .6rem;font:400 .76rem ui-monospace,Consolas,monospace;letter-spacing:.05em;color:var(--mute)}
.toggle-modo button.on{background:rgba(255,255,255,.13);color:var(--white)}
.toggle-modo button:hover{border-color:transparent;color:var(--white)}

main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0;position:relative}
body.editando main{grid-template-columns:300px 1fr min(420px,38vw)}

#lateral{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#08090b}
#filtros-lista{padding:.5rem;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.4rem;flex:0 0 auto}
#filtros-lista input { width:100%; background:#0f1114; border:1px solid var(--line); color:var(--white); padding:.4rem .5rem; border-radius:4px; font-size:.8rem; outline:none; }
#filtros-lista input:focus { border-color:var(--accent); }
#lateral-conteudo{overflow:auto;padding:.45rem;min-height:0;flex:1}

details.grupo { margin-bottom: .3rem; border-radius:6px; }
details.grupo > summary {
  font: 600 .78rem ui-monospace,Consolas,monospace;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  padding: .5rem .6rem;
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  user-select: none;
  border-radius: 4px;
  background:rgba(255,255,255,.02);
}
details.grupo > summary:hover { background: rgba(255,255,255,.06); }
details.grupo.selecionado > summary { border:1px solid var(--accent); background:rgba(239,43,49,.1); }
details.grupo > summary::-webkit-details-marker { display: none; }
details.grupo > summary::before { content: "▶"; font-size: .6rem; margin-right: .5rem; transition: transform .2s; color: var(--mute); }
details.grupo[open] > summary::before { transform: rotate(90deg); }

details.grupo-cat { margin-left: .5rem; margin-bottom: .1rem; }
details.grupo-cat > summary {
  font: 400 .7rem ui-monospace,Consolas,monospace;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--mute);
  padding: .4rem .5rem;
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  user-select: none;
  border-radius: 4px;
}
details.grupo-cat > summary:hover { color: var(--white); background: rgba(255,255,255,.04); }
details.grupo-cat > summary::-webkit-details-marker { display: none; }
details.grupo-cat > summary::before { content: "▸"; font-size: .7rem; margin-right: .4rem; color: var(--mute); }
details.grupo-cat[open] > summary::before { content: "▾"; }

.handle { cursor: grab; color: var(--mute); font-size: .9rem; flex-shrink: 0; width: 1.5rem; text-align: center; }
.handle:active { cursor: grabbing; }

ol{list-style:none;margin:0;padding:0;min-height:10px}
ol li {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .4rem .55rem;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background .2s, border-color .2s;
}
ol li:hover { background: rgba(255,255,255,.05); }
ol li.sel { border-color: var(--accent); background: rgba(239,43,49,.1); }
ol li b { font: 400 .78rem ui-monospace, Consolas, monospace; color: var(--mute); width: 1.5rem; flex-shrink: 0; text-align: left; }
ol li span:not(.handle) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; display: flex; align-items: center; gap: 4px; flex-grow: 1; }
ol li .handle { flex: 0 0 1.5rem; }
ol li em { font: 400 .66rem ui-monospace, Consolas, monospace; color: var(--mute); font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; text-align: right; }
ol li.vazio{display:block;color:var(--mute);cursor:default;font-size:.85rem;text-align:center;padding:1rem;margin:0;}

.dragging { opacity: 0.3; }
.drag-over-top { border-top: 2px solid var(--accent) !important; }
.drag-over-bottom { border-bottom: 2px solid var(--accent) !important; }
.drag-over-inside { background: rgba(239,43,49,.15) !important; border: 1px dashed var(--accent) !important; }

.aviso-icon { color: #f0b429; font-size: .85rem; cursor: help; line-height: 1; }

#palco{display:flex;flex-direction:column;min-width:0;min-height:0}
#ferramentas{display:flex;align-items:center;gap:.4rem;padding:.4rem .6rem;border-bottom:1px solid var(--line);font:400 .72rem ui-monospace,Consolas,monospace;color:var(--mute);flex:0 0 auto}
#ferramentas button{padding:.2rem .5rem;font:400 .72rem ui-monospace,Consolas,monospace;border-radius:4px}
#ferramentas button.on{border-color:var(--accent);color:var(--accent)}
#ferramentas .cresc{flex:1}
#ferramentas .dica{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ferramentas .sep{width:1px;height:14px;background:var(--line);margin:0 .2rem}

#moldura{flex:1;min-height:0;display:grid;place-items:center;padding:.7rem;background:#07080a;overflow:auto}
#prev{width:var(--larg,100%);height:100%;border:1px solid var(--line);border-radius:10px;background:var(--ink);display:block;box-shadow:0 18px 50px rgba(0,0,0,.55)}

#drawer{display:none;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
body.editando #drawer{display:flex}
.drawer-topo{display:flex;align-items:center;gap:.4rem;padding:.5rem .7rem;border-bottom:1px solid var(--line);flex:0 0 auto}
.drawer-topo span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 .76rem ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--mute)}
.drawer-topo button{padding:.2rem .5rem;font-size:.75rem}
#form{flex:1;overflow:auto;padding:.9rem 1rem 2rem;min-height:0}

label{display:block;margin-bottom:.7rem;font:400 .68rem ui-monospace,Consolas,monospace;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
input,select,textarea{display:block;width:100%;margin-top:.22rem;background:#0f1114;border:1px solid var(--line);color:var(--white);padding:.45rem .55rem;border-radius:6px;font:400 .92rem system-ui,sans-serif}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent)}
textarea{resize:vertical}
.linha{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
h3{font:400 .82rem ui-monospace,Consolas,monospace;letter-spacing:.1em;margin:1.1rem 0 .5rem;display:flex;align-items:center;gap:.6rem;text-transform:uppercase;color:var(--mute)}
.toggle-webp{display:inline-flex;align-items:center;gap:.35rem;margin:0 0 0 auto;font:400 .72rem ui-monospace,Consolas,monospace;text-transform:none;letter-spacing:0;color:var(--mute);cursor:pointer}
.toggle-webp input{width:auto;margin:0;accent-color:var(--accent)}
.midia{border:1px solid var(--line);border-radius:8px;padding:.6rem;margin-bottom:.6rem;background:#0e1013}
.midia .topo{display:flex;gap:.35rem;align-items:center;margin-bottom:.5rem;cursor:grab}
.midia .topo:active{cursor:grabbing}
.midia .topo select{width:auto;margin:0;padding:.3rem .4rem;font-size:.8rem}
.midia .topo .empurra{margin-left:auto}
.midia .topo button{padding:.2rem .45rem;font-size:.8rem}
.softwares{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.35rem}
.sw-btn{padding:.3rem .6rem;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:var(--mute);font:500 .78rem var(--mono);letter-spacing:.04em;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.sw-btn:hover{border-color:var(--accent);color:var(--white)}
.sw-btn.ativo{background:var(--accent);border-color:var(--accent);color:#050506}
.sw-add{margin-top:.35rem;padding:.25rem .55rem;border:1px dashed var(--line);border-radius:999px;background:transparent;color:var(--mute);font:500 .75rem var(--mono);cursor:pointer}
.sw-add:hover{border-color:var(--accent);color:var(--accent)}
.mini{max-width:100%;max-height:160px;object-fit:contain;border-radius:6px;border:1px solid var(--line);display:block;margin-top:.2rem;cursor:zoom-in;background:#000}
.mini-nao-imagem{display:inline-block;max-width:100%;margin-top:.2rem;padding:.3rem .5rem;border:1px dashed var(--line);border-radius:4px;font:400 .74rem ui-monospace,Consolas,monospace;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arquivo{display:inline-block;width:fit-content;margin:0;text-transform:none;letter-spacing:0;cursor:pointer;border:1px dashed var(--line);padding:.3rem .55rem;border-radius:6px;color:var(--mute);font-size:.78rem}
.arquivo:hover,.arquivo.recebendo{border-color:var(--mute);color:var(--white)}
.arquivo.recebendo{border-color:var(--accent);background:rgba(239,43,49,.08)}

.carrossel-opcao{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;margin-bottom:.7rem;background:#0e1013;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--white)}
.carrossel-opcao input{width:auto;margin:.15rem 0 0;accent-color:var(--accent)}
.carrossel-opcao b{display:block;font:500 .84rem system-ui,sans-serif;margin-bottom:.15rem}
.carrossel-opcao small{display:block;font:400 .75rem system-ui,sans-serif;color:var(--mute)}
.carrossel-opcao:has(input:checked){border-color:var(--accent);background:rgba(239,43,49,.08)}

.midia.dragging { opacity: 0.4; border: 1px dashed var(--accent); }
.midia.drag-over { border-top: 2px solid var(--accent); }

#seletor{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.dica{color:var(--mute);font-size:.88rem}

.cat{border:1px solid var(--line);border-radius:8px;padding:.55rem .6rem;margin-bottom:.5rem;background:#0e1013;display:grid;gap:.4rem}
.cat-topo{display:flex;gap:.3rem;align-items:center}
.cat-topo .num{font:400 .72rem ui-monospace,Consolas,monospace;color:var(--mute)}
.cat-topo .empurra{margin-left:auto}
.cat-topo button{padding:.18rem .4rem;font-size:.8rem}
.cat-linha{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.cat-id input{font:400 .82rem ui-monospace,Consolas,monospace}
.aviso-id{font:400 .7rem ui-monospace,Consolas,monospace;color:#f0b429;margin-top:.3rem;padding:.4rem .5rem;background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.25);border-radius:4px;display:flex;justify-content:space-between;align-items:center;gap:1rem}

@media(max-width:1400px){
  body.editando main{grid-template-columns:300px 1fr}
  #drawer{position:absolute;top:0;right:0;bottom:0;width:min(460px,92vw);z-index:50;box-shadow:-20px 0 50px rgba(0,0,0,.65);border-top:1px solid var(--line)}
}
@media(max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #lateral{border-right:0;border-bottom:1px solid var(--line);max-height:40vh}
  #ferramentas .dica{display:none}
}
</style>
</head>
<body>
<header>
  <strong>PAINEL</strong>
  <div class="toggle-modo">
    <button data-modo="areas">áreas</button>
    <button data-modo="categorias">categorias</button>
    <button class="on" data-modo="projetos">projetos</button>
  </div>
  <span id="sujo" hidden>não salvo</span>
  <span id="status"></span>
  <div class="acoes">
    <a href="/site" target="_blank">abrir site ↗</a>
    <button id="git-pull" class="git pull" title="Baixar as últimas alterações do GitHub (git pull)">↓ pull</button>
    <button id="git-push" class="git push" title="Salvar e enviar para o GitHub (git push)">↑ push</button>
    <button id="novo">+ projeto</button>
    <button id="novo-carrossel" title="novo projeto com as imagens em sequência contínua">+ carrossel</button>
    <button id="salvar" class="pri">salvar</button>
  </div>
</header>

<main>
  <nav id="lateral">
    <div id="filtros-lista">
      <input type="search" id="busca-projeto" placeholder="Buscar projeto..." autocomplete="off">
    </div>
    <div id="lateral-conteudo">
      <div id="lista"></div>
    </div>
  </nav>

  <section id="palco">
    <div id="ferramentas">
      <button id="recarregar" title="recarregar o site inteiro">⟳ recarregar site</button>
      <i class="sep"></i>
      <button data-largura="100%" class="on" title="largura total">desktop</button>
      <button data-largura="390px" title="largura de celular">celular</button>
      <i class="cresc"></i>
      <span class="dica">o site ao lado mostra o que já foi salvo</span>
    </div>
    <div id="moldura"><iframe id="prev" src="/site" title="site cayogomes.com.br"></iframe></div>
  </section>

  <aside id="drawer">
    <div class="drawer-topo">
      <span id="drawer-titulo"></span>
      <button id="preview-projeto" title="atualizar preview do site com este projeto">⟳</button>
      <button id="duplicar" title="duplicar este projeto">duplicar</button>
<button id="apagar" class="perigo" title="apagar este projeto">apagar</button>
      <button id="ver-site" title="abrir este projeto no site ao lado">ver no site</button>
      <button id="fechar-drawer" title="fechar">×</button>
    </div>
    <div id="form"></div>
  </aside>
</main>

<input type="file" id="seletor" multiple tabindex="-1" aria-hidden="true">

<script>
const token = "__PAINEL_TOKEN__";
let projetos = [], areas = [], areasEditaveis = [];
let projetoSelecionado = null, areaSelecionada = null, categoriaSelecionada = null;
let sujo = false, modoAtual = 'projetos';
let idOriginalArea = '';

let buscaProjeto = '';
let dragType = null;
let dragData = null;

const gruposFechados = new Set();

function chaveDetails(d, modo = modoAtual) {
  if (d.dataset.catId) return `${modo}:cat:${d.dataset.areaId}:${d.dataset.catId}`;
  if (d.dataset.areaId) return `${modo}:area:${d.dataset.areaId}`;
  return '';
}

function estaAberto(modo, tipo, areaId, catId) {
  const k = tipo === 'cat' ? `${modo}:cat:${areaId}:${catId}` : `${modo}:area:${areaId}`;
  return !gruposFechados.has(k);
}

function sincronizarAccordionsDOM(modo = modoAtual) {
  if (modo === 'projetos' && buscaProjeto) return;
  document.querySelectorAll('#lista details').forEach(d => {
    const k = chaveDetails(d, modo);
    if (!k) return;
    if (d.open) gruposFechados.delete(k);
    else gruposFechados.add(k);
  });
}

function abrirGrupoDoProjeto(p) {
  if (!p) return;
  gruposFechados.delete(`projetos:area:${p.area}`);
  gruposFechados.delete(`projetos:cat:${p.area}:${p.cat || 'sem-cat'}`);
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const indiceProjeto = p => projetos.indexOf(p);
const indiceArea = a => areasEditaveis.indexOf(a);
const areaDaCategoria = c => areasEditaveis.find(a => (a.cats || []).includes(c)) || null;
const indiceCategoria = c => { const a = areaDaCategoria(c); return a ? (a.cats || []).indexOf(c) : -1; };
function projetoAtual() { return projetoSelecionado && projetos.includes(projetoSelecionado) ? projetoSelecionado : null; }
function areaAtual() { return areaSelecionada && areasEditaveis.includes(areaSelecionada) ? areaSelecionada : null; }
function categoriaAtual() { const a = areaDaCategoria(categoriaSelecionada); return categoriaSelecionada && a && (a.cats || []).includes(categoriaSelecionada) ? categoriaSelecionada : null; }

function atualizarSelecaoVisual() {
  document.querySelectorAll('#lista .sel, #lista .selecionado').forEach(el => el.classList.remove('sel', 'selecionado'));
  
  if (projetoSelecionado) {
    const idx = projetos.indexOf(projetoSelecionado);
    const li = document.querySelector(`#lista li[data-i="${idx}"]`);
    if (li) li.classList.add('sel');
  }
  if (areaSelecionada) {
    const details = document.querySelector(`#lista details[data-area-id="${areaSelecionada.id}"]`);
    if (details) details.classList.add('selecionado');
    const idx = areasEditaveis.indexOf(areaSelecionada);
    const li = document.querySelector(`#lista li[data-ai="${idx}"]:not([data-ci])`);
    if (li) li.classList.add('sel');
  }
  if (categoriaSelecionada) {
    const a = areaDaCategoria(categoriaSelecionada);
    if (a) {
      const ai = areasEditaveis.indexOf(a);
      const ci = a.cats.indexOf(categoriaSelecionada);
      const li = document.querySelector(`#lista li[data-ai="${ai}"][data-ci="${ci}"]`);
      if (li) li.classList.add('sel');
    }
  }
}

function fecharDrawer() {
  document.body.classList.remove("editando");
  projetoSelecionado = null;
  areaSelecionada = null;
  categoriaSelecionada = null;
  atualizarSelecaoVisual();
}

function atualizarTudo() {
  desenharLista();
  atualizarSelecaoVisual();
  if (document.body.classList.contains('editando')) {
    if (modoAtual === 'projetos' && projetoAtual()) desenharForm();
    else if (modoAtual === 'areas' && areaAtual()) desenharFormArea();
    else if (modoAtual === 'categorias' && categoriaAtual()) desenharFormCat();
  }
}

/* Redesenha lista + drawer a partir da seleção atual. Usado depois de salvar,
   reordenar, mover e apagar. Sem seleção válida, fecha a gaveta. */
function abrirFormulario() {
  desenharLista();
  atualizarSelecaoVisual();
  if (modoAtual === 'projetos' && projetoAtual()) desenharForm();
  else if (modoAtual === 'areas' && areaAtual()) desenharFormArea();
  else if (modoAtual === 'categorias' && categoriaAtual()) desenharFormCat();
  else fechar();
}

async function api(rota, corpo) {
  const r = await fetch(rota, {
    method: corpo === undefined ? "GET" : "POST",
    headers: { "content-type": "application/json", "x-painel-token": token },
    body: corpo === undefined ? undefined : JSON.stringify(corpo)
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(j.erro || ("HTTP " + r.status));
    err.log = j.log || "";
    throw err;
  }
  return j;
}

let tempo;
function status(msg, erro) {
  const el = $("#status");
  el.textContent = msg;
  el.className = erro ? "err" : "ok";
  clearTimeout(tempo);
  tempo = setTimeout(() => { el.textContent = ""; el.className = ""; }, 5000);
}

function marcarSujo(){ sujo = true; $("#sujo").hidden = false; }
function limparSujo(){ sujo = false; $("#sujo").hidden = true; }

const slug = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "item";
const WEB_IMG = /\.(webp|jpe?g|png|gif|avif|svg|bmp|ico)$/i;

const lerBase64 = f => new Promise((ok, err) => {
  if (!f) return err(new Error("nenhum arquivo selecionado"));
  const r = new FileReader();
  r.onload = () => ok(r.result);
  r.onerror = () => err(new Error("não consegui ler o arquivo " + f.name));
  r.onabort = () => err(new Error("leitura cancelada: " + f.name));
  r.readAsDataURL(f);
});

function setCampo(obj, caminho, valor) {
  if (!obj) return;
  const ks = caminho.split(".");
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]] = o[ks[i]] || {};
  o[ks[ks.length - 1]] = caminho === "h" ? (Number(valor) || 0) : valor;
}

const frame = $("#prev");
function ligarFrame() {
  try {
    const d = frame.contentDocument;
    if (!d) return;
    d.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "s") {
        e.preventDefault();
        $("#salvar").click();
      }
    });
  } catch (e) {}
}

function carregarPreview() {
  let antes = null;
  try {
    antes = frame.contentWindow.eval(`({ area: area, rolagem: scrollY, projeto: (document.querySelector("#dlg") && document.querySelector("#dlg").open) ? current : -1 })`);
  } catch (e) {}
  return new Promise(res => {
    frame.onload = () => {
      frame.onload = null;
      ligarFrame();
      if (antes) {
        try {
          const w = frame.contentWindow;
          if (antes.area) w.eval(`pick(${JSON.stringify(antes.area)}, false)`);
          if (antes.projeto >= 0) w.eval(`current = ${antes.projeto}; fill(${antes.projeto}); document.querySelector("#dlg").showModal();`);
          if (antes.rolagem) w.scrollTo(0, antes.rolagem);
        } catch (e) {}
      }
      res();
    };
    frame.src = "/site?v=" + Date.now();
  });
}

function atualizarPreviewProjeto() {
  const p = projetoAtual();
  if (!p) return;
  const i = projetos.indexOf(p);
  try {
    frame.contentWindow.eval(`pick(${JSON.stringify(p.area)}, true); current = ${i}; fill(${i}); document.querySelector("#dlg").showModal();`);
    status("Preview atualizado no site!");
  } catch (e) {
    status("Erro ao atualizar preview: " + e.message, true);
  }
}

function mudarModo(m) {
  sincronizarAccordionsDOM(modoAtual);
  modoAtual = m;
  document.querySelectorAll('[data-modo]').forEach(b => b.classList.toggle('on', b.dataset.modo === m));
  const btnCarrossel = $('#novo-carrossel');
  if (btnCarrossel) btnCarrossel.style.display = m === 'projetos' ? '' : 'none';
  
  if (m === 'projetos') {
    $('#novo').textContent = '+ projeto';
    $('#filtros-lista').style.display = 'flex';
    $('#ver-site').style.display = '';
    $('#duplicar').style.display = '';
    $('#preview-projeto').style.display = '';
    $('#apagar').style.display = '';
  } else if (m === 'areas') {
    $('#novo').textContent = '+ área';
    $('#filtros-lista').style.display = 'none';
    $('#ver-site').style.display = 'none';
    $('#duplicar').style.display = 'none';
    $('#preview-projeto').style.display = 'none';
    $('#apagar').style.display = 'none';
  } else if (m === 'categorias') {
    $('#novo').textContent = '+ categoria';
    $('#filtros-lista').style.display = 'none';
    $('#ver-site').style.display = 'none';
    $('#duplicar').style.display = 'none';
    $('#preview-projeto').style.display = 'none';
    $('#apagar').style.display = 'none';
  }
  
  desenharLista(true);
  
  if (m === 'projetos' && projetoSelecionado) {
    document.body.classList.add("editando");
    atualizarSelecaoVisual();
    desenharForm();
  } else if (m === 'areas' && areaSelecionada) {
    document.body.classList.add("editando");
    atualizarSelecaoVisual();
    desenharFormArea();
  } else if (m === 'categorias' && categoriaSelecionada) {
    document.body.classList.add("editando");
    atualizarSelecaoVisual();
    desenharFormCat();
  } else {
    document.body.classList.remove("editando");
    atualizarSelecaoVisual();
  }
}

function temProblema(p) {
  const avisos = [];
  if (!String(p.title?.pt || "").trim()) avisos.push("Falta título PT");
  if (!String(p.title?.en || "").trim()) avisos.push("Falta título EN");
  if (!p.media || p.media.length === 0) avisos.push("Sem mídias");
  return avisos;
}

function renderizarLinhasProjetos(lista) {
  return lista.map(p => {
    const i = projetos.indexOf(p);
    const avisos = temProblema(p);
    const avisoHTML = avisos.length ? `<span class="aviso-icon" title="${avisos.join(' • ')}">⚠️</span>` : "";
    const conta = p.media?.length ? p.media.length + " mídia(s)" : "sem mídia";
    return `<li class="${p === projetoSelecionado ? "sel" : ""}" data-i="${i}" draggable="true" title="${esc(p.title?.pt || "")}">
      <span class="handle" draggable="true" title="Arraste para reordenar">☰</span>
      <b>${String(i + 1).padStart(2, "0")}</b>
      <span>${esc(p.title?.pt || "(sem título)")} ${avisoHTML}</span>
      <em>${conta}</em>
    </li>`;
  }).join('');
}

function desenharListaProjetos() {
  const termo = buscaProjeto.toLowerCase();
  let html = '';
  
  areasEditaveis.forEach(area => {
    const projetosDaArea = projetos.filter(p => p.area === area.id);
    const abArea = (modoAtual === 'projetos' && buscaProjeto) || estaAberto('projetos', 'area', area.id) ? 'open' : '';
    
    html += `<details class="grupo" ${abArea} data-area-id="${area.id}">
      <summary>
        <span class="handle" draggable="true" title="Arraste para reordenar a área">☰</span>
        ${esc(area.name?.pt || '(sem nome)')}
      </summary>
      <div class="grupo-conteudo">`;

    const cats = area.cats || [];
    cats.forEach(cat => {
      const lista = projetosDaArea.filter(p => (p.cat || 'sem-cat') === cat.id);
      
      const listaFiltrada = lista.filter(p => {
        if (!termo) return true;
        return (p.title?.pt || "").toLowerCase().includes(termo) || 
               (p.title?.en || "").toLowerCase().includes(termo) ||
               (p.tools || "").toLowerCase().includes(termo);
      });

      if (termo && listaFiltrada.length === 0) return;

      const abCat = (modoAtual === 'projetos' && buscaProjeto) || estaAberto('projetos', 'cat', area.id, cat.id) ? 'open' : '';

      html += `<details class="grupo-cat" ${abCat} data-area-id="${area.id}" data-cat-id="${cat.id}">
        <summary>
          <span class="handle" draggable="true" title="Arraste para reordenar a categoria">☰</span>
          ${esc(cat.name.pt)}
        </summary>
        <ol data-area-id="${area.id}" data-cat-id="${cat.id}">`;

      html += listaFiltrada.length ? renderizarLinhasProjetos(listaFiltrada) : `<li class="vazio">vazio</li>`;
      html += `</ol></details>`;
    });

    const catIds = new Set(cats.map(c => c.id));
    const semCategoria = projetosDaArea.filter(p => !p.cat || !catIds.has(p.cat));
    const semCategoriaFiltrada = semCategoria.filter(p => {
      if (!termo) return true;
      return (p.title?.pt || "").toLowerCase().includes(termo) ||
        (p.title?.en || "").toLowerCase().includes(termo) ||
        (p.tools || "").toLowerCase().includes(termo);
    });
    
    if (semCategoriaFiltrada.length) {
      const abCat = (modoAtual === 'projetos' && buscaProjeto) || estaAberto('projetos', 'cat', area.id, 'sem-cat') ? 'open' : '';
      html += `<details class="grupo-cat" ${abCat} data-area-id="${area.id}" data-cat-id="sem-cat">
        <summary>
          Sem categoria
        </summary>
        <ol class="sem-cat-list" data-area-id="${area.id}" data-cat-id="sem-cat">${renderizarLinhasProjetos(semCategoriaFiltrada)}</ol>
      </details>`;
    }

    html += `</div></details>`;
  });

  $("#lista").innerHTML = html;
}

function desenharListaAreas() {
  $('#lista').innerHTML = areasEditaveis.map((a, i) => {
    const aberto = estaAberto('areas', 'area', a.id) ? 'open' : '';
    const selecionado = a === areaSelecionada ? ' selecionado' : '';
    return `<details class="grupo${selecionado}" ${aberto} draggable="true" data-area-id="${esc(a.id)}" data-ai="${i}">
      <summary>
        <span class="handle" draggable="true" title="Arraste para reordenar">☰</span>
        ${esc(a.name?.pt || '(sem nome)')}
      </summary>
      <div class="grupo-conteudo">
        <div class="dica" style="padding:.55rem .6rem .7rem">${String(i + 1).padStart(2, '0')} · ${esc(a.id || '—')}</div>
      </div>
    </details>`;
  }).join('') || '<p class="vazio">nenhuma área</p>';
}

function desenharListaCategorias() {
  let html = '';
  areasEditaveis.forEach((area, ai) => {
    const cats = area.cats || [];

    // Mesma estrutura visual das outras abas: grupo com summary + ol de linhas.
    const aberto = estaAberto('categorias', 'area', area.id) ? 'open' : '';
    const selecionado = area === areaSelecionada ? ' selecionado' : '';
    html += `<details class="grupo${selecionado}" ${aberto} draggable="true" data-area-id="${esc(area.id)}" data-ai="${ai}">
      <summary>
        <span class="handle" draggable="true" title="Arraste para reordenar a área">☰</span>
        ${esc(area.name?.pt || '(sem nome)')}
      </summary>
      <div class="grupo-conteudo"><ol data-area-id="${esc(area.id)}">`;
    cats.forEach((cat, ci) => {
      const isSel = (cat === categoriaSelecionada);
      html += `<li class="${isSel ? 'sel' : ''}" data-ai="${ai}" data-ci="${ci}" draggable="true" title="${esc(cat.name?.pt)}">
        <span class="handle" draggable="true" title="Arraste para reordenar">☰</span>
        <b>${String(ci + 1).padStart(2, '0')}</b>
        <span>${esc(cat.name?.pt || '(sem nome)')}</span>
        <em>${esc(cat.id)}</em>
      </li>`;
    });
    if (cats.length === 0) html += `<li class="vazio">nenhuma categoria</li>`;
    html += `</ol></div></details>`;
  });
  $("#lista").innerHTML = html || '<p class="vazio">nenhuma categoria</p>';
}

function desenharLista(jaSincronizado = false) {
  const lateral = $("#lateral-conteudo");
  const rolagem = lateral ? lateral.scrollTop : 0;
  if (!jaSincronizado) sincronizarAccordionsDOM(modoAtual);
  if (modoAtual === 'projetos') desenharListaProjetos();
  else if (modoAtual === 'areas') desenharListaAreas();
  else if (modoAtual === 'categorias') desenharListaCategorias();
  if (lateral) lateral.scrollTop = rolagem;
}

  if (!d || d.tagName !== "DETAILS") return;
  const k = chaveDetails(d, modoAtual);

}, true);

$("#lista").addEventListener("dragstart", e => {
  if (buscaProjeto && modoAtual === 'projetos') {
    status("Limpe a busca para reordenar", true);
    e.preventDefault();
    return;
  }

  sincronizarAccordionsDOM(modoAtual);

  // A linha inteira é arrastável (não só o "☰"), então o tipo é deduzido
  // pelo elemento em que o arraste começou.
  const li = e.target.closest("li[data-ci], li[data-ai], li[data-i]");
  const catGroup = e.target.closest("details.grupo-cat");
  const areaGroup = e.target.closest("details.grupo");

  const iniciar = (tipo, dados, el) => {
    dragType = tipo;
    dragData = dados;
    if (el) el.classList.add("dragging");
  };

  if (li && li.dataset.ci !== undefined) {
    iniciar('cat-item', { areaIndex: +li.dataset.ai, catIndex: +li.dataset.ci }, li);
  } else if (li && li.dataset.ai !== undefined) {
    iniciar('area-item', { areaIndex: +li.dataset.ai }, li);
  } else if (li && li.dataset.i !== undefined && modoAtual === 'projetos') {
    iniciar('proj', { index: +li.dataset.i }, li);
  } else if (catGroup && modoAtual === 'projetos') {
    if (catGroup.dataset.catId === 'sem-cat') { e.preventDefault(); return; }
    iniciar('cat', { areaId: catGroup.dataset.areaId, catId: catGroup.dataset.catId }, catGroup);
  } else if (areaGroup) {
    iniciar('area', { areaId: areaGroup.dataset.areaId }, areaGroup);
  } else {
    e.preventDefault();
  }
});

$("#lista").addEventListener("dragend", e => {
  document.querySelectorAll("#lista .dragging, #lista .drag-over-top, #lista .drag-over-bottom, #lista .drag-over-inside").forEach(el => {
    el.classList.remove("dragging", "drag-over-top", "drag-over-bottom", "drag-over-inside");
  });
  dragType = null;
  dragData = null;
});

$("#lista").addEventListener("dragover", e => {
  if (!dragType) return;
  e.preventDefault();

  document.querySelectorAll("#lista .drag-over-top, #lista .drag-over-bottom, #lista .drag-over-inside").forEach(el => {
    el.classList.remove("drag-over-top", "drag-over-bottom", "drag-over-inside");
  });

  const targetGroup = e.target.closest("details.grupo");
  const targetCatGroup = e.target.closest("details.grupo-cat");
  const targetSemCatList = e.target.closest("ol.sem-cat-list");
  const targetLiProj = e.target.closest("li[data-i]");
  const targetLiItem = e.target.closest("li[data-ai]");
  // para grupos abertos, a metade certa é a do cabeçalho (summary), não a do bloco inteiro
  const rectDoGrupo = el => (el.querySelector(":scope > summary") || el).getBoundingClientRect();

  if (dragType === 'area' && targetGroup && targetGroup.dataset.areaId !== dragData.areaId) {
    const rect = rectDoGrupo(targetGroup);
    targetGroup.classList.add(e.clientY < rect.top + rect.height / 2 ? "drag-over-top" : "drag-over-bottom");
  }
  else if (dragType === 'cat' && targetCatGroup && targetCatGroup.dataset.areaId === dragData.areaId && targetCatGroup.dataset.catId !== dragData.catId) {
    const rect = rectDoGrupo(targetCatGroup);
    targetCatGroup.classList.add(e.clientY < rect.top + rect.height / 2 ? "drag-over-top" : "drag-over-bottom");
  }
  else if (dragType === 'proj') {
    if (targetLiProj && +targetLiProj.dataset.i !== dragData.index) {
      const rect = targetLiProj.getBoundingClientRect();
      targetLiProj.classList.add(e.clientY < rect.top + rect.height / 2 ? "drag-over-top" : "drag-over-bottom");
    } else if ((targetCatGroup || targetSemCatList) && !targetLiProj) {
      (targetCatGroup || targetSemCatList).classList.add("drag-over-inside");
    }
  }
  else if (dragType === 'area-item' && targetLiItem && +targetLiItem.dataset.ai !== dragData.areaIndex) {
    const rect = targetLiItem.getBoundingClientRect();
    targetLiItem.classList.add(e.clientY < rect.top + rect.height / 2 ? "drag-over-top" : "drag-over-bottom");
  }
  else if (dragType === 'cat-item' && targetLiItem && targetLiItem.dataset.ci !== undefined && +targetLiItem.dataset.ai === dragData.areaIndex) {
    if (+targetLiItem.dataset.ci !== dragData.catIndex) {
      const rect = targetLiItem.getBoundingClientRect();
      targetLiItem.classList.add(e.clientY < rect.top + rect.height / 2 ? "drag-over-top" : "drag-over-bottom");
    }
  }
});

$("#lista").addEventListener("drop", e => {
  if (!dragType) return;
  e.preventDefault();

  const type = dragType;
  const data = dragData;
  dragType = null;
  dragData = null;

  document.querySelectorAll("#lista .dragging, #lista .drag-over-top, #lista .drag-over-bottom, #lista .drag-over-inside").forEach(el => {
    el.classList.remove("dragging", "drag-over-top", "drag-over-bottom", "drag-over-inside");
  });

  const targetGroup = e.target.closest("details.grupo");
  const targetCatGroup = e.target.closest("details.grupo-cat");
  const targetSemCatList = e.target.closest("ol.sem-cat-list");
  const targetLiProj = e.target.closest("li[data-i]");
  const targetLiItem = e.target.closest("li[data-ai]");
  const rectDoGrupo = el => (el.querySelector(":scope > summary") || el).getBoundingClientRect();

  try {
    if (type === 'area' && targetGroup && targetGroup.dataset.areaId !== data.areaId) {
      const fromIndex = areasEditaveis.findIndex(a => a.id === data.areaId);
      let toIndex = areasEditaveis.findIndex(a => a.id === targetGroup.dataset.areaId);
      if (fromIndex === -1 || toIndex === -1) return;
      const rect = rectDoGrupo(targetGroup);
      if (e.clientY >= rect.top + rect.height / 2) toIndex++;
      const item = areasEditaveis.splice(fromIndex, 1)[0];
      areasEditaveis.splice(toIndex > fromIndex ? toIndex - 1 : toIndex, 0, item);
      marcarSujo();
      setTimeout(() => { abrirFormulario(); status("Ordem das áreas atualizada!"); }, 10);
    }
    else if (type === 'cat' && targetCatGroup && targetCatGroup.dataset.areaId === data.areaId && targetCatGroup.dataset.catId !== data.catId) {
      const area = areasEditaveis.find(a => a.id === data.areaId);
      if (!area || data.catId === 'sem-cat' || targetCatGroup.dataset.catId === 'sem-cat') return;
      const fromIndex = area.cats.findIndex(c => c.id === data.catId);
      let toIndex = area.cats.findIndex(c => c.id === targetCatGroup.dataset.catId);
      if (fromIndex === -1 || toIndex === -1) return;
      const rect = rectDoGrupo(targetCatGroup);
      if (e.clientY >= rect.top + rect.height / 2) toIndex++;
      const item = area.cats.splice(fromIndex, 1)[0];
      area.cats.splice(toIndex > fromIndex ? toIndex - 1 : toIndex, 0, item);
      marcarSujo();
      setTimeout(() => { abrirFormulario(); status("Ordem das categorias atualizada!"); }, 10);
    }
    else if (type === 'proj') {
      if (targetLiProj) {
        const targetIndex = +targetLiProj.dataset.i;
        if (targetIndex !== data.index && projetos[data.index] && projetos[targetIndex]) {
          const rect = targetLiProj.getBoundingClientRect();
          const dropAfter = e.clientY >= rect.top + rect.height / 2;
          const proj = projetos[data.index];
          const alvoProj = projetos[targetIndex];
          proj.area = alvoProj.area;
          if (alvoProj.cat) proj.cat = alvoProj.cat; else delete proj.cat;
          projetos.splice(data.index, 1);
          let insertIndex = targetIndex;
          if (!dropAfter) insertIndex = targetIndex > data.index ? targetIndex - 1 : targetIndex;
          else insertIndex = targetIndex > data.index ? targetIndex : targetIndex + 1;
          projetos.splice(insertIndex, 0, proj);
          abrirGrupoDoProjeto(proj);
          marcarSujo();
          projetoSelecionado = proj;
          setTimeout(() => { abrirFormulario(); status("Projeto reordenado!"); }, 10);
        }
      } else if (targetCatGroup || targetSemCatList) {
        const targetCategory = targetCatGroup || targetSemCatList;
        const catId = targetCategory.dataset.catId;
        const areaId = targetCategory.dataset.areaId;
        const proj = projetos[data.index];
        if (proj && ((proj.cat || 'sem-cat') !== catId || proj.area !== areaId)) {
          proj.area = areaId;
          if (catId === 'sem-cat') delete proj.cat; else proj.cat = catId;
          projetos.splice(data.index, 1);
          projetos.push(proj);
          abrirGrupoDoProjeto(proj);
          marcarSujo();
          projetoSelecionado = proj;
          setTimeout(() => { abrirFormulario(); status("Projeto movido de categoria!"); }, 10);
        }
      }
    }
    else if (type === 'area-item' && targetLiItem && +targetLiItem.dataset.ai !== data.areaIndex) {
      const toIndex = +targetLiItem.dataset.ai;
      if (!areasEditaveis[data.areaIndex]) return;
      const rect = targetLiItem.getBoundingClientRect();
      const dropAfter = e.clientY >= rect.top + rect.height / 2;
      const item = areasEditaveis.splice(data.areaIndex, 1)[0];
      let insertIndex = toIndex;
      if (!dropAfter) insertIndex = toIndex > data.areaIndex ? toIndex - 1 : toIndex;
      else insertIndex = toIndex > data.areaIndex ? toIndex : toIndex + 1;
      areasEditaveis.splice(insertIndex, 0, item);
      areaSelecionada = item;
      marcarSujo();
      setTimeout(() => { abrirFormulario(); status("Ordem das áreas atualizada!"); }, 10);
    }
    else if (type === 'cat-item' && targetLiItem && targetLiItem.dataset.ci !== undefined && +targetLiItem.dataset.ai === data.areaIndex) {
      const toIndex = +targetLiItem.dataset.ci;
      const area = areasEditaveis[data.areaIndex];
      if (toIndex !== data.catIndex && area && area.cats && area.cats[data.catIndex]) {
        const rect = targetLiItem.getBoundingClientRect();
        const dropAfter = e.clientY >= rect.top + rect.height / 2;
        const item = area.cats.splice(data.catIndex, 1)[0];
        let insertIndex = toIndex;
        if (!dropAfter) insertIndex = toIndex > data.catIndex ? toIndex - 1 : toIndex;
        else insertIndex = toIndex > data.catIndex ? toIndex : toIndex + 1;
        area.cats.splice(insertIndex, 0, item);
        categoriaSelecionada = item;
        marcarSujo();
        setTimeout(() => { abrirFormulario(); status("Categoria reordenada!"); }, 10);
      }
    }
  } catch (err) {
    console.error("Erro no drop:", err);
    status("Erro ao reorganizar item.", true);
    desenharLista();
  }
});

$("#lista").addEventListener("click", e => {
  if (e.target.closest(".handle")) { e.preventDefault(); return; }

  const summaryArea = e.target.closest("details.grupo > summary");
  const summaryCat = e.target.closest("details.grupo-cat > summary");

  if (summaryArea) {
    e.preventDefault();
    const details = summaryArea.parentElement;
    const area = areasEditaveis.find(a => a.id === details.dataset.areaId);
    if (modoAtual === 'projetos') {
      details.open = !details.open;
      sincronizarAccordionsDOM('projetos');
    } else if (modoAtual === 'areas' && area) {
      if (areaSelecionada === area && document.body.classList.contains('editando')) {
        details.open = !details.open;
        sincronizarAccordionsDOM('areas');
      } else {
        details.open = true;
        sincronizarAccordionsDOM('areas');
        abrirArea(area);
      }
    } else if (modoAtual === 'categorias' && area) {
      if (areaSelecionada === area && !categoriaSelecionada) {
        details.open = !details.open;
        sincronizarAccordionsDOM('categorias');
      } else {
        details.open = true;
        sincronizarAccordionsDOM('categorias');
        areaSelecionada = area;
        categoriaSelecionada = null;
        atualizarSelecaoVisual();
      }
    }
    return;
  }
  if (summaryCat) {
    e.preventDefault();
    const details = summaryCat.parentElement;
    details.open = !details.open;
    sincronizarAccordionsDOM(modoAtual);
    return;
  }

  const li = e.target.closest("li[data-i]");
  if (li) { abrir(projetos[+li.dataset.i]); return; }
  const lia = e.target.closest("li[data-ai]");
  if (lia && lia.dataset.ci === undefined) { abrirArea(areasEditaveis[+lia.dataset.ai]); return; }
  const lic = e.target.closest("li[data-ci]");
  if (lic) { const a = areasEditaveis[+lic.dataset.ai]; if (a) abrirCat(a, a.cats?.[+lic.dataset.ci]); return; }
});

function novoProjeto(galeria) {
  const areaId = areasEditaveis[0]?.id || "";
  projetos.unshift({ area: areaId, cat: "", galeria: galeria || "slide", h: 0, tools: "",
    title: { pt: "", en: "" }, desc: { pt: "", en: "" }, media: [] });
  abrirGrupoDoProjeto(projetos[0]);
  marcarSujo();
  projetoSelecionado = projetos[0];
  desenharLista();
  abrir(projetoSelecionado);
  document.querySelector('[data-campo="title.pt"]')?.focus();
}

$("#novo").onclick = () => {
  if (modoAtual === 'projetos') {
    novoProjeto('slide');
  } else if (modoAtual === 'areas') {
    const tempId = "area-" + Date.now();
    areasEditaveis.push({ id: tempId, name: { pt: "", en: "" }, short: { pt: "", en: "" }, cats: [], lead: { pt: "", en: "" } });
    marcarSujo();
    areaSelecionada = areasEditaveis[areasEditaveis.length - 1];
    desenharLista();
    abrirArea(areaSelecionada);
    document.querySelector('[data-acampo="name.pt"]')?.focus();
  } else if (modoAtual === 'categorias') {
    if (areasEditaveis.length === 0) return status("Crie uma área primeiro", true);
    // usa a área que o usuário clicou (ou a da categoria aberta); senão a primeira
    const area = areaAtual() || areasEditaveis[0];
    area.cats = area.cats || [];
    area.cats.push({ id: "cat-" + Date.now(), name: { pt: "", en: "" } });
    gruposFechados.delete('categorias:area:' + area.id);
    marcarSujo();
    categoriaSelecionada = area.cats[area.cats.length - 1];
    desenharLista();
    abrirCat(area, categoriaSelecionada);
    document.querySelector('[data-catcampo="name.pt"]')?.focus();
  }
};

async function salvar() {
  const semTitulo = projetos.findIndex(p => !String(p.title?.pt || "").trim());
  if (semTitulo >= 0) {
    abrir(projetos[semTitulo]);
    status("o projeto " + String(semTitulo + 1).padStart(2, "0") + " está sem título", true);
    return false;
  }
  try {
    status("salvando…");
    areasEditaveis.forEach(a => {
      if (!a.id) a.id = slug(a.name?.pt) || "area-" + Date.now();
      (a.cats || []).forEach(c => { if (!c.id) c.id = slug(c.name?.pt) || "cat-" + Date.now(); });
    });
    projetos.forEach(p => {
      if (!p.area || !areasEditaveis.some(a => a.id === p.area)) p.area = areasEditaveis[0]?.id || "";
    });

    const idxProjetoSel = projetoSelecionado ? projetos.indexOf(projetoSelecionado) : -1;
    const areaSelecionadaId = areaSelecionada?.id;
    const categoriaSelecionadaId = categoriaSelecionada?.id;
    const categoriaSelecionadaAreaId = areaDaCategoria(categoriaSelecionada)?.id;

    await api("/api/projetos", { projetos });
    await api("/api/areas", { areas: areasEditaveis });
    
    const r = await api('/api/estado');
    if (Array.isArray(r.projetos)) {
      projetos = r.projetos;
      projetoSelecionado = idxProjetoSel >= 0 ? (projetos[idxProjetoSel] || null) : null;
    }
    areas = r.areas;
    areasEditaveis = r.areasCompletas || areasEditaveis;
    areaSelecionada = areasEditaveis.find(a => a.id === areaSelecionadaId) || null;
    const areaDaCategoriaNova = areasEditaveis.find(a => a.id === categoriaSelecionadaAreaId);
    categoriaSelecionada = areaDaCategoriaNova?.cats?.find(c => c.id === categoriaSelecionadaId) || null;

    limparSujo();
    await carregarPreview();
    abrirFormulario();
    status("salvo — o site atualizado");
    return true;
  } catch (e) {
    status("erro: " + e.message, true);
    return false;
  }
}

$("#salvar").onclick = salvar;

$("#git-pull").onclick = async () => {
  if (sujo) {
    if (!confirm("O painel tem alterações não salvas.\n\nBaixar do GitHub recarrega o painel e essas alterações serão perdidas.\n\nContinuar?")) return;
  } else if (!confirm("Baixar as últimas alterações do GitHub?\n\nO painel vai recarregar com o conteúdo novo.")) return;

  const btn = $("#git-pull");
  btn.disabled = true;
  status("Baixando do GitHub…");
  try {
    const r = await api("/api/git/pull");
    console.log(r.log);
    if (r.novos) {
      status(`Baixado: ${r.novos} commit(s) novo(s) — ${r.ultimo}`);
      setTimeout(() => location.reload(), 900);
    } else {
      status("Já estava atualizado");
    }
  } catch (e) {
    const log = e.log || "";
    if (log) console.error(log);
    let dica = "";
    if (/local changes|would be overwritten|unstaged|untracked/i.test(log))
      dica = " — envie (ou descarte) suas alterações locais antes de baixar.";
    else if (/fast-forward|non-fast-forward|diverged/i.test(log))
      dica = " — você tem commits locais não enviados.";
    else if (/couldn't find remote|no remote|does not appear to be a git/i.test(log))
      dica = " — confira o remote do repositório.";
    else if (/authentication|could not read Username|terminal prompts disabled/i.test(log))
      dica = " — o Git não está autenticado nesta máquina.";
    status("Erro ao baixar: " + e.message + dica, true);
  } finally {
    btn.disabled = false;
  }
};

$("#git-push").onclick = async () => {
  const msg = prompt("Mensagem do commit:", "Atualização via painel");
  if (msg === null) return;
  status("Enviando para o GitHub…");
  try {
    if (sujo) await salvar();
    const r = await api("/api/git/push", { mensagem: msg || "Atualização via painel" });
    status("Enviado com sucesso!");
    console.log(r.log);
  } catch (e) { status("Erro no Git: " + e.message, true); }
};

$("#apagar").onclick = apagarProjetoAtual;
function apagarProjetoAtual() {
  const removido = projetoAtual();
  if (!removido) return;
  const nome = removido.title?.pt || removido.title?.en || "este projeto";
  if (!confirm(`Apagar "${nome}" da lista? A pasta de imagens será removida ao salvar.`)) return;
  const pi = projetos.indexOf(removido);
  if (pi >= 0) projetos.splice(pi, 1);
  projetoSelecionado = projetos[Math.min(pi, projetos.length - 1)] || null;
  marcarSujo();
  if (!projetoSelecionado) fechar();
  atualizarTudo();
  status(`"${nome}" apagado — clique em salvar para confirmar.`);
}

// ---------- softwares (botões toggle) ----------
const SOFTWARES_BASE = ["ZBrush", "Blender", "Substance Painter"];
function softwaresCustom() {
  try { return JSON.parse(localStorage.getItem("painel_softwares") || "[]"); } catch (e) { return []; }
}
function salvarSoftwaresCustom(lista) {
  try { localStorage.setItem("painel_softwares", JSON.stringify(lista)); } catch (e) {}
}
function softwaresDisponiveis() {
  const custom = softwaresCustom();
  const set = new Set([...SOFTWARES_BASE, ...custom]);
  return [...set];
}
function parseTools(str) {
  return new Set(String(str || "").split(/[·,;]/).map(s => s.trim()).filter(Boolean));
}
function renderSoftwares() {
  const box = $("#softwares");
  if (!box) return;
  const p = projetoAtual();
  const selecionados = parseTools(p?.tools || "");
  // garante que softwares já salvos mas fora da lista apareçam
  const disponiveis = softwaresDisponiveis();
  for (const t of selecionados) if (!disponiveis.includes(t)) disponiveis.push(t);
  box.innerHTML = disponiveis.map(s => {
    const ativo = selecionados.has(s) ? " ativo" : "";
    return `<button type="button" class="sw-btn${ativo}" data-sw="${esc(s)}">${esc(s)}</button>`;
  }).join("");
}
$("#form").addEventListener("click", e => {
  if (e.target.closest("#add-software")) {
    const nome = prompt("Nome do software:");
    if (!nome || !nome.trim()) return;
    const n = nome.trim();
    const custom = softwaresCustom();
    if (![...SOFTWARES_BASE, ...custom].includes(n)) {
      custom.push(n);
      salvarSoftwaresCustom(custom);
    }
    const p = projetoAtual();
    if (p) {
      const selecionados = parseTools(p.tools || "");
      selecionados.add(n);
      p.tools = [...selecionados].join(" · ");
      marcarSujo();
    }
    renderSoftwares();
    return;
  }
  const b = e.target.closest(".sw-btn");
  if (!b) return;
  const p = projetoAtual();
  if (!p) return;
  const nome = b.dataset.sw;
  const selecionados = parseTools(p.tools || "");
  if (selecionados.has(nome)) selecionados.delete(nome); else selecionados.add(nome);
  p.tools = [...selecionados].join(" · ");
  marcarSujo();
  renderSoftwares();
});

      <span class="handle" draggable="true" title="Arraste para reordenar">☰</span>

        ${["image", "video", "sketchfab"].map(t => `<option value="${t}" ${t === tipo ? "selected" : ""}>${t}</option>`).join("")}
      </select>
      <button class="empurra" data-subir ${i === 0 ? "disabled" : ""} title="mover para cima">↑</button>
      <button data-descer ${i === total - 1 ? "disabled" : ""} title="mover para baixo">↓</button>

function abrir(p) {
  projetoSelecionado = p && projetos.includes(p) ? p : null;
  areaSelecionada = null;
  categoriaSelecionada = null;
  document.body.classList.add("editando");
  if (modoAtual !== 'projetos') { mudarModo('projetos'); return; }
  if (!$("#lista").firstElementChild) desenharLista(true);
  atualizarSelecaoVisual();
  if (projetoAtual()) desenharForm();
}
function abrirArea(a) {
  areaSelecionada = a && areasEditaveis.includes(a) ? a : null;
  categoriaSelecionada = null;
  idOriginalArea = areaSelecionada?.id || '';
  document.body.classList.add('editando');
  if (modoAtual !== 'areas') { mudarModo('areas'); return; }
  if (!$("#lista").firstElementChild) desenharLista(true);
  atualizarSelecaoVisual();
  if (areaAtual()) desenharFormArea();
}
function abrirCat(a, c) {
  categoriaSelecionada = a && c && (a.cats || []).includes(c) ? c : null;
  if (categoriaSelecionada) areaSelecionada = a;
  document.body.classList.add('editando');
  if (modoAtual !== 'categorias') { mudarModo('categorias'); return; }
  if (!$("#lista").firstElementChild) desenharLista(true);
  atualizarSelecaoVisual();
  if (categoriaAtual()) desenharFormCat();
}
function fechar() { document.body.classList.remove("editando"); }

$("#form").addEventListener("input", e => {
  const c = e.target.closest("[data-campo]");
  if (c) {
    if (c.dataset.campo === "carrossel") {
      projetoAtual().galeria = c.checked ? "carrossel" : "slide";
      marcarSujo();
      return;
    }
    setCampo(projetoAtual(), c.dataset.campo, c.value);
    if (c.dataset.campo === "title.pt") {
      $("#drawer-titulo").textContent = String(indiceProjeto(projetoAtual()) + 1).padStart(2, "0") + " · " + (c.value || "sem título");
      const li = document.querySelector(`li[data-i="${indiceProjeto(projetoAtual())}"] span:not(.handle)`);
      if (li) {
        const avisos = temProblema(projetoAtual());
        const avisoHTML = avisos.length ? `<span class="aviso-icon" title="${avisos.join(' • ')}">⚠️</span>` : "";
        li.innerHTML = `${esc(c.value || "(sem título)")} ${avisoHTML}`;
      }
    }
    marcarSujo();
    return;
  }
  
  const m = e.target.closest("[data-mcampo]");
  if (m && (m.dataset.mcampo === "src" || m.dataset.mcampo === "poster")) {
    const mi = +m.closest("[data-mi]").dataset.mi;
    projetoAtual().media[mi][m.dataset.mcampo] = m.value;
    marcarSujo();
    return;
  }
  const ca = e.target.closest('[data-acampo]');
  if (ca) {
    const a = areaAtual();
    if (!a) return;
    if (ca.dataset.acampo === 'id') a._autoId = false;
    setCampo(a, ca.dataset.acampo, ca.value);
    if (ca.dataset.acampo === 'name.pt') {
      $('#drawer-titulo').textContent = String(indiceArea(a) + 1).padStart(2, '0') + ' · ' + (ca.value || 'sem nome');
      if (a._autoId || /^area-\d+$/.test(a.id || '')) {
        a._autoId = true;
        const novoSlug = slug(ca.value);
        if (novoSlug && novoSlug !== 'item') {
          const antigoId = a.id;
          a.id = novoSlug;
          idOriginalArea = novoSlug;
          projetos.forEach(p => { if (p.area === antigoId) p.area = novoSlug; });
          const idInput = document.querySelector('[data-acampo="id"]');
          if (idInput) idInput.value = a.id;
          const det = document.querySelector(`#lista details[data-area-id="${antigoId}"]`);
          if (det) det.dataset.areaId = novoSlug;
          if (gruposFechados.has(`areas:area:${antigoId}`)) {
            gruposFechados.delete(`areas:area:${antigoId}`);
            gruposFechados.add(`areas:area:${novoSlug}`);
          }
        }
      }
      const det = document.querySelector(`#lista details[data-area-id="${a.id}"]`);
      const sum = det && det.querySelector(':scope > summary');
      if (sum) {
        const handle = sum.querySelector('.handle');
        sum.textContent = '';
        if (handle) sum.appendChild(handle);
        sum.append(' ' + (ca.value || '(sem nome)'));
      }
    }
    if (ca.dataset.acampo === 'id') {
      const rolagem = $('#form').scrollTop;
      desenharFormArea();
      $('#form').scrollTop = rolagem;
      const idInput = document.querySelector('[data-acampo="id"]');
      if (idInput) { idInput.focus(); idInput.setSelectionRange(ca.value.length, ca.value.length); }
      return;
    }
    marcarSujo();
    return;
  }
  const cc = e.target.closest('[data-catcampo]');
  if (cc) {
    let cat = null, area = null;
    if (modoAtual === 'categorias') {
      cat = categoriaAtual();
      area = areaDaCategoria(cat);
    } else {
      area = areaAtual();
      const ci = +cc.closest('[data-ci]').dataset.ci;
      cat = area?.cats?.[ci] || null;
    }
    if (!cat) return;
    if (cc.dataset.catcampo === 'id') cat._autoId = false;
    setCampo(cat, cc.dataset.catcampo, cc.value);
    if (cc.dataset.catcampo === 'name.pt') {
      if (modoAtual === 'categorias') $('#drawer-titulo').textContent = 'Cat · ' + (cc.value || 'sem nome');
      if (area && (cat._autoId || /^cat-\d+$/.test(cat.id || ''))) {
        cat._autoId = true;
        const baseSlug = slug(cc.value);
        if (baseSlug && baseSlug !== 'item') {
          const usados = new Set((area.cats || []).filter(x => x !== cat).map(x => x.id));
          let novoSlug = baseSlug, n = 2;
          while (usados.has(novoSlug)) novoSlug = baseSlug + '-' + (n++);
          const antigoId = cat.id;
          cat.id = novoSlug;
          projetos.forEach(p => { if (p.area === area.id && p.cat === antigoId) p.cat = novoSlug; });
          const box = cc.closest('.cat[data-ci]') || $('#form');
          const idInput = box.querySelector('[data-catcampo="id"]');
          if (idInput) idInput.value = novoSlug;
        }
      }
    }
    marcarSujo();
    return;
  }
});

$("#form").addEventListener("change", async e => {
  if (e.target.id === "opt-webp") {
    try { localStorage.setItem("painel_webp", e.target.checked ? "1" : "0"); } catch (err) {}
    return;
  }
  const tipo = e.target.closest('[data-mcampo="type"]');
  if (tipo) {
    const mi = +tipo.closest("[data-mi]").dataset.mi;
    projetoAtual().media[mi].type = tipo.value;
    marcarSujo();
    desenharForm();
    return;
  }
  const area = e.target.closest('[data-campo="area"]');
  if (area) {
    projetoAtual().area = area.value;
    projetoAtual().cat = "";
    abrirGrupoDoProjeto(projetoAtual());
    marcarSujo();
    desenharForm();
    desenharLista();
    atualizarSelecaoVisual();
    return;
  }
  const categoria = e.target.closest('[data-campo="cat"]');
  if (categoria) {
    projetoAtual().cat = categoria.value;
    abrirGrupoDoProjeto(projetoAtual());
    marcarSujo();
    desenharLista();
    atualizarSelecaoVisual();
    return;
  }
  const catArea = e.target.closest('[data-cat-area]');
  if (catArea) {
    const destino = areasEditaveis.find(a => a.id === catArea.value);
    const origem = areaDaCategoria(categoriaAtual());
    if (origem && destino && origem !== destino) {
      const catObj = categoriaAtual();
      origem.cats.splice(origem.cats.indexOf(catObj), 1);
      destino.cats = destino.cats || [];
      destino.cats.push(catObj);
      categoriaSelecionada = catObj;
      gruposFechados.delete('categorias:area:' + destino.id);
      marcarSujo();
      desenharFormCat();
      desenharLista();
      atualizarSelecaoVisual();
      status("Categoria movida de área!");
    }
    return;
  }
});

$("#form").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;

  if (b.id === 'corrigir-slug') {
    const novoId = areaAtual().id;
    const antigoId = idOriginalArea;
    projetos.forEach(p => { if (p.area === antigoId) p.area = novoId; });
    idOriginalArea = novoId;
    marcarSujo();
    desenharFormArea();
    desenharLista();
    status("Projetos vinculados ao novo ID com sucesso!");
    return;
  }

  if (b.id === 'apagar-cat') {
    if (confirm('Apagar esta categoria? Os projetos ficarão "Sem categoria".')) {
      const cat = categoriaAtual();
      const catArea = areaDaCategoria(cat);
      if (catArea) {
        catArea.cats.splice(catArea.cats.indexOf(cat), 1);
        projetos.forEach(p => { if (p.area === catArea.id && p.cat === cat.id) delete p.cat; });
      }
      categoriaSelecionada = null;
      marcarSujo();
      fechar();
      desenharLista();
      status("Categoria apagada!");
    }
    return;
  }

  const caixaCat = b.closest(".cat[data-ci]");
  if (caixaCat && areaAtual()) {
    const ci = +caixaCat.dataset.ci;
    const cats = areaAtual().cats || [];
    if (b.hasAttribute("data-cat-subir") && ci > 0) {
      [cats[ci - 1], cats[ci]] = [cats[ci], cats[ci - 1]];
      marcarSujo();
      const rolagem = $('#form').scrollTop;
      desenharFormArea();
      $('#form').scrollTop = rolagem;
      desenharLista();
      return;
    }
    if (b.hasAttribute("data-cat-descer") && ci < cats.length - 1) {
      [cats[ci + 1], cats[ci]] = [cats[ci], cats[ci + 1]];
      marcarSujo();
      const rolagem = $('#form').scrollTop;
      desenharFormArea();
      $('#form').scrollTop = rolagem;
      desenharLista();
      return;
    }
    if (b.hasAttribute("data-cat-remover")) {
      if (confirm('Apagar esta categoria? Os projetos ficarão "Sem categoria".')) {
        const [removida] = cats.splice(ci, 1);
        if (removida) {
          const areaId = areaAtual().id;
          projetos.forEach(p => { if (p.area === areaId && p.cat === removida.id) delete p.cat; });
          if (categoriaSelecionada === removida) categoriaSelecionada = null;
        }
        marcarSujo();
        const rolagem = $('#form').scrollTop;
        desenharFormArea();
        $('#form').scrollTop = rolagem;
        desenharLista();
        status("Categoria apagada!");
      }
      return;
    }
  }

  if (b.id === 'add-cat') {
    areaAtual().cats = areaAtual().cats || [];
    areaAtual().cats.push({ id: "cat-" + Date.now(), name: { pt: '', en: '' } });
    marcarSujo();
    const rolagem = $('#form').scrollTop;
    desenharFormArea();
    $('#form').scrollTop = rolagem;
    const catInputs = document.querySelectorAll('[data-catcampo="name.pt"]');
    catInputs[catInputs.length - 1]?.focus();
    return;
  }
  
  if (b.id === 'apagar-area') {
    if (confirm('Apagar esta área? Projetos que a usam ficarão sem área válida.')) {
      const removida = areaAtual();
      const ai = areasEditaveis.indexOf(removida);
      if (ai >= 0) areasEditaveis.splice(ai, 1);
      areaSelecionada = areasEditaveis[Math.min(ai, areasEditaveis.length - 1)] || null;
      marcarSujo();
      if (!areaSelecionada) fechar();
      else { idOriginalArea = areaSelecionada.id || ''; desenharFormArea(); }
      desenharLista();
    }
    return;
  }

  const caixa = b.closest("[data-mi]");
  const mi = caixa ? +caixa.dataset.mi : -1;
  const media = projetoAtual()?.media || [];

  if (b.hasAttribute("data-escolher")) {
    if (caixa) abrirSeletor(b.dataset.escolher, mi);
  }
  else if (b.id === "add-midia") {
    projetoAtual().media.push({ type: "image", src: "" });
    marcarSujo();
    desenharForm();
  }
  else if (b.hasAttribute("data-subir") && mi > 0) {
    [media[mi - 1], media[mi]] = [media[mi], media[mi - 1]];
    marcarSujo();
    desenharForm();
  }
  else if (b.hasAttribute("data-descer") && mi < media.length - 1) {
    [media[mi + 1], media[mi]] = [media[mi], media[mi + 1]];
    marcarSujo();
    desenharForm();
  }
  else if (b.hasAttribute("data-remover")) {
    media.splice(mi, 1);
    marcarSujo();
    desenharForm();
  }
});

const seletor = $("#seletor");
function abrirSeletor(alvo, mi) {
  seletor.value = "";
  seletor.multiple = alvo === "src";
  seletor.dataset.alvo = alvo;
  seletor.dataset.mi = String(mi);
  status(alvo === "src" ? "escolha uma ou mais imagens…" : "escolha a imagem de capa…");
  seletor.click();
}

seletor.addEventListener("change", () => {
  const lista = [...seletor.files];
  const alvo = seletor.dataset.alvo;
  const mi = +seletor.dataset.mi;
  seletor.value = "";
  if (lista.length) enviarArquivos(lista, alvo, mi);
});

async function otimizarImagemWebP(file) {
  if (!webpAtivo() || !/^image\/(png|jpeg|bmp)$/i.test(file.type || "")) return file;
  let bmp = null, url = null;
  try {
    const canvas = document.createElement("canvas");
    if (typeof createImageBitmap === "function") {
      bmp = await createImageBitmap(file);
      canvas.width = bmp.width;
      canvas.height = bmp.height;
      canvas.getContext("2d").drawImage(bmp, 0, 0);
    } else {
      url = URL.createObjectURL(file);
      const img = await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = rej;
        im.src = url;
      });
      canvas.width = img.naturalWidth || img.width;
      canvas.height = img.naturalHeight || img.height;
      canvas.getContext("2d").drawImage(img, 0, 0);
    }
    const blob = await new Promise(res => canvas.toBlob(res, "image/webp", 0.92));
    if (blob && blob.size > 0 && blob.size < file.size) {
      const base = file.name.replace(/\.[^.]+$/, "") || "imagem";
      return new File([blob], base + ".webp", { type: "image/webp" });
    }
  } catch (e) {
    // Se falhar a conversão no navegador, envia o arquivo original
  } finally {
    if (bmp && typeof bmp.close === "function") bmp.close();
    if (url) URL.revokeObjectURL(url);
  }
  return file;
}

function pastaDoProjeto(p) {
  for (const m of (p.media || [])) {
    for (const campo of ["src", "poster"]) {
      const val = m && m[campo];
      if (!val) continue;
      const match = /^img\/projetos\/([^/]+)\//.exec(val);
      if (match && match[1] && match[1] !== "item") return match[1];
    }
  }
  const titulo = String(p.title?.pt || p.title?.en || "").trim();
  if (titulo) return slug(titulo);
  p._pastaTemp = p._pastaTemp || ("novo-" + Date.now().toString(36));
  return p._pastaTemp;
}

async function enviarArquivos(lista, alvo, mi0) {
  const p = projetoAtual();
  if (!p || !p.media || !lista.length) return;
  if (!p.media[mi0]) p.media[mi0] = { type: "image", src: "" };

  const arquivos = [...lista];
  if (alvo !== "src") arquivos.length = 1;

  const pasta = pastaDoProjeto(p);
  let destino = mi0, ultimo = null, foraDoSite = [];

  for (let k = 0; k < arquivos.length; k++) {
    const original = arquivos[k];
    try {
      const f = await otimizarImagemWebP(original);
      status(arquivos.length > 1 ? "enviando " + (k + 1) + " de " + arquivos.length + ": " + f.name : "enviando " + f.name + "…");
      const dados = await lerBase64(f);
      const r = await api("/api/arquivo", { pasta, nome: f.name, dados });
      if (projetoAtual() !== p) return;
      if (k > 0) { p.media.splice(destino + 1, 0, { type: "image", src: "" }); destino += 1; }
      p.media[destino][alvo] = r.caminho;
      ultimo = r;
      if (alvo === "src" && !WEB_IMG.test(r.caminho)) foraDoSite.push(r.caminho.split("/").pop());
      marcarSujo();
      const rolagem = $("#form").scrollTop;
      desenharForm();
      $("#form").scrollTop = rolagem;
    } catch (err) {
      console.error(err);
      marcarSujo();
      desenharForm();
      status("erro ao enviar " + original.name + ": " + (err && err.message ? err.message : String(err)), true);
      return;
    }
  }

  const kb = r => r.bytes < 1024 ? r.bytes + " B" : Math.round(r.bytes / 1024) + " KB";
  const aviso = foraDoSite.length ? " — " + foraDoSite.join(", ") + (foraDoSite.length > 1 ? " não aparecem" : " não aparece") + " no site (use webp, jpg, png, gif ou avif)" : "";
  if (arquivos.length === 1) status("arquivo salvo: " + ultimo.caminho + " (" + kb(ultimo) + ")" + aviso, aviso !== "");
  else status(arquivos.length + " arquivos salvos" + aviso, aviso !== "");
}

let midiaDragIdx = null;
$("#form").addEventListener("dragstart", e => {
  const topo = e.target.closest(".midia .topo");
  if (!topo) return;
  const caixa = topo.closest(".midia[data-mi]");
  if (!caixa) return;
  midiaDragIdx = +caixa.dataset.mi;
  caixa.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", String(midiaDragIdx));
});
$("#form").addEventListener("dragend", () => {
  midiaDragIdx = null;
  document.querySelectorAll("#form .midia.dragging, #form .midia.drag-over").forEach(el => el.classList.remove("dragging", "drag-over"));
});
$("#form").addEventListener("dragover", e => {
  if (midiaDragIdx !== null) {
    const caixa = e.target.closest(".midia[data-mi]");
    document.querySelectorAll("#form .midia.drag-over").forEach(el => { if (el !== caixa) el.classList.remove("drag-over"); });
    if (caixa && +caixa.dataset.mi !== midiaDragIdx) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      caixa.classList.add("drag-over");
    }
    return;
  }
  const alvo = e.target.closest("[data-escolher]");
  if (!alvo) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
  alvo.classList.add("recebendo");
});
$("#form").addEventListener("dragleave", e => {
  if (midiaDragIdx !== null) {
    const caixa = e.target.closest(".midia[data-mi]");
    if (caixa && !caixa.contains(e.relatedTarget)) caixa.classList.remove("drag-over");
    return;
  }
  const alvo = e.target.closest("[data-escolher]");
  if (alvo) alvo.classList.remove("recebendo");
});
$("#form").addEventListener("drop", e => {
  if (midiaDragIdx !== null) {
    e.preventDefault();
    const origem = midiaDragIdx;
    midiaDragIdx = null;
    document.querySelectorAll("#form .midia.dragging, #form .midia.drag-over").forEach(el => el.classList.remove("dragging", "drag-over"));
    const caixa = e.target.closest(".midia[data-mi]");
    const media = projetoAtual()?.media;
    if (caixa && Array.isArray(media)) {
      const destino = +caixa.dataset.mi;
      if (destino !== origem && media[origem] && media[destino]) {
        const [item] = media.splice(origem, 1);
        media.splice(destino, 0, item);
        marcarSujo();
        const rolagem = $("#form").scrollTop;
        desenharForm();
        $("#form").scrollTop = rolagem;
      }
    }
    return;
  }
  const alvo = e.target.closest("[data-escolher]");
  if (!alvo) return;
  e.preventDefault();
  alvo.classList.remove("recebendo");
  const lista = [...(e.dataTransfer?.files || [])];
  const caixa = alvo.closest("[data-mi]");
  if (caixa && lista.length) enviarArquivos(lista, alvo.dataset.escolher, +caixa.dataset.mi);
});

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "s") {
    e.preventDefault();
    $("#salvar").click();
  }
  if (e.key === "Escape" && document.body.classList.contains("editando")) fechar();
});
window.addEventListener("beforeunload", e => {
  if (!sujo) return;
  e.preventDefault();
  e.returnValue = "";
});

(async () => {
  try {
    const r = await api("/api/estado");
    projetos = r.projetos;
    areas = r.areas;
    areasEditaveis = r.areasCompletas || r.areas;
    desenharLista();
    ligarFrame();
    if (!token || token.indexOf("__PAINEL") === 0)
      status("abra com node tools/painel.js (o servidor entrega o token)", true);
  } catch (e) { status("erro ao carregar: " + e.message, true); }
})();
